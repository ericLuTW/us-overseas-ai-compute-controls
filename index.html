<button type="button" aria-expanded="{{fOpen}}" onClick="{{toggleBox}}" style="appearance: none; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border: 0; border-radius: 8px; background: #eef0f3; font: inherit; font-size: 14.5px; font-weight: 700; color: #1f2433; cursor: pointer">篩選條件<span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: {{badgeBg}}; color: {{badgeFg}}; font-size: 12.5px; line-height: 22px; text-align: center">{{nActive}}</span><span style="font-size: 12px; color: #5a6070">{{boxChev}}</span></button>
<span style="font-size: 13.5px; color: #3a3f4d">{{matchLine}}</span>
<sc-if value="{{hasActive}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{clearAll}}" style="appearance: none; height: 34px; padding: 0 10px; border: 1px solid #e3d3b4; border-radius: 8px; background: #fbf6ec; font: inherit; font-size: 13px; color: #7a5a2e; cursor: pointer">清除全部 ✕</button></sc-if>
<label style="margin-left: auto; flex: 0 1 340px; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border: 1px solid #dde0e5; border-radius: 10px; background: #ffffff; box-sizing: border-box; color: #5a6070"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.8"></circle><path d="M10.6 10.6 14 14"></path></svg><input type="search" aria-label="搜尋政策或工具全文" placeholder="搜尋代碼、政策或工具全文" value="{{q}}" onChange="{{onQ}}" style="border: 0; outline: 0; background: transparent; font: inherit; font-size: 14px; color: #1f2433; width: 100%"></label>
</div>

<sc-if value="{{fOpen}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #eceef1">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; min-height: 36px">
<span style="flex: none; width: 44px; font-size: 13px; font-weight: 700; color: #5a6070">{{r.label}}</span>
<sc-if value="{{r.isChips}}" hint-placeholder-val="{{true}}">
<sc-for list="{{r.chips}}" as="c" hint-placeholder-count="5"><button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="appearance: none; height: 32px; padding: 0 12px; border: 1px solid {{c.border}}; border-radius: 999px; background: {{c.bg}}; font: inherit; font-size: 13.5px; font-weight: {{c.weight}}; color: {{c.fg}}; cursor: pointer; white-space: nowrap">{{c.label}}<span style="margin-left: 6px; font-size: 12px; color: {{c.subFg}}">{{c.n}}</span></button></sc-for>
</sc-if>
<sc-if value="{{r.isDd}}" hint-placeholder-val="{{false}}">
<sc-for list="{{r.dds}}" as="d" hint-placeholder-count="2">
<div style="position: relative; z-index: {{d.z}}">
<button type="button" aria-haspopup="true" aria-expanded="{{d.open}}" onClick="{{d.toggle}}" style="appearance: none; display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border: 1px solid {{d.border}}; border-radius: 8px; background: #ffffff; font: inherit; font-size: 13.5px; color: #1f2433; cursor: pointer; white-space: nowrap">{{d.label}}<span style="font-size: 12.5px; font-weight: 700; color: {{d.countFg}}">{{d.countText}}</span><span style="font-size: 11px; color: #5a6070">▾</span></button>
<sc-if value="{{d.isOpen}}" hint-placeholder-val="{{false}}">
<div role="menu" aria-label="{{d.label}}" style="position: absolute; top: 38px; left: 0; width: {{d.width}}; max-height: 360px; overflow-y: auto; padding: 6px; background: #ffffff; border: 1px solid #dde0e5; border-radius: 10px; box-shadow: 0 10px 28px rgba(20, 24, 40, 0.14); box-sizing: border-box">
<sc-for list="{{d.items}}" as="it" hint-placeholder-count="8">
<sc-if value="{{it.isHead}}" hint-placeholder-val="{{false}}"><div style="padding: 8px 8px 3px; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: #7a5a2e">{{it.label}}</div></sc-if>
<sc-if value="{{it.isItem}}" hint-placeholder-val="{{true}}"><button type="button" role="menuitemcheckbox" aria-checked="{{it.pressed}}" onClick="{{it.pick}}" style="appearance: none; display: flex; align-items: baseline; gap: 8px; width: 100%; min-height: 34px; padding: 6px 8px; border: 0; border-radius: 6px; background: {{it.bg}}; font: inherit; font-size: 13.5px; line-height: 1.45; color: #1f2433; text-align: left; cursor: pointer"><span style="flex: none; color: {{it.boxFg}}">{{it.box}}</span><span style="flex: 1 1 auto">{{it.label}}</span><span style="flex: none; font-size: 12px; color: #5a6070">{{it.n}}</span></button></sc-if>
</sc-for>
</div>
</sc-if>
</div>
</sc-for>
<sc-for list="{{r.sel}}" as="t" hint-placeholder-count="0"><button type="button" onClick="{{t.remove}}" aria-label="移除 {{t.label}}" style="appearance: none; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 0; border-radius: 999px; background: #2f3b6f; font: inherit; font-size: 12.5px; color: #ffffff; cursor: pointer; white-space: nowrap">{{t.label}}<span aria-hidden="true">✕</span></button></sc-for>
</sc-if>
</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ddAny}}" hint-placeholder-val="{{false}}"><button type="button" aria-label="關閉選單" onClick="{{closeDd}}" style="position: fixed; inset: 0; z-index: 10; border: 0; padding: 0; background: transparent; cursor: default"></button></sc-if>
</section>

<section style="background: #ffffff; border: 1px solid #dde0e5; border-radius: 16px; padding: 14px 14px 24px">
<sc-if value="{{isMatrix}}" hint-placeholder-val="{{false}}"><dc-import name="MatrixView" tool-ok="{{toolOk}}" open-policy="{{openPolicy}}" hint-size="100%,900px"></dc-import></sc-if>
<sc-if value="{{isLayers}}" hint-placeholder-val="{{true}}"><dc-import name="LayersView" pol-ok="{{polOk}}" open-policy="{{openPolicy}}" hint-size="100%,1300px"></dc-import></sc-if>
<sc-if value="{{isSupply}}" hint-placeholder-val="{{false}}"><dc-import name="SupplyView" tool-ok="{{toolOk}}" open-policy="{{openPolicy}}" hint-size="100%,800px"></dc-import></sc-if>
<sc-if value="{{isDb}}" hint-placeholder-val="{{false}}"><dc-import name="PolicyDB" pol-ok="{{polOk}}" tool-ok="{{toolOk}}" filtered="{{hasActive}}" selected="{{dbSel}}" focus="{{dbFocus}}" open-policy="{{openPolicy}}" hint-size="100%,900px"></dc-import></sc-if>
</section>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1400}}'>
class Component extends DCLogic {
  emptyF() { return { q: '', dirs: [], statuses: [], tracks: [], agencies: [], years: [], macros: [], subtypes: [], targets: [], nodes: [] }; }
  constructor(props) {
    super(props);
    this.state = { tab: 'layers', dbSel: null, dbFocus: false, f: this.emptyF(), fOpen: true, dd: null };
  }
  // Indexes over the static data blob, built once (filter dimensions follow the previous dashboard's matchRaw / polFiltered).
  ix() {
    if (this._ix) return this._ix;
    const B = window.__DATA_ZH; if (!B) return null;
    const D = B.D;
    const M = {}; Object.values(D.cells).forEach((l) => l.forEach((t) => { if (!M[t.no]) M[t.no] = t; }));
    const cats = {}; Object.entries(D.cells).forEach(([k, l]) => { const c = k.split('|||')[0]; l.forEach((t) => { (cats[t.no] = cats[t.no] || new Set()).add(c); }); });
    const nodes = {}; Object.entries(D.nodecells).forEach(([k, l]) => { const n = k.split('|||')[0]; l.forEach((t) => { (nodes[t.no] = nodes[t.no] || new Set()).add(n); }); });
    const pol = {}; D.pol.forEach((p) => { pol[p.code] = p; });
    const agencyOf = (p) => {
      const w = p.who || '';
      if (/BIS|OICTS/i.test(w)) return 'bis';
      if (/Treasury|財政/i.test(w)) return 'treasury';
      if (/Congress|國會|HFAC|Huizenga|Moolenaar|Rep\.|Sen\./i.test(w)) return 'congress';
      if (/President|總統|White House|白宮|OSTP/i.test(w)) return 'wh';
      if (/Commerce|商務|CHIPS|NIST|ITA/i.test(w)) return 'commerce';
      const txt = [p.id, p.law, p.bg].filter(Boolean).join(' ');
      if (/H\.R\.|S\.\s?\d|參院|眾院|國會|Public Law|HFAC|markup|Rep\.|Sen\./i.test(txt)) return 'congress';
      if (/ITA|International Trade Administration|商務部|Commerce|CHIPS|NIST/i.test(txt)) return 'commerce';
      if (/BIS/i.test(txt)) return 'bis';
      if (/EO\s?\d|Executive Order|總統|White House|白宮/i.test(txt)) return 'wh';
      return 'other';
    };
    const agency = {}; const yr = {};
    D.pol.forEach((p) => { agency[p.code] = agencyOf(p); const ys = (p.year || '').match(/\d{4}/g); yr[p.code] = ys ? Math.max(...ys.map(Number)) : null; });
    const ptools = {}; Object.entries(B.CODE_OF).forEach(([no, c]) => { if (M[no]) (ptools[c] = ptools[c] || []).push(+no); });
    const STX = {}; Object.values(M).forEach((t) => { const pc = B.CODE_OF[t.no] || ''; STX[t.no] = [t.tool, t.macro, t.grp, t.item, t.spec, t.act, t.op, t.appl, t.law, t.dir, t.note, pc, (pol[pc] || {}).disp].filter(Boolean).join(' ').toLowerCase(); });
    const PSTX = {}; D.pol.forEach((p) => { PSTX[p.code] = [p.code, p.disp, p.item, p.bg, p.body, p.who].filter(Boolean).join(' ').toLowerCase() + ' ' + (ptools[p.code] || []).map((no) => STX[no] || '').join(' '); });
    const subtypes = []; const seen = new Set();
    D.macros.forEach((m) => Object.values(M).forEach((t) => { if (t.macro === m && t.grp && !seen.has(t.grp)) { seen.add(t.grp); subtypes.push({ macro: m, grp: t.grp }); } }));
    this._ix = { B, D, M, cats, nodes, pol, agency, yr, ptools, STX, PSTX, subtypes };
    return this._ix;
  }
  renderVals() {
    const X = this.ix();
    const s = this.state; const f = s.f;
    const seg = (items, cur, key) => items.map((v) => ({ label: v.label, on: cur === v.id, off: cur !== v.id, pick: () => this.setState({ [key]: v.id, dbFocus: false }) }));
    const tabs = seg([{ id: 'layers', label: '制度層級' }, { id: 'matrix', label: '標的矩陣' }, { id: 'supply', label: '供應鏈版圖' }, { id: 'db', label: '政策資料庫' }], s.tab, 'tab');
    const openPolicy = (code) => this.setState({ tab: 'db', dbSel: code, dbFocus: true, dd: null });
    const base = { nPol: 0, nTool: 0, tabs, isMatrix: s.tab === 'matrix', isLayers: s.tab === 'layers', isSupply: s.tab === 'supply', isDb: s.tab === 'db', dbSel: s.dbSel, dbFocus: s.dbFocus, openPolicy };
    if (!X) return Object.assign(base, { q: '', onQ: () => {}, rows: [], fOpen: false, toggleBox: () => {}, nActive: 0, hasActive: false, matchLine: '', clearAll: () => {}, ddAny: false, closeDd: () => {}, badgeBg: '#dde0e5', badgeFg: '#3a3f4d', boxChev: '', toolOk: () => true, polOk: () => true });
    const { B, D, M, cats, nodes, pol, agency, yr, ptools, STX, PSTX, subtypes } = X;
    const bucket = (p) => (p || '').startsWith('T5') ? '現行生效' : ((p || '').startsWith('T1') ? '已撤銷' : '推進中');
    const q = (f.q || '').trim().toLowerCase();
    const has = (arr, v) => arr.length === 0 || arr.includes(v);
    const hasAny = (arr, set) => arr.length === 0 || (!!set && arr.some((v) => set.has(v)));
    const toolLevel = (no) => { const t = M[no]; return has(f.dirs, t.dir) && has(f.macros, t.macro) && has(f.subtypes, t.grp) && hasAny(f.targets, cats[no]) && hasAny(f.nodes, nodes[no]); };
    const polLevel = (c) => has(f.tracks, pol[c].track) && has(f.agencies, agency[c]) && has(f.years, yr[c]);
    const toolTier = f.dirs.length + f.macros.length + f.subtypes.length + f.targets.length + f.nodes.length > 0;
    const toolOk = (no) => { const t = M[no]; if (!t) return false; const c = B.CODE_OF[String(no)]; if (!pol[c]) return false; return polLevel(c) && toolLevel(no) && has(f.statuses, bucket(t.prog)) && (!q || (STX[no] || '').includes(q)); };
    const polOk = (c) => { if (!pol[c]) return false; return polLevel(c) && has(f.statuses, bucket(pol[c].prog)) && (!q || (PSTX[c] || '').includes(q)) && (!toolTier || (ptools[c] || []).some(toolLevel)); };

    const tog = (key, v) => () => { const cur = this.state.f[key]; const next = cur.includes(v) ? cur.filter((x) => x !== v) : cur.concat([v]); this.setState({ f: Object.assign({}, this.state.f, { [key]: next }) }); };
    const chip = (key, v, label, n) => { const on = f[key].includes(v); return { label, n: n == null ? '' : String(n), pressed: on ? 'true' : 'false', pick: tog(key, v), border: on ? '#2f3b6f' : '#d5d9e0', bg: on ? '#2f3b6f' : '#ffffff', fg: on ? '#ffffff' : '#3a3f4d', subFg: on ? '#d6dbf0' : '#8a909c', weight: on ? 700 : 400 }; };
    const allTools = Object.keys(M).map(Number);
    const cnt = (pred) => D.pol.filter(pred).length;
    const DIRS = ['限制', '監測', '促進', '監督制衡', '制度設計'];
    const TRK = { EW: 'EW 白宮', EB: 'EB BIS 規則', LC: 'LC 國會', M: 'M 索引', BL: 'BL 基線' };
    const AG = [['wh', '白宮／總統'], ['bis', 'BIS'], ['treasury', '財政部'], ['commerce', '商務部（其他）'], ['congress', '國會'], ['other', '未指明']];
    const SHORT = { N1: 'EDA／核心 IP', N2: '製造設備', N3: '材料', N4: '設計', N5: '製造（fab）', N6: '封裝測試', N7: 'AI 硬體成品', N8: '機房／網通', N9: '電力水連網', N10: '資料中心建置', N11: '資料中心營運', N12: '算力供給／遠距', N13: '演算法／資料', N14: 'AI 訓練', N15: '終端用途' };
    const tracksPresent = B.TRACKS.map((t) => t.code).filter((c) => D.pol.some((p) => p.track === c));
    const years = [...new Set(D.pol.map((p) => yr[p.code]).filter(Boolean))].sort((a, b) => b - a);

    const dd = (id, label, key, options, width) => {
      const isOpen = s.dd === id; const n = f[key].length;
      return {
        label, open: isOpen ? 'true' : 'false', isOpen, z: isOpen ? 20 : 'auto', width,
        border: n ? '#2f3b6f' : '#d5d9e0', countText: n ? String(n) : '全部', countFg: n ? '#2f3b6f' : '#8a909c',
        toggle: () => this.setState({ dd: this.state.dd === id ? null : id }),
        items: options.map((o) => {
          if (o.head) return { isHead: true, isItem: false, label: o.head, box: '', boxFg: '', n: '', pressed: 'false', bg: 'transparent', pick: () => {} };
          const on = f[key].includes(o.v);
          return { isHead: false, isItem: true, label: o.label, n: o.n == null ? '' : String(o.n), box: on ? '☑' : '☐', boxFg: on ? '#2f3b6f' : '#8a909c', pressed: on ? 'true' : 'false', bg: on ? '#eef0f6' : 'transparent', pick: tog(key, o.v) };
        })
      };
    };
    const selTags = (key, labelOf) => f[key].map((v) => ({ label: labelOf(v), remove: tog(key, v) }));
    const subOpts = []; D.macros.forEach((m) => { const g = subtypes.filter((x) => x.macro === m); if (g.length) { subOpts.push({ head: m }); g.forEach((x) => subOpts.push({ v: x.grp, label: x.grp, n: allTools.filter((no) => M[no].grp === x.grp).length })); } });
    const rows = [
      { label: '方向', isChips: true, isDd: false, chips: DIRS.map((d) => chip('dirs', d, d, allTools.filter((no) => M[no].dir === d).length)), dds: [], sel: [] },
      { label: '進度', isChips: true, isDd: false, chips: ['現行生效', '推進中', '已撤銷'].map((k) => chip('statuses', k, k, cnt((p) => bucket(p.prog) === k))), dds: [], sel: [] },
      { label: '軌道', isChips: true, isDd: false, chips: tracksPresent.map((c) => chip('tracks', c, TRK[c] || c, cnt((p) => p.track === c))), dds: [], sel: [] },
      { label: '機關', isChips: true, isDd: false, chips: AG.filter(([k]) => D.pol.some((p) => agency[p.code] === k)).map(([k, l]) => chip('agencies', k, l, cnt((p) => agency[p.code] === k))), dds: [], sel: [] },
      { label: '時間', isChips: false, isDd: true, chips: [], dds: [dd('years', '年份', 'years', years.map((y) => ({ v: y, label: String(y), n: cnt((p) => yr[p.code] === y) })), '200px')], sel: selTags('years', String) },
      { label: '工具', isChips: false, isDd: true, chips: [], dds: [dd('macros', '大類', 'macros', D.macros.map((m) => ({ v: m, label: m, n: allTools.filter((no) => M[no].macro === m).length })), '280px'), dd('subtypes', '細類', 'subtypes', subOpts, '320px')], sel: selTags('macros', String).concat(selTags('subtypes', String)) },
      { label: '對象', isChips: false, isDd: true, chips: [], dds: [dd('targets', '標的', 'targets', D.cats.map((c) => ({ v: c, label: c, n: allTools.filter((no) => cats[no] && cats[no].has(c)).length })), '320px'), dd('nodes', '供應鏈節點', 'nodes', D.nodes.map((n) => ({ v: n.id, label: n.id + '　' + (SHORT[n.id] || n.name), n: allTools.filter((no) => nodes[no] && nodes[no].has(n.id)).length })), '260px')], sel: selTags('targets', String).concat(selTags('nodes', (v) => v + ' ' + (SHORT[v] || ''))) }
    ];
    const nActive = ['dirs', 'statuses', 'tracks', 'agencies', 'years', 'macros', 'subtypes', 'targets', 'nodes'].reduce((a, k) => a + f[k].length, 0) + (q ? 1 : 0);
    const nPolOk = D.pol.filter((p) => polOk(p.code)).length;
    const nToolOk = allTools.filter(toolOk).length;
    return Object.assign(base, {
      nPol: D.pol.length, nTool: Object.keys(B.CODE_OF).length,
      q: f.q, onQ: (e) => this.setState({ f: Object.assign({}, this.state.f, { q: e.target.value }) }),
      rows, fOpen: s.fOpen, toggleBox: () => this.setState({ fOpen: !this.state.fOpen, dd: null }), boxChev: s.fOpen ? '收合 ▴' : '展開 ▾',
      nActive, hasActive: nActive > 0, badgeBg: nActive ? '#2f3b6f' : '#dde0e5', badgeFg: nActive ? '#ffffff' : '#3a3f4d',
      matchLine: nActive ? '符合：' + nPolOk + ' / ' + D.pol.length + ' 項政策・' + nToolOk + ' / ' + allTools.length + ' 項工具' : '未設條件：' + D.pol.length + ' 項政策・' + allTools.length + ' 項工具',
      clearAll: () => this.setState({ f: this.emptyF(), dd: null }),
      ddAny: !!s.dd, closeDd: () => this.setState({ dd: null }),
      toolOk, polOk
    });
  }
}
</script>
