tyle=\"display: flex; flex-direction: column; margin: 0 8px\">\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px 18px; padding: 16px; border: 1px solid #dde0e5; border-radius: 12px; background: #ffffff\">\n<div style=\"flex: 0 0 120px; display: flex; flex-direction: column; gap: 2px\">\n<span style=\"font-size: 15px; font-weight: 700; color: #1f2433\">針對性管制<\/span>\n<span style=\"font-size: 13px; color: #5a6070\">{{targetedLine}}<\/span>\n<\/div>\n<div style=\"flex: 999 1 600px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px\">\n<sc-for list=\"{{tracks}}\" as=\"t\" hint-placeholder-count=\"4\">\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<span style=\"font-size: 13px; font-weight: 700; color: #3a3f4d\">{{t.head}}<\/span>\n<div style=\"display: flex; flex-wrap: wrap; gap: 5px\">\n<sc-for list=\"{{t.chips}}\" as=\"c\" hint-placeholder-count=\"8\">\n<button type=\"button\" onClick=\"{{c.open}}\" aria-label=\"{{c.aria}}\" style=\"appearance: none; position: relative; font: inherit; font-size: 12px; font-weight: 700; padding: {{c.pad}}; border: {{c.border}}; border-radius: 4px; background: {{c.bg}}; color: {{c.fg}}; cursor: pointer\">{{c.label}}<sc-if value=\"{{c.ring}}\" hint-placeholder-val=\"{{false}}\"><span style=\"position: absolute; top: -4px; right: -4px; width: 7px; height: 7px; border: 1.2px solid #6b7080; border-radius: 50%; background: #ffffff\"><\/span><\/sc-if><\/button>\n<\/sc-for>\n<\/div>\n<\/div>\n<\/sc-for>\n<\/div>\n<\/div>\n\n<div style=\"display: flex; align-items: center; gap: 8px; padding: 6px 0 6px 136px; font-size: 12.5px; color: #7a5a2e\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" aria-hidden=\"true\"><path d=\"M6 1L11 9H1Z\" fill=\"#b08a4e\"><\/path><\/svg>上方政策引用下方的基線制度（例如把企業列入實體清單、適用國家群組），或後來修訂了它<\/div>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px 18px; padding: 16px; border: 1px solid #e5d0ac; border-radius: 12px; background: #fbf7f0\">\n<div style=\"flex: 0 0 120px; display: flex; flex-direction: column; gap: 2px\">\n<span style=\"font-size: 15px; font-weight: 700; color: #46361d\">基線制度<\/span>\n<span style=\"font-size: 13px; color: #6b5a3a\">{{nBase}} 項・出口管理條例（EAR）原有規則<\/span>\n<\/div>\n<div style=\"flex: 999 1 600px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px\">\n<sc-for list=\"{{bases}}\" as=\"b\" hint-placeholder-count=\"8\">\n<button type=\"button\" onClick=\"{{b.pick}}\" aria-pressed=\"{{b.pressed}}\" style=\"appearance: none; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 10px 12px; border: 1px solid {{b.border}}; border-radius: 10px; background: {{b.bg}}; font: inherit; text-align: left; cursor: pointer\"><span style=\"font-size: 11.5px; font-weight: 700; color: {{b.codeFg}}\">{{b.code}}<\/span><span style=\"font-size: 13.5px; font-weight: 700; line-height: 1.4; color: {{b.fg}}\">{{b.name}}<\/span><span style=\"font-size: 12.5px; color: {{b.fg}}\">{{b.metric}}<\/span><\/button>\n<\/sc-for>\n<\/div>\n<\/div>\n\n<div style=\"display: flex; align-items: center; gap: 8px; padding: 6px 0 6px 136px; font-size: 12.5px; color: #4a5797\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" aria-hidden=\"true\"><path d=\"M6 1L11 9H1Z\" fill=\"#4a5797\"><\/path><\/svg>基線制度目前的法律依據（只表示依據關係，不代表時間先後）<\/div>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px 18px; padding: 16px; border: 1px solid #c5cbe4; border-radius: 12px; background: #f3f4fa\">\n<div style=\"flex: 0 0 120px; display: flex; flex-direction: column; gap: 2px\">\n<span style=\"font-size: 15px; font-weight: 700; color: #1a2250\">依據<\/span>\n<span style=\"font-size: 13px; color: #4a5797\">2 項<\/span>\n<\/div>\n<div style=\"flex: 999 1 600px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px\">\n<button type=\"button\" onClick=\"{{ecra.pick}}\" aria-pressed=\"{{ecra.pressed}}\" style=\"appearance: none; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px 14px; border: 1px solid {{ecra.border}}; border-radius: 10px; background: {{ecra.bg}}; font: inherit; text-align: left; cursor: pointer\"><span style=\"font-size: 11.5px; font-weight: 700; color: {{ecra.codeFg}}\">BL-01・美國法律授權<\/span><span style=\"font-size: 14px; font-weight: 700; color: {{ecra.fg}}\">{{ecra.name}}<\/span><span style=\"font-size: 12.5px; line-height: 1.6; color: {{ecra.fg}}\">BL-02～09 目前都以這部法律為依據・另有 {{ecra.n}} 項針對性政策引用它<\/span><\/button>\n<div style=\"display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px 14px; border: 1px solid #8f99c8; border-radius: 10px; background: #ffffff\"><span style=\"font-size: 11.5px; font-weight: 700; color: #4a5797\">BL-10・國際協定<\/span><span style=\"font-size: 14px; font-weight: 700; color: #1a2250\">{{wass}}<\/span><span style=\"font-size: 12.5px; line-height: 1.6; color: #2f3b6f\">BL-03 的管制項目以這項協定為國際基礎，不屬於 ECRA 的授權<\/span><\/div>\n<\/div>\n<\/div>\n\n<div style=\"display: flex; flex-direction: column; gap: 6px; margin-top: 12px; font-size: 13px; line-height: 1.7; color: #5a6070\">\n<p style=\"margin: 0\">ECRA 是 2018 年才制定的，比 1996 年起的 EAR 基線規則晚。這些基線規則最初依據出口管理法（EAA）；EAA 在 1994 年到期後，改由總統行政命令依 IEEPA 維持效力，2018 年起才由 ECRA 正式授權。<\/p>\n<p style=\"margin: 0\">未引用任何基線的政策（{{nUnlinked}} 項）：多半另有法律依據，例如總統依憲法第 2 條發布的行政命令、IEEPA、貿易擴張法第 232 條、CHIPS 與科學法；或是要求行政部門提出報告、推動產業的法案。EB-11（2009 年 BIS 對雲端運算的諮詢意見）的法源雖是 EAR 第 734 部，但沒有對應到特定的基線制度。<\/p>\n<\/div>\n<\/div>\n\n<sc-if value=\"{{hasSel}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; flex-direction: column; gap: 12px; margin: 22px 8px 0; padding: 18px 20px; border: 1px solid #c5cbe4; border-radius: 12px; background: #fcfcfe\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px\">\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-size: 12.5px; font-weight: 700; letter-spacing: 0.12em; color: #7a5a2e\">{{detail.kicker}}<\/span>\n<h3 style=\"margin: 0; font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 22px; color: #1a2250\">{{detail.name}}<\/h3>\n<\/div>\n<div style=\"display: flex; align-items: center; gap: 12px\">\n<span style=\"font-size: 13.5px; color: #5a6070\">{{detail.summary}}<\/span>\n<button type=\"button\" aria-label=\"清除選取\" onClick=\"{{clear}}\" style=\"appearance: none; flex: none; width: 44px; height: 44px; border: 1px solid #dde0e5; border-radius: 10px; background: #ffffff; font: inherit; font-size: 20px; line-height: 1; color: #5a6070; cursor: pointer\">×<\/button>\n<\/div>\n<\/div>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 6px 18px\">\n<sc-for list=\"{{detail.rows}}\" as=\"r\" hint-placeholder-count=\"6\">\n<button type=\"button\" onClick=\"{{r.open}}\" style=\"appearance: none; display: flex; align-items: baseline; gap: 10px; padding: 7px 0; border: 0; border-bottom: 1px solid #eceef1; background: none; font: inherit; text-align: left; cursor: pointer\"><span style=\"flex: none; width: 56px; font-size: 12px; font-weight: 700; color: #2f3b6f\">{{r.code}}<\/span><span style=\"flex: 1 1 auto; font-size: 13.5px; line-height: 1.5; color: #1f2433\">{{r.item}}<\/span><span style=\"flex: none; font-size: 12px; color: {{r.stFg}}\">{{r.year}}・{{r.status}}<\/span><\/button>\n<\/sc-for>\n<\/div>\n<\/div>\n<\/sc-if>\n\n<div style=\"display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; margin: 30px 8px 12px; padding-top: 22px; border-top: 1px solid #eceef1\">\n<h2 style=\"margin: 0; font-size: 18px; font-weight: 700; color: #1f2433\">規則演進<span style=\"font-size: 14px; font-weight: 400; color: #5a6070\">　{{tlHint}}<\/span><\/h2>\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 13px; color: #5a6070\">\n<span style=\"display: inline-flex; align-items: center; gap: 6px\"><svg width=\"26\" height=\"10\" viewBox=\"0 0 26 10\" aria-hidden=\"true\"><path d=\"M1 5H20\" stroke=\"#b08a4e\" stroke-width=\"1.6\"><\/path><path d=\"M19 1L25 5L19 9Z\" fill=\"#b08a4e\"><\/path><\/svg>修訂（基線 → 後續規則）<\/span>\n<sc-if value=\"{{hasSel}}\" hint-placeholder-val=\"{{false}}\"><span style=\"display: inline-flex; align-items: center; gap: 6px\"><svg width=\"26\" height=\"10\" viewBox=\"0 0 26 10\" aria-hidden=\"true\"><path d=\"M1 5H20\" stroke=\"#2f3b6f\" stroke-width=\"1.6\"><\/path><path d=\"M19 1L25 5L19 9Z\" fill=\"#2f3b6f\"><\/path><\/svg>引用<\/span><\/sc-if>\n<span>日期：基線制度用最初發布日，其他政策用資料庫記載的日期<\/span>\n<\/div>\n<\/div>\n\n<div style=\"overflow-x: auto; margin: 0 8px; border: 1px solid #eceef1; border-radius: 10px\">\n<div style=\"position: relative; width: {{tl.w}}px; height: {{tl.h}}px\">\n<svg width=\"{{tl.w}}\" height=\"{{tl.h}}\" role=\"img\" aria-label=\"規則演進時間軸：依據、基線與各機關針對性政策依年份排列，箭頭標示基線制度被哪些後續規則修訂\" style=\"position: absolute; left: 0; top: 0; display: block\">\n<defs><marker id=\"lvAhZ\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0L8 4L0 8Z\" fill=\"#b08a4e\"><\/path><\/marker><marker id=\"lvAhF\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0L8 4L0 8Z\" fill=\"#2f3b6f\"><\/path><\/marker><\/defs>\n<sc-for list=\"{{tl.lanes}}\" as=\"l\" hint-placeholder-count=\"6\"><rect x=\"0\" y=\"{{l.y}}\" width=\"{{tl.w}}\" height=\"{{l.h}}\" fill=\"{{l.bg}}\"><\/rect><line x1=\"0\" y1=\"{{l.y2}}\" x2=\"{{tl.w}}\" y2=\"{{l.y2}}\" stroke=\"#eceef1\"><\/line><\/sc-for>\n<sc-for list=\"{{tl.cols}}\" as=\"c\" hint-placeholder-count=\"10\"><line x1=\"{{c.x}}\" y1=\"26\" x2=\"{{c.x}}\" y2=\"{{tl.h}}\" stroke=\"{{c.stroke}}\" stroke-dasharray=\"{{c.dash}}\"><\/line><\/sc-for>\n<sc-for list=\"{{tl.zai}}\" as=\"p\" hint-placeholder-count=\"8\"><path d=\"{{p.d}}\" fill=\"none\" stroke=\"#b08a4e\" stroke-width=\"1.6\" opacity=\"{{p.op}}\" marker-end=\"url(#lvAhZ)\"><\/path><\/sc-for>\n<sc-for list=\"{{tl.focus}}\" as=\"p\" hint-placeholder-count=\"0\"><path d=\"{{p.d}}\" fill=\"none\" stroke=\"#2f3b6f\" stroke-width=\"1.4\" opacity=\"0.85\" marker-end=\"url(#lvAhF)\"><\/path><\/sc-for>\n<\/svg>\n<sc-for list=\"{{tl.colLabels}}\" as=\"c\" hint-placeholder-count=\"10\"><div style=\"position: absolute; left: {{c.x}}px; top: 8px; width: {{c.w}}px; text-align: center; font-size: 12px; font-weight: 700; color: #5a6070\">{{c.label}}<\/div><\/sc-for>\n<sc-for list=\"{{tl.laneLabels}}\" as=\"l\" hint-placeholder-count=\"6\"><div style=\"position: absolute; left: 10px; top: {{l.ty}}px; font-size: 12px; font-weight: 700; color: #3a3f4d\">{{l.label}}<\/div><\/sc-for>\n<sc-for list=\"{{tl.chips}}\" as=\"c\" hint-placeholder-count=\"55\"><button type=\"button\" onClick=\"{{c.act}}\" aria-label=\"{{c.aria}}\" style=\"appearance: none; position: absolute; left: {{c.x}}px; top: {{c.y}}px; width: 52px; height: 20px; box-sizing: border-box; padding: 0; border: {{c.border}}; border-radius: 4px; background: {{c.bg}}; color: {{c.fg}}; font: inherit; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; cursor: pointer\">{{c.label}}<sc-if value=\"{{c.ring}}\" hint-placeholder-val=\"{{false}}\"><span style=\"position: absolute; top: -4px; right: -4px; width: 6px; height: 6px; border: 1.2px solid #6b7080; border-radius: 50%; background: #ffffff\"><\/span><\/sc-if><\/button><\/sc-for>\n<\/div>\n<\/div>\n\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"polOk\":{\"editor\":null},\"openPolicy\":{\"editor\":null},\"$preview\":{\"width\":1340,\"height\":1500}}'>\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { sel: null };\n  }\n  renderVals() {\n    const B = window.__DATA_ZH || { D: { pol: [] }, CODE2: {}, TRACKS: [] };\n    const L = B.LAYERS || { layer: {}, basis: {}, zai: {}, cites: {}, unlinked: [] };\n    const P = {}; B.D.pol.forEach((p) => { P[p.code] = p; });\n    const disp = (c) => B.CODE2[c] || c;\n    const bucket = (p) => (p || '').startsWith('T5') ? '現行生效' : ((p || '').startsWith('T1') ? '已撤銷' : '推進中');\n    const ST = { '現行生效': ['#1f6f5c', '現行'], '推進中': ['#8a5d12', '推進中'], '已撤銷': ['#5a6070', '已撤銷'] };\n    const polOk = this.props.polOk || (() => true);\n    const open = (c) => () => { if (this.props.openPolicy) this.props.openPolicy(c); };\n    const sel = this.state.sel;\n    const related = new Set(sel ? [...(L.cites[sel] || []), ...(L.zai[sel] || [])] : []);\n    const unl = new Set(L.unlinked);\n    const isT = (c) => L.layer[c] === 'targeted';\n    const keep = (c) => !isT(c) || polOk(c);\n    const pick = (c) => () => this.setState({ sel: this.state.sel === c ? null : c });\n\n    const chipLook = (c) => {\n      const dashed = bucket(P[c].prog) === '推進中' ? 'dashed' : 'solid';\n      if (sel) {\n        if (related.has(c)) return { pad: '2px 6px', border: '2px ' + dashed + ' #2f3b6f', bg: '#e4e7f2', fg: '#1a2250' };\n        return { pad: '3px 7px', border: '1px ' + dashed + ' #e2e4e9', bg: '#f7f7f9', fg: '#6b7080' };\n      }\n      if (bucket(P[c].prog) === '已撤銷') return { pad: '3px 7px', border: '1px solid #c9ccd3', bg: '#eef0f3', fg: '#5f6472' };\n      return { pad: '3px 7px', border: '1px ' + dashed + ' #8a909c', bg: '#ffffff', fg: '#1f2433' };\n    };\n    const TRACK_LABEL = { EW: '白宮', EB: 'BIS 規則', LC: '國會', M: '索引' };\n    const allT = B.D.pol.filter((p) => isT(p.code));\n    const shownT = allT.filter((p) => keep(p.code));\n    const tracks = B.TRACKS.map((t) => t.code).filter((code) => code !== 'BL' && allT.some((p) => p.track === code)).map((code) => {\n      const ps = shownT.filter((p) => p.track === code).sort((a, b) => a.disp.localeCompare(b.disp, 'en', { numeric: true }));\n      const lit = sel ? '・相關 ' + ps.filter((p) => related.has(p.code)).length : '';\n      return {\n        head: code + '　' + (TRACK_LABEL[code] || code) + '　' + ps.length + lit,\n        chips: ps.map((p) => Object.assign({ label: p.disp, ring: unl.has(p.code), open: open(p.code), aria: p.disp + ' ' + p.item }, chipLook(p.code)))\n      };\n    });\n\n    const baseCodes = ['BL-2', 'BL-3', 'BL-4', 'BL-5', 'BL-6', 'BL-7', 'BL-8', 'BL-9'].filter((c) => P[c]);\n    const cardLook = (c) => sel === c\n      ? { bg: '#2f3b6f', border: '#1a2250', fg: '#ffffff', codeFg: '#d6dbf0', pressed: 'true' }\n      : (sel ? { bg: '#fdfbf7', border: '#ece3d2', fg: '#6b7080', codeFg: '#6b7080', pressed: 'false' }\n        : { bg: '#ffffff', border: '#d9c8a6', fg: '#46361d', codeFg: '#7a5a2e', pressed: 'false' });\n    const bases = baseCodes.map((c) => {\n      const nC = (L.cites[c] || []).length; const z = (L.zai[c] || []).map(disp);\n      const metric = [nC ? nC + ' 項政策引用' : '', z.length ? '修訂：' + z.join('、') : ''].filter(Boolean).join('・') || '—';\n      return Object.assign({ code: disp(c), name: P[c].item, metric, pick: pick(c) }, cardLook(c));\n    });\n    const ecraLook = sel === 'BL-1'\n      ? { bg: '#2f3b6f', border: '#1a2250', fg: '#ffffff', codeFg: '#d6dbf0', pressed: 'true' }\n      : (sel ? { bg: '#ffffff', border: '#dfe2ee', fg: '#6b7080', codeFg: '#6b7080', pressed: 'false' }\n        : { bg: '#ffffff', border: '#8f99c8', fg: '#1a2250', codeFg: '#4a5797', pressed: 'false' });\n    const ecra = Object.assign({ name: P['BL-1'] ? P['BL-1'].item : 'ECRA', n: (L.cites['BL-1'] || []).length, pick: pick('BL-1') }, ecraLook);\n\n    let detail = { kicker: '', name: '', summary: '', rows: [] };\n    if (sel && P[sel]) {\n      const rel = [...related].filter((c) => P[c] && keep(c)).sort((a, b) => (P[a].date || '').localeCompare(P[b].date || '') || a.localeCompare(b));\n      const byTrack = {}; const bySt = {};\n      rel.forEach((c) => { byTrack[P[c].track] = (byTrack[P[c].track] || 0) + 1; const s = ST[bucket(P[c].prog)][1]; bySt[s] = (bySt[s] || 0) + 1; });\n      const nCites = (L.cites[sel] || []).length; const nZai = (L.zai[sel] || []).length;\n      const head = [nCites ? nCites + ' 項針對性政策引用它' : '', nZai ? '後來由 ' + nZai + ' 項規則修訂' : ''].filter(Boolean).join('；');\n      detail = {\n        kicker: (L.layer[sel] === 'basis' ? '依據' : '基線制度') + '・' + disp(sel),\n        name: P[sel].item,\n        summary: head + '：' + Object.entries(byTrack).map(([k, v]) => k + ' ' + v).join('、') + '；' + ['現行', '推進中', '已撤銷'].filter((k) => bySt[k]).map((k) => k + ' ' + bySt[k]).join('、'),\n        rows: rel.map((c) => { const st = ST[bucket(P[c].prog)]; return { code: disp(c), item: P[c].item, year: (P[c].date || '').slice(0, 4), status: st[1], stFg: st[0], open: open(c) }; })\n      };\n    }\n\n    // timeline geometry (same rules as timeline_geo.py)\n    const COLS = [['2017 以前', 236], ['2018', 66], ['2019', 66], ['2020', 66], ['2021', 66], ['2022', 66], ['2023', 120], ['2024', 120], ['2025', 236], ['2026', 184]];\n    const LABEL_W = 100, CW = 52, CH = 20, GAP = 4, PADX = 6, PADY = 7, ROWH = 25, HEAD = 30;\n    const LANES = [['M', 'M 索引'], ['LC', 'LC 國會'], ['EW', 'EW 白宮'], ['EB', 'EB BIS'], ['baseline', '基線制度'], ['basis', '依據']];\n    const x0 = {}; let x = LABEL_W; COLS.forEach(([n, w]) => { x0[n] = [x, w]; x += w; }); const W = x;\n    const colOf = (c) => { const y = parseInt((P[c].date || '0').slice(0, 4), 10); return y <= 2017 ? '2017 以前' : String(y); };\n    const laneOf = (c) => L.layer[c] === 'targeted' ? P[c].track : L.layer[c];\n    const zaiT = new Set(Object.values(L.zai).flat());\n    const BASE_ORDER = ['BL-3', 'BL-4', 'BL-6', 'BL-7', 'BL-2', 'BL-5', 'BL-8', 'BL-9'];\n    const tlCodes = B.D.pol.map((p) => p.code).filter((c) => L.layer[c] && keep(c) && x0[colOf(c)]);\n    const cells = {};\n    tlCodes.slice().sort((a, b) => (zaiT.has(a) - zaiT.has(b)) || (P[a].date || '').localeCompare(P[b].date || '') || a.localeCompare(b))\n      .forEach((c) => { const k = laneOf(c) + '|' + colOf(c); (cells[k] = cells[k] || []).push(c); });\n    if (cells['baseline|2017 以前']) cells['baseline|2017 以前'] = BASE_ORDER.filter((c) => cells['baseline|2017 以前'].includes(c));\n    const perRow = (w) => Math.max(1, Math.floor((w - 2 * PADX + GAP) / (CW + GAP)));\n    const laneRows = {}; LANES.forEach(([ln]) => { laneRows[ln] = 1; });\n    Object.entries(cells).forEach(([k, cs]) => { const [ln, col] = k.split('|'); if (laneRows[ln] !== undefined) laneRows[ln] = Math.max(laneRows[ln], Math.ceil(cs.length / perRow(x0[col][1]))); });\n    const laneY = {}; let y = HEAD;\n    LANES.forEach(([ln]) => { const h = laneRows[ln] * ROWH + 2 * PADY - 5; laneY[ln] = [y, h]; y += h; });\n    const H = y + 4;\n    const pos = {};\n    Object.entries(cells).forEach(([k, cs]) => {\n      const [ln, col] = k.split('|'); if (!laneY[ln]) return;\n      const [cx, cw] = x0[col]; const [ly] = laneY[ln]; const n = perRow(cw);\n      cs.forEach((c, i) => { pos[c] = [cx + PADX + (i % n) * (CW + GAP), ly + PADY + Math.floor(i / n) * ROWH]; });\n    });\n    const tlLook = (c) => {\n      const lv = L.layer[c]; const dashed = bucket(P[c].prog) === '推進中' ? 'dashed' : 'solid';\n      if (sel) {\n        if (c === sel) return { bg: '#2f3b6f', border: '1.5px solid #1a2250', fg: '#ffffff' };\n        if (related.has(c)) return { bg: '#e4e7f2', border: '2px ' + dashed + ' #2f3b6f', fg: '#1a2250' };\n        return { bg: '#f7f7f9', border: '1px ' + (lv === 'targeted' ? dashed : 'solid') + ' #dfe2e7', fg: '#6b7080' };\n      }\n      if (lv === 'basis') return { bg: '#eef0f6', border: '1px solid #8f99c8', fg: '#1a2250' };\n      if (lv === 'baseline') return { bg: '#f6f1e7', border: '1px solid #c4a87e', fg: '#46361d' };\n      if (bucket(P[c].prog) === '已撤銷') return { bg: '#eef0f3', border: '1px solid #c9ccd3', fg: '#5f6472' };\n      return { bg: '#ffffff', border: '1px ' + dashed + ' #8a909c', fg: '#1f2433' };\n    };\n    const chips = Object.entries(pos).map(([c, [cx, cy]]) => Object.assign({\n      x: cx, y: cy, label: disp(c), ring: isT(c) && unl.has(c), aria: disp(c) + ' ' + P[c].item,\n      act: isT(c) ? open(c) : pick(c)\n    }, tlLook(c)));\n    const curveTop = (a, b) => { const ax = pos[a][0] + CW / 2, ay = pos[a][1], bx = pos[b][0] + CW / 2, by = pos[b][1] + CH + 2; return 'M' + ax + ' ' + ay + 'C' + ax + ' ' + (ay - 40) + ' ' + bx + ' ' + (by + 45) + ' ' + bx + ' ' + by; };\n    const curveRight = (a, b) => { const ax = pos[a][0] + CW, ay = pos[a][1] + CH / 2, bx = pos[b][0] + CW / 2, by = pos[b][1] + CH + 2; return 'M' + ax + ' ' + ay + 'C' + (ax + 60) + ' ' + ay + ' ' + bx + ' ' + (by + 45) + ' ' + bx + ' ' + by; };\n    const zai = []; Object.entries(L.zai).forEach(([s, ds]) => ds.forEach((d) => { if (pos[s] && pos[d]) zai.push({ d: curveTop(s, d), op: sel ? 0.35 : 0.9 }); }));\n    const focus = sel && pos[sel] ? (L.cites[sel] || []).filter((d) => pos[d]).map((d) => ({ d: curveRight(sel, d) })) : [];\n    const laneBg = { baseline: '#fbf7f0', basis: '#f3f4fa' };\n    const tl = {\n      w: W, h: H,\n      lanes: LANES.map(([ln], i) => ({ y: laneY[ln][0], h: laneY[ln][1], y2: laneY[ln][0] + laneY[ln][1], bg: laneBg[ln] || (i % 2 ? '#ffffff' : '#fafbfc') })),\n      laneLabels: LANES.map(([ln, label]) => ({ label, ty: Math.round(laneY[ln][0] + laneY[ln][1] / 2 - 9) })),\n      cols: COLS.map(([n]) => ({ x: x0[n][0], stroke: n === '2018' ? '#b9bdc6' : '#e3e6ea', dash: n === '2018' ? '3 3' : '' })),\n      colLabels: COLS.map(([n, w]) => ({ label: n, x: x0[n][0], w })),\n      zai, focus, chips\n    };\n    const nLit = sel ? [...related].filter((c) => isT(c) && keep(c)).length : 0;\n    return {\n      hint: sel ? '已標出' + (sel === 'BL-1' ? '引用 ECRA' : '引用或修訂「' + (P[sel] ? P[sel].item : '') + '」') + '的 ' + nLit + ' 項政策' : '點一項基線制度，會標出引用它或修訂它的政策',\n      targetedLine: shownT.length + ' 項' + (sel ? '・相關 ' + nLit : '・依發布機關'),\n      tracks, bases, nBase: baseCodes.length, ecra, wass: P['BL-10'] ? P['BL-10'].item : '瓦聖納協定',\n      nUnlinked: L.unlinked.length, hasSel: !!sel, detail,\n      clear: () => this.setState({ sel: null }),\n      tlHint: sel ? '「' + (P[sel] ? P[sel].item : '') + '」：哪些政策在什麼時候引用或修訂它' : '基線制度在 2020～2024 年被哪些規則修訂',\n      tl\n    };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n","./MatrixView.dc.html":"<!doctype html>\n<html lang=\"zh-Hant\">\n<head>\n<meta charset=\"utf-8\">\n<title>標的矩陣<\/title>\n<script src=\"./vendor/react.js\"><\/script>\n<script src=\"./vendor/react-dom.js\"><\/script>\n<script src=\"./support.js\"><\/script>\n<script src=\"./assets/dfdd7576b54cc91759c0ad9b20d3b29a.js\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;family=Noto+Serif+TC:wght@700&amp;display=swap\">\n<style>\nbody{margin:0}\n<\/style>\n<\/helmet>\n<div style=\"font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; color: #1f2433; background: #ffffff\">\n\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin: 0 8px 18px; padding: 12px 16px; background: #f7f8fa; border-radius: 12px\">\n<span style=\"font-size: 13.5px; font-weight: 700; color: #1f2433\">作用方向<\/span>\n<div role=\"img\" aria-label=\"{{dirAria}}\" style=\"display: flex; gap: 2px; width: 320px; max-width: 100%; height: 10px; border-radius: 5px; overflow: hidden\">\n<sc-for list=\"{{dirBar}}\" as=\"d\" hint-placeholder-count=\"5\"><span style=\"flex: {{d.n}} 1 0; background: {{d.color}}\"><\/span><\/sc-for>\n<\/div>\n<div style=\"display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: #5a6070\">\n<sc-for list=\"{{dirBar}}\" as=\"d\" hint-placeholder-count=\"5\"><span style=\"display: inline-flex; align-items: center; gap: 6px\"><span style=\"width: 9px; height: 9px; border-radius: 2px; background: {{d.color}}\"><\/span>{{d.label}} {{d.n}}<\/span><\/sc-for>\n<\/div>\n<span style=\"margin-left: auto; font-size: 13.5px; color: #5a6070\">點格子看這個組合的工具；點左邊的標的或上方的工具大類，看整列或整欄的工具。<\/span>\n<\/div>\n\n<div style=\"display: flex; flex-wrap: wrap; align-items: flex-start; gap: 20px; margin: 0 8px\">\n\n<div style=\"flex: 999 1 820px; min-width: 0; overflow-x: auto\">\n<div style=\"min-width: 820px\">\n\n<div style=\"display: grid; grid-template-columns: 200px repeat(9, minmax(0, 1fr)) 84px; align-items: end; padding-bottom: 8px; border-bottom: 1px solid #dde0e5\">\n<div style=\"display: flex; flex-direction: column; gap: 2px; padding: 0 0 6px 4px; font-size: 12.5px; color: #5a6070\"><span>列：管制標的（{{nCat}} 類）<\/span><span>欄：政策工具大類（{{nMacro}} 類）<\/span><\/div>\n<sc-for list=\"{{cols}}\" as=\"c\" hint-placeholder-count=\"9\">\n<button type=\"button\" onClick=\"{{c.pick}}\" aria-pressed=\"{{c.pressed}}\" style=\"appearance: none; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; min-height: 92px; margin: 0 2px; padding: 6px 2px; background: {{c.bg}}; border: {{c.border}}; border-radius: 8px; font: inherit; text-align: center; cursor: pointer\"><span style=\"font-size: 12.5px; font-weight: 700; line-height: 1.35; color: {{c.nameFg}}\">{{c.name}}<\/span><span style=\"font-size: 12px; color: {{c.nFg}}\">{{c.n}} 項<\/span><\/button>\n<\/sc-for>\n<div style=\"display: flex; align-items: flex-end; justify-content: flex-end; padding: 0 6px 6px 0; font-size: 12.5px; font-weight: 700; color: #1f2433\">標的合計<\/div>\n<\/div>\n\n<sc-for list=\"{{rows}}\" as=\"r\" hint-placeholder-count=\"13\">\n<div style=\"display: grid; grid-template-columns: 200px repeat(9, minmax(0, 1fr)) 84px; align-items: center; background: {{r.rowBg}}; border-bottom: 1px solid #eceef1\">\n<button type=\"button\" onClick=\"{{r.pick}}\" aria-pressed=\"{{r.selected}}\" style=\"appearance: none; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; margin: 5px 8px 5px 4px; padding: 7px 12px; min-height: 48px; background: {{r.lbBg}}; border: 1px solid {{r.lbBorder}}; border-radius: 8px; font: inherit; text-align: left; cursor: pointer\"><span style=\"font-size: 14px; font-weight: 700; color: {{r.lbFg}}\">{{r.name}}<\/span><sc-if value=\"{{r.hasSub}}\" hint-placeholder-val=\"{{false}}\"><span style=\"font-size: 12px; color: {{r.lbSub}}\">{{r.sub}}<\/span><\/sc-if><\/button>\n<sc-if value=\"{{r.empty}}\" hint-placeholder-val=\"{{false}}\"><div style=\"grid-column: span 9; display: flex; align-items: center; justify-content: center; min-height: 58px; font-size: 13px; color: #6b7080\">本類目前沒有對應工具<\/div><\/sc-if>\n<sc-if value=\"{{r.nonEmpty}}\" hint-placeholder-val=\"{{true}}\">\n<sc-for list=\"{{r.cells}}\" as=\"c\" hint-placeholder-count=\"9\">\n<sc-if value=\"{{c.has}}\" hint-placeholder-val=\"{{true}}\"><button type=\"button\" onClick=\"{{c.pick}}\" aria-label=\"{{c.aria}}\" style=\"appearance: none; border: 0; background: none; padding: 0; min-height: 58px; display: flex; align-items: center; justify-content: center; font: inherit; cursor: pointer\"><span style=\"display: flex; align-items: center; justify-content: center; width: {{c.d}}px; height: {{c.d}}px; border-radius: 50%; background: {{c.bg}}; color: {{c.fg}}; font-size: {{c.fs}}px; font-weight: 700; box-shadow: {{c.ring}}\">{{c.n}}<\/span><\/button><\/sc-if>\n<sc-if value=\"{{c.none}}\" hint-placeholder-val=\"{{false}}\"><div style=\"display: flex; align-items: center; justify-content: center; min-height: 58px\"><span style=\"width: 4px; height: 4px; border-radius: 50%; background: #d5d8de\"><\/span><\/div><\/sc-if>\n<\/sc-for>\n<\/sc-if>\n<div style=\"display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding-right: 6px\"><span style=\"display: flex; width: 44px; height: 6px; border-radius: 3px; background: #f3eadb\"><span style=\"width: {{r.barW}}px; border-radius: 3px; background: #c4a87e\"><\/span><\/span><span style=\"min-width: 24px; text-align: right; font-size: 15px; font-weight: 700; color: {{r.totFg}}\">{{r.total}}<\/span><\/div>\n<\/div>\n<\/sc-for>\n\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; margin-top: 16px\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; font-size: 13px; color: #5a6070\">\n<span style=\"font-weight: 700; color: #1f2433\">工具數<\/span>\n<span style=\"display: inline-flex; align-items: center; gap: 6px\"><span style=\"width: 26px; height: 26px; border-radius: 50%; background: #e4e7f2\"><\/span>1–2<\/span>\n<span style=\"display: inline-flex; align-items: center; gap: 6px\"><span style=\"width: 32px; height: 32px; border-radius: 50%; background: #c5cbe4\"><\/span>3–5<\/span>\n<span style=\"display: inline-flex; align-items: center; gap: 6px\"><span style=\"width: 38px; height: 38px; border-radius: 50%; background: #8f99c8\"><\/span>6–9<\/span>\n<span style=\"display: inline-flex; align-items: center; gap: 6px\"><span style=\"width: 44px; height: 44px; border-radius: 50%; background: #4a5797\"><\/span>10–19<\/span>\n<span style=\"display: inline-flex; align-items: center; gap: 6px\"><span style=\"width: 50px; height: 50px; border-radius: 50%; background: #2f3b6f\"><\/span>20 以上<\/span>\n<\/div>\n<p style=\"margin: 0; max-width: 520px; font-size: 13px; line-height: 1.7; color: #5a6070\">每欄上方的數字是該大類的工具數。一項工具可能同時涉及好幾個標的，所以同一欄各格加起來可能比上方數字大。<\/p>\n<\/div>\n\n<\/div>\n<\/div>\n\n<sc-if value=\"{{hasSel}}\" hint-placeholder-val=\"{{false}}\">\n<aside aria-label=\"焦點詳情\" style=\"flex: 1 1 380px; min-width: 0; max-width: 100%; display: flex; flex-direction: column; gap: 18px; padding: 20px; border: 1px solid #dde0e5; border-radius: 14px; background: #fcfcfd; box-sizing: border-box\">\n<div style=\"display: flex; align-items: flex-start; justify-content: space-between; gap: 12px\">\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-size: 12.5px; font-weight: 700; letter-spacing: 0.12em; color: #7a5a2e\">{{sel.kicker}}<\/span>\n<h2 style=\"margin: 0; font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 24px; color: #1a2250\">{{sel.name}}<\/h2>\n<sc-if value=\"{{sel.hasSub}}\" hint-placeholder-val=\"{{false}}\"><p style=\"margin: 0; font-size: 14px; color: #5a6070\">{{sel.sub}}<\/p><\/sc-if>\n<\/div>\n<button type=\"button\" aria-label=\"關閉焦點詳情\" onClick=\"{{clear}}\" style=\"appearance: none; flex: none; width: 44px; height: 44px; border: 1px solid #dde0e5; border-radius: 10px; background: #ffffff; font: inherit; font-size: 20px; line-height: 1; color: #5a6070; cursor: pointer\">×<\/button>\n<\/div>\n<div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px\">\n<div style=\"display: flex; flex-direction: column; gap: 2px; padding: 12px; background: #ffffff; border: 1px solid #eceef1; border-radius: 10px\"><span style=\"font-size: 24px; font-weight: 700\">{{sel.nTool}}<\/span><span style=\"font-size: 12.5px; color: #5a6070\">項工具<\/span><\/div>\n<div style=\"display: flex; flex-direction: column; gap: 2px; padding: 12px; background: #ffffff; border: 1px solid #eceef1; border-radius: 10px\"><span style=\"font-size: 24px; font-weight: 700\">{{sel.nPol}}<\/span><span style=\"font-size: 12.5px; color: #5a6070\">項政策<\/span><\/div>\n<div style=\"display: flex; flex-direction: column; gap: 2px; padding: 12px; background: #ffffff; border: 1px solid #eceef1; border-radius: 10px\"><span style=\"font-size: 24px; font-weight: 700\">{{sel.nMacro}}<\/span><span style=\"font-size: 12.5px; color: #5a6070\">{{sel.thirdLabel}}<\/span><\/div>\n<\/div>\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<h3 style=\"margin: 0; font-size: 14px; font-weight: 700\">作用方向<\/h3>\n<div role=\"img\" aria-label=\"{{sel.dirAria}}\" style=\"display: flex; gap: 2px; height: 10px; border-radius: 5px; overflow: hidden\">\n<sc-for list=\"{{sel.dirBar}}\" as=\"d\" hint-placeholder-count=\"4\"><span style=\"flex: {{d.n}} 1 0; background: {{d.color}}\"><\/span><\/sc-for>\n<\/div>\n<div style=\"display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: #5a6070\">\n<sc-for list=\"{{sel.dirBar}}\" as=\"d\" hint-placeholder-count=\"4\"><span style=\"display: inline-flex; align-items: center; gap: 6px\"><span style=\"width: 9px; height: 9px; border-radius: 2px; background: {{d.color}}\"><\/span>{{d.label}} {{d.n}}<\/span><\/sc-for>\n<\/div>\n<\/div>\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<h3 style=\"margin: 0; font-size: 14px; font-weight: 700\">{{sel.groupHead}}<\/h3>\n<sc-for list=\"{{sel.groups}}\" as=\"g\" hint-placeholder-count=\"6\">\n<div style=\"border: 1px solid {{g.border}}; border-radius: 12px; background: #ffffff; overflow: hidden\">\n<button type=\"button\" aria-expanded=\"{{g.open}}\" onClick=\"{{g.toggle}}\" style=\"appearance: none; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 10px 14px; border: 0; background: {{g.headBg}}; font: inherit; text-align: left; cursor: pointer\">\n<span style=\"flex: none; width: {{sel.labW}}px; font-size: 14.5px; font-weight: 700; line-height: 1.4; color: {{sel.labFg}}\">{{g.label}}<\/span>\n<span style=\"flex: 1 1 auto; height: 6px; border-radius: 3px; background: #eef0f3; display: flex\"><span style=\"width: {{g.pct}}%; border-radius: 3px; background: #91b48f\"><\/span><\/span>\n<span style=\"flex: none; min-width: 26px; text-align: right; font-size: 15px; font-weight: 700; color: #213b25\">{{g.n}}<\/span>\n<\/button>\n<sc-if value=\"{{g.open}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; flex-direction: column; gap: 8px; padding: 12px 14px 14px\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px\">\n<sc-for list=\"{{g.grps}}\" as=\"q\" hint-placeholder-count=\"3\"><span style=\"font-size: 12.5px; padding: 4px 10px; border-radius: 999px; background: #eef0f3; color: #3a3f4d\">{{q.name}} {{q.n}}<\/span><\/sc-for>\n<\/div>\n<sc-for list=\"{{g.tools}}\" as=\"t\" hint-placeholder-count=\"4\">\n<button type=\"button\" onClick=\"{{t.open}}\" style=\"appearance: none; display: flex; flex-direction: column; gap: 6px; width: 100%; padding: 10px 12px; border: 1px solid #eceef1; border-radius: 10px; background: #ffffff; font: inherit; text-align: left; cursor: pointer\">\n<span style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%\"><span style=\"font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 5px; background: #eef0f6; color: #2f3b6f\">{{t.code}}<\/span><span style=\"font-size: 12px; padding: 2px 8px; border-radius: 999px; background: {{t.stBg}}; color: {{t.stFg}}\">{{t.status}}<\/span><\/span>\n<span style=\"font-size: 14px; line-height: 1.55; color: #1f2433\">{{t.name}}<\/span>\n<span style=\"display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: #5a6070\"><span style=\"width: 8px; height: 8px; border-radius: 50%; background: {{t.dirColor}}\"><\/span>{{t.dir}}<\/span>\n<\/button>\n<\/sc-for>\n<\/div>\n<\/sc-if>\n<\/div>\n<\/sc-for>\n<\/div>\n<\/aside>\n<\/sc-if>\n\n<\/div>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"toolOk\":{\"editor\":null},\"openPolicy\":{\"editor\":null},\"$preview\":{\"width\":1340,\"height\":1100}}'>\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { axis: 'row', sel: null, open: null };\n  }\n  renderVals() {\n    const B = window.__DATA_ZH || { D: { cats: [], macros: [], cells: {} }, CODE_OF: {}, CODE2: {} };\n    const D = B.D;\n    const DIRS = [['限制', '#7a1f2b'], ['監測', '#b07a1e'], ['促進', '#1f6f5c'], ['監督制衡', '#6b7280'], ['制度設計', '#6b5b95']];\n    const DIRC = Object.fromEntries(DIRS);\n    const bucket = (p) => (p || '').startsWith('T5') ? '現行生效' : ((p || '').startsWith('T1') ? '已撤銷' : '推進中');\n    const ST = { '現行生效': ['#e6f2ef', '#1f6f5c', '現行生效'], '推進中': ['#f7eedc', '#8a5d12', '推進中'], '已撤銷': ['#eef0f3', '#5a6070', '已撤銷／失效'] };\n    const toolOk = this.props.toolOk || (() => true);\n    const keep = (t) => toolOk(t.no);\n    const list = (cat, m) => (D.cells[cat + '|||' + m] || []).filter(keep);\n    const tier = (n) => n >= 20 ? [50, '#2f3b6f', '#ffffff', 15] : n >= 10 ? [44, '#4a5797', '#ffffff', 14] : n >= 6 ? [38, '#8f99c8', '#1a2250', 13.5] : n >= 3 ? [32, '#c5cbe4', '#1a2250', 13] : [26, '#e4e7f2', '#1a2250', 12.5];\n    const split = (name) => { const m = name.match(/^(.*?)（(.*)）$/); return m ? [m[1], m[2]] : [name, '']; };\n    const dirBarOf = (tools) => DIRS.map(([label, color]) => ({ label, color, n: tools.filter((t) => t.dir === label).length })).filter((d) => d.n > 0);\n    // axis 'row': sel = 標的, open = 展開的大類；axis 'col': sel = 大類, open = 展開的標的\n    const axis = this.state.axis; const sel = this.state.sel; const open = this.state.open;\n    const rowSel = axis === 'row' ? sel : null; const colSel = axis === 'col' ? sel : null;\n\n    const allKept = {};\n    D.cats.forEach((c) => D.macros.forEach((m) => list(c, m).forEach((t) => { allKept[t.no] = t; })));\n    const allTools = Object.values(allKept);\n\n    const colN = D.macros.map((m) => { const s = new Set(); D.cats.forEach((c) => list(c, m).forEach((t) => s.add(t.no))); return s.size; });\n    const rowsRaw = D.cats.map((cat) => {\n      const per = D.macros.map((m) => list(cat, m));\n      const uniq = new Set(); per.forEach((l) => l.forEach((t) => uniq.add(t.no)));\n      return { cat, per, total: uniq.size };\n    });\n    const maxTot = Math.max(1, ...rowsRaw.map((r) => r.total));\n    const pickRow = (cat, macro) => () => {\n      if (macro) { this.setState({ axis: 'row', sel: cat, open: macro }); return; }\n      const r = rowsRaw.find((x) => x.cat === cat);\n      const best = D.macros.map((m, i) => [m, r.per[i].length]).filter((x) => x[1] > 0).sort((a, b) => b[1] - a[1])[0];\n      this.setState({ axis: 'row', sel: cat, open: best ? best[0] : null });\n    };\n    const pickCol = (m) => () => {\n      const i = D.macros.indexOf(m);\n      const best = rowsRaw.map((r) => [r.cat, r.per[i].length]).filter((x) => x[1] > 0).sort((a, b) => b[1] - a[1])[0];\n      this.setState({ axis: 'col', sel: m, open: best ? best[0] : null });\n    };\n    const colIdx = colSel !== null ? D.macros.indexOf(colSel) : -1;\n\n    const rows = rowsRaw.map((r) => {\n      const isSel = rowSel === r.cat;\n      const dim = (rowSel !== null && !isSel) || (colIdx >= 0 && r.per[colIdx].length === 0);\n      const [name, sub] = split(r.cat);\n      return {\n        name, sub, hasSub: !!sub, selected: isSel ? 'true' : 'false',\n        pick: pickRow(r.cat, null),\n        rowBg: isSel ? '#f3f4fa' : '#ffffff',\n        lbBg: isSel ? '#2f3b6f' : (dim ? '#f7f7f9' : '#fbf7f0'),\n        lbBorder: isSel ? '#1a2250' : (dim ? '#e2e4e9' : '#e5d0ac'),\n        lbFg: isSel ? '#ffffff' : (dim ? '#646976' : '#46361d'),\n        lbSub: isSel ? '#d6dbf0' : (dim ? '#646976' : '#6b5a3a'),\n        empty: r.total === 0, nonEmpty: r.total > 0,\n        total: r.total, totFg: rowSel !== null && !isSel ? '#646976' : '#1f2433',\n        barW: Math.round(r.total / maxTot * 44),\n        cells: r.per.map((l, i) => {\n          const n = l.length; const [d, bg, fg, fs] = tier(n);\n          const cellDim = (rowSel !== null && !isSel) || (colIdx >= 0 && i !== colIdx);\n          const ring = (isSel && open === D.macros[i]) || (i === colIdx && open === r.cat) ? '0 0 0 3px #f3f4fa, 0 0 0 5px #3d6b41' : 'none';\n          return {\n            has: n > 0, none: n === 0, n, d, fs,\n            bg: cellDim ? '#eceef1' : bg, fg: cellDim ? '#646976' : fg, ring,\n            aria: name + ' × ' + D.macros[i] + '：' + n + ' 項',\n            pick: pickRow(r.cat, D.macros[i])\n          };\n        })\n      };\n    });\n\n    const cols = D.macros.map((m, i) => {\n      const isC = colSel === m; const hot = rowSel !== null && open === m; const dimC = colSel !== null && !isC;\n      return {\n        name: m, n: colN[i], pressed: isC ? 'true' : 'false', pick: pickCol(m),\n        bg: isC ? '#2f5a33' : (hot ? '#cde2ca' : (dimC ? '#f7f8f7' : '#f3f8f2')),\n        border: isC ? '2px solid #1f4224' : (hot ? '2px solid #3d6b41' : (dimC ? '1px solid #e2e8e1' : '1px solid #c1dabe')),\n        nameFg: isC ? '#ffffff' : (dimC ? '#6b7080' : '#213b25'), nFg: isC ? '#d8ead6' : (dimC ? '#8a909c' : '#33603a')\n      };\n    });\n\n    // Panel groups: row mode groups a 標的's tools by 大類; column mode groups a 大類's tools by 標的.\n    const buildGroups = (groups) => {\n      const maxG = Math.max(1, ...groups.map((g) => g.l.length));\n      return groups.map((g) => {\n        const isOpen = open === g.key;\n        const grpCount = {}; g.l.forEach((t) => { grpCount[t.grp] = (grpCount[t.grp] || 0) + 1; });\n        return {\n          label: g.label, n: g.l.length, pct: Math.round(g.l.length / maxG * 100),\n          open: isOpen, border: isOpen ? '#91b48f' : '#e3e6ea', headBg: isOpen ? '#f3f8f2' : '#ffffff',\n          toggle: () => this.setState({ open: isOpen ? null : g.key }),\n          grps: Object.entries(grpCount).sort((a, b) => b[1] - a[1]).map(([name2, n]) => ({ name: name2, n })),\n          tools: g.l.slice().sort((a, b) => a.no - b.no).map((t) => {\n            const pid = B.CODE_OF[String(t.no)]; const st = ST[bucket(t.prog)];\n            return {\n              code: B.CODE2[pid] || pid, name: t.tool, dir: t.dir, dirColor: DIRC[t.dir] || '#6b7280',\n              status: st[2], stBg: st[0], stFg: st[1],\n              open: () => { if (this.props.openPolicy) this.props.openPolicy(pid); }\n            };\n          })\n        };\n      });\n    };\n    const summary = (raw) => {\n      const tools = {}; raw.forEach((g) => g.l.forEach((t) => { tools[t.no] = t; }));\n      const tl = Object.values(tools); const dirBar = dirBarOf(tl);\n      return { nTool: tl.length, nPol: new Set(tl.map((t) => B.CODE_OF[String(t.no)])).size, dirBar, dirAria: '作用方向：' + dirBar.map((d) => d.label + ' ' + d.n).join('、') };\n    };\n    let selV = { kicker: '', thirdLabel: '', groupHead: '', labW: 128, labFg: '#213b25', name: '', sub: '', hasSub: false, nTool: 0, nPol: 0, nMacro: 0, dirBar: [], dirAria: '', groups: [] };\n    if (rowSel !== null) {\n      const r = rowsRaw.find((x) => x.cat === rowSel);\n      const raw = D.macros.map((m, i) => ({ key: m, label: m, l: r.per[i] })).filter((g) => g.l.length > 0).sort((a, b) => b.l.length - a.l.length);\n      const [name, sub] = split(rowSel);\n      selV = Object.assign({ kicker: '管制標的', thirdLabel: '類工具大類', groupHead: '依工具大類', labW: 128, labFg: '#213b25', name, sub, hasSub: !!sub, nMacro: raw.length, groups: buildGroups(raw) }, summary(raw));\n    } else if (colSel !== null) {\n      const raw = rowsRaw.map((r) => ({ key: r.cat, label: split(r.cat)[0], l: r.per[colIdx] })).filter((g) => g.l.length > 0).sort((a, b) => b.l.length - a.l.length);\n      selV = Object.assign({ kicker: '政策工具大類', thirdLabel: '類管制標的', groupHead: '依管制標的（一項工具可涉及多個標的）', labW: 150, labFg: '#46361d', name: colSel, sub: '', hasSub: false, nMacro: raw.length, groups: buildGroups(raw) }, summary(raw));\n    }\n    const dirBar = dirBarOf(allTools);\n    return {\n      nCat: D.cats.length, nMacro: D.macros.length, cols, rows,\n      dirBar, dirAria: '作用方向：' + dirBar.map((d) => d.label + ' ' + d.n).join('、'),\n      hasSel: rowSel !== null || colSel !== null, sel: selV,\n      clear: () => this.setState({ sel: null, open: null })\n    };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n","./PolicyDB.dc.html":"<!doctype html>\n<html lang=\"zh-Hant\">\n<head>\n<meta charset=\"utf-8\">\n<title>政策資料庫<\/title>\n<script src=\"./vendor/react.js\"><\/script>\n<script src=\"./vendor/react-dom.js\"><\/script>\n<script src=\"./support.js\"><\/script>\n<script src=\"./assets/dfdd7576b54cc91759c0ad9b20d3b29a.js\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;family=Noto+Serif+TC:wght@700&amp;display=swap\">\n<style>\nbody{margin:0}\na{color:#2f3b6f}a:hover{color:#1a2250}\n[data-pdb-list]{position:sticky;top:12px;z-index:2;max-height:calc(100vh - 24px);overflow-y:auto;background:#f op = '（(【〔['; const cl = '）)】〕]';\n      for (const ch of s) {\n        if (op.includes(ch)) d++; else if (cl.includes(ch)) d = Math.max(0, d - 1);\n        if (d === 0 && re.test(ch)) { if (buf.trim()) out.push(buf.trim()); buf = ''; } else buf += ch;\n      }\n      if (buf.trim()) out.push(buf.trim()); return out;\n    };\n    const detailLines = (text) => {\n      text = (text == null ? '' : String(text)).trim(); if (!text) return [];\n      const items = [];\n      text.split(/\\n+/).map((l) => l.trim()).filter(Boolean).forEach((line) => {\n        const isB = /^[・·•]/.test(line); const body = line.replace(/^[・·•]\\s*/, '');\n        let parts = splitTop(body, /[；;]/);\n        const doSplit = parts.length >= 3 || (parts.length === 2 && body.length > 60);\n        if (doSplit) {\n          let lead = ''; const first = parts[0]; const ci = first.lastIndexOf('：');\n          if (ci > 0 && ci < first.length - 1) { lead = first.slice(0, ci + 1); parts = parts.slice(); parts[0] = first.slice(ci + 1).trim(); }\n          else if (ci === first.length - 1) { lead = first; parts = parts.slice(1); }\n          if (lead) items.push(P_(lead));\n          parts.forEach((sg) => items.push(B_(sg)));\n        } else if (isB) items.push(B_(body));\n        else items.push(P_(body));\n      });\n      return items;\n    };\n    const CN = { '一': 1, '二': 2, '兩': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9, '十': 10 };\n    const announce = (s) => { if (/[：:]/.test(s) || s.length > 18) return 0; const m = s.match(/([0-9]+|[一二三四五六七八九十兩])\\s*項/); if (!m) return 0; return /[0-9]/.test(m[1]) ? parseInt(m[1], 10) : (CN[m[1]] || 0); };\n    const sectionLines = (text) => {\n      const numRe = /^[（(]\\s*([0-9０-９一二三四五六七八九十]+)\\s*[）)]\\s*/;\n      const items = []; let auto = 0; let autoMax = 0;\n      (text || '').split('\\n').filter((l) => l.trim() !== '').forEach((l) => {\n        const t = l.trim().replace(/^[・·•]\\s*/, '');\n        const nm = t.match(numRe);\n        if  : 'false', chev: open ? '▾' : '▸',\n        headBg: open ? '#eef0f3' : '#f6f7f9',\n        toggle: () => this.setState({ closed: Object.assign({}, this.state.closed, { [t.code]: open }) }),\n        rows: rows.map((p) => {\n          const on = s.sel === p.code; const b = bucket(p.prog);\n          return {\n            code: p.disp, item: p.item, status: ST[b][2], dot: DOT[b], pressed: on ? 'true' : 'false',\n            border: on ? '#1a2250' : '#eceef1', accent: on ? '#b07a1e' : '#eceef1', bg: on ? '#2f3b6f' : '#ffffff',\n            shadow: on ? '0 2px 8px rgba(26, 34, 80, 0.28)' : 'none', fg: on ? '#ffffff' : '#1f2433', codeFg: on ? '#f3d9a8' : '#2f3b6f',\n            weight: on ? 700 : 400, dotRing: on ? '0 0 0 2px #ffffff' : 'none',\n            pick: () => this.setState({ sel: p.code, openTool: null })\n          };\n        })\n      };\n    }).filter((g) => g.rows.length > 0);\n    const allClosed = {}; usedTracks.forEach((t) => { allClosed[t.code] = true; });\n    const selP = D.pol.find((p) => p.code === s.sel);\n\n    const P = D.pol.find((p) => p.code === s.sel);\n    let pv = { toolNote: '', code: '', status: '', stBg: '', stFg: '', year: '', trackLabel: '', item: '', id: '', hasId: false, nodes: [], hasNodes: false, meta: [], blocks: [], links: [], hasLinks: false, nTool: 0, tools: [] };\n    if (P) {\n      const full = {}; Object.values(D.cells).forEach((l) => l.forEach((t) => { full[t.no] = t; }));\n      const tools = Object.values(full).filter((t) => B.CODE_OF[String(t.no)] === P.code).sort((a, b) => a.no - b.no);\n      const st = ST[bucket(P.prog)];\n      const tr = B.TRACKS.find((t) => t.code === P.track);\n      const nodeName = {}; (D.nodes || []).forEach((n) => { nodeName[n.id] = n.name; });\n      const nodes = [...new Set(Object.keys(D.polcells || {}).filter((k) => k.split('|||')[0] === P.code).map((k) => k.split('|||')[1]))]\n        .sort((a, b) => parseInt(a.slice(1), 10) - parseInt(b.slice(1), 10));\n      const FIELDS = [['act', '工具作用'], ['op', '操作方式'], ['appl', '適用對象'], ['trig', '觸發要件／門檻'], ['spec', '具體標的'], ['impl', '實施機關'], ['law', '授權／制定主體'], ['note', '備註']];\n      pv = {\n        code: P.disp, status: st[2], stBg: st[0], stFg: st[1], year: P.year || '', trackLabel: tr ? tr.zh : P.track, item: P.item,\n        id: P.id || '', hasId: !!P.id,\n        nodes: nodes.map((id) => ({ id, title: nodeName[id] || id })), hasNodes: nodes.length > 0,\n        meta: [['進度', progLines(P.prog)], ['頒布者／提案人', [P_(P.who || '—')]], ['日期', [P_(P.date || '—')]]].map(([label, lines]) => ({ label, lines })),\n        blocks: [['背景與脈絡', P.bg], ['內容', P.body], ['法源', P.law]].filter((m) => m[1]).map(([label, v]) => ({ label, lines: label === '法源' ? sectionLines(splitTop(String(v), /[。]/).join('\\n')) : sectionLines(v) })),\n        links: (B.LINKS[P.code] || '').split('\\n').map((x) => x.trim()).filter(Boolean).map((href) => ({ href })),\n        nTool: tools.length,\n        toolNote: filtered ? '符合目前篩選 ' + tools.filter((t) => toolOk(t.no)).length + ' 項' : '',\n        tools: tools.map((t, i) => {\n          const on = s.openTool === t.no; const off = filtered && !toolOk(t.no);\n          return {\n            off, opacity: off ? 0.5 : 1,\n            idx: 'T' + String(i + 1).padStart(2, '0'), name: t.tool, dir: t.dir, macro: t.macro, dirColor: DIRC[t.dir] || '#6b7280',\n            open: on, border: on ? '#91b48f' : '#e3e6ea', headBg: on ? '#f3f8f2' : '#ffffff',\n            toggle: () => this.setState({ openTool: on ? null : t.no }),\n            fields: [['grp', '工具群組']].concat(FIELDS).filter(([k]) => t[k]).map(([k, label]) => ({ label, lines: detailLines(t[k]) }))\n          };\n        })\n      };\n      pv.hasLinks = pv.links.length > 0;\n    }\n    return {\n      groups,\n      countLine: (filtered ? '符合篩選 ' : '顯示 ') + shown.length + ' / ' + D.pol.length + ' 項政策',\n      expandAll: () => this.setState({ closed: {} }), collapseAll: () => this.setState({ closed: allClosed }),\n      selHidden: !!selP && !polOk(selP.code), selCode: selP ? selP.disp : '',\n      noSel: !P, hasSel: !!P, p: pv\n    };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n","./SupplyView.dc.html":"<!doctype html>\n<html lang=\"zh-Hant\">\n<head>\n<meta charset=\"utf-8\">\n<title>供應鏈版圖<\/title>\n<script src=\"./vendor/react.js\"><\/script>\n<script src=\"./vendor/react-dom.js\"><\/script>\n<script src=\"./support.js\"><\/script>\n<script src=\"./assets/dfdd7576b54cc91759c0ad9b20d3b29a.js\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;family=Noto+Serif+TC:wght@700&amp;display=swap\">\n<style>\nbody{margin:0}\n<\/style>\n<\/helmet>\n<div style=\"font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; color: #1f2433; background: #ffffff\">\n\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 0 2px 16px\">\n<sc-if value=\"{{split}}\" hint-placeholder-val=\"{{true}}\"><button type=\"button\" aria-pressed=\"true\" onClick=\"{{toggleSplit}}\" style=\"appearance: none; display: inline-flex; align-items: center; gap: 7px; height: 42px; padding: 0 14px; border: 1px solid #2f3b6f; border-radius: 10px; background: #2f3b6f; font: inherit; font-size: 15px; font-weight: 700; color: #ffffff; cursor: pointer\">分開標示適用全鏈的工具<\/button><\/sc-if>\n<sc-if value=\"{{merged}}\" hint-placeholder-val=\"{{false}}\"><button type=\"button\" aria-pressed=\"false\" onClick=\"{{toggleSplit}}\" style=\"appearance: none; display: inline-flex; align-items: center; gap: 7px; height: 42px; padding: 0 14px; border: 1px solid #dde0e5; border-radius: 10px; background: #ffffff; font: inherit; font-size: 15px; color: #5a6070; cursor: pointer\">分開標示適用全鏈的工具<\/button><\/sc-if>\n<\/div>\n\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; margin: 0 8px 18px\">\n<h2 style=\"margin: 0; font-size: 18px; font-weight: 70 t; width: 40px; height: 260px\">\n<sc-for list=\"{{n.segs}}\" as=\"s\" hint-placeholder-count=\"3\"><span style=\"height: {{s.h}}px; background: {{s.bg}}\"><\/span><\/sc-for>\n<\/span>\n<span style=\"font-size: 11.5px; color: #6b7080\">{{n.id}}<\/span>\n<span style=\"font-size: 13.5px; font-weight: 700; color: {{n.fg}}; text-align: center; line-height: 1.35\">{{n.short}}<\/span>\n<\/button>\n<\/sc-for>\n<sc-if value=\"{{split}}\" hint-placeholder-val=\"{{true}}\">\n<div style=\"grid-column: span 15; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 14px 18px; border: 1px solid #c9ccd3; border-radius: 10px; background: repeating-linear-gradient(135deg, #f4f5f7 0 6px, #eceef1 6px 12px)\">\n<span style=\"font-size: 14px; font-weight: 700; color: #1f2433\">全鏈適用　基線制度工具 {{nChain}} 項<\/span>\n<span style=\"font-size: 13.5px; line-height: 1.6; color: #3a3f4d\">{{chainExamples}}<\/span>\n<\/div>\n<\/sc-if>\n<\/div>\n<\/div>\n\n<p style=\"margin: 16px 8px 0; font-size: 13.5px; line-height: 1.7; color: #5a6070\">每個節點的數字＝對應到這個節點的工具（圖上「個別」），再加上適用全鏈的 {{nChain}} 項。一項工具可能對應好幾個節點；另有 {{nUnmapped}} 項工具沒有對應到特定節點，不列在圖上。<\/p>\n\n<sc-if value=\"{{hasSel}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; flex-direction: column; gap: 12px; margin: 22px 8px 0; padding: 18px 20px; border: 1px solid #c5cbe4; border-radius: 12px; background: #fcfcfe\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px\">\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-size: 12.5px; font-weight: 700; letter-spacing: 0.12em; color: #7a5a2e\">供應鏈節點・{{sel.id}}<\/span>\n<h3 style=\"margin: 0; font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 22px; color: #1a2250\">{{sel.short}}<\/h3>\n<\/div>\n<div style=\"display: flex; align-items: center; gap: 12px\">\n<span style=\"font-size: 13.5px; color: #5a6070\">{{sel.summary}}<\/span>\n<button type=\"button\" aria-label=\"清除選取\" onClick=\"{{clear}}\" style=\"appearance: none; flex: none; width: 44px; height: 44px; border: 1px solid #dde0e5; border-radius: 10px; background: #ffffff; font: inherit; font-size: 20px; line-height: 1; color: #5a6070; cursor: pointer\">×<\/button>\n<\/div>\n<\/div>\n<sc-for list=\"{{sel.groups}}\" as=\"g\" hint-placeholder-count=\"5\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<h4 style=\"margin: 6px 0 0; font-size: 14px; font-weight: 700; color: #213b25\">{{g.macro}}　{{g.n}}<\/h4>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 4px 18px\">\n<sc-for list=\"{{g.tools}}\" as=\"t\" hint-placeholder-count=\"4\">\n<button type=\"button\" onClick=\"{{t.open}}\" style=\"appearance: none; display: flex; align-items: baseline; gap: 10px; padding: 7px 0; border: 0; border-bottom: 1px solid #eceef1; background: none; font: inherit; text-align: left; cursor: pointer\"><span style=\"flex: none; width: 56px; font-size: 12px; font-weight: 700; color: #2f3b6f\">{{t.code}}<\/span><span style=\"flex: 1 1 auto; font-size: 13.5px; line-height: 1.5; color: #1f2433\">{{t.name}}<\/span><span style=\"flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #5a6070\"><span style=\"width: 8px; height: 8px; border-radius: 50%; background: {{t.dirColor}}\"><\/span>{{t.tag}}<\/span><\/button>\n<\/sc-for>\n<\/div>\n<\/div>\n<\/sc-for>\n<\/div>\n<\/sc-if>\n\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"toolOk\":{\"editor\":null},\"openPolicy\":{\"editor\":null},\"$preview\":{\"width\":1340,\"height\":900}}'>\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { split: true, sel: null };\n  }\n  renderVals() {\n    const B = window.__DATA_ZH || { D: { nodes: [], nodecells: {}, cells: {} }, CODE_OF: {}, CODE2: {} };\n    const D = B.D;\n    const SHORT = { N1: 'EDA／核心 IP', N2: '製造設備', N3: '材料', N4: '設計', N5: '製造（fab）', N6: '封裝測試', N7: 'AI 硬體成品', N8: '機房／網通', N9: '電力水連網', N10: '資料中心建置', N11: '資料中心營運', N12: '算力供給／遠距', N13: '演算法／資料', N14: 'AI 訓練', N15: '終端用途' };\n    const STAGE = { 'Chip Production Inputs': '晶片生產投入', 'Semiconductor Supply Chain': '半導體供應鏈', 'Data Center Infra Inputs': '資料中心基礎投入', 'Hardware Operations': '硬體營運', 'Algorithms and Data': '演算法與資料', 'AI Training': 'AI 訓練', 'End-Use': '終端應用' };\n    const DIRS = [['限制', '#7a1f2b'], ['監測', '#b07a1e'], ['促進', '#1f6f5c'], ['監督制衡', '#6b7280'], ['制度設計', '#6b5b95']];\n    const DIRC = Object.fromEntries(DIRS);\n    const HATCH = 'repeating-linear-gradient(135deg, #b9bdc6 0 2px, #eef0f3 2px 5px)';\n    const PX = 3.4;\n    const full = {}; Object.values(D.cells).forEach((l) => l.forEach((t) => { full[t.no] = t; }));\n    const byNode = {}; D.nodes.forEach((n) => { byNode[n.id] = new Set(); });\n    Object.entries(D.nodecells).forEach(([k, l]) => { const nid = k.split('|||')[0]; if (byNode[nid]) l.forEach((t) => byNode[nid].add(t.no)); });\n    const ids = D.nodes.map((n) => n.id);\n    const chain = ids.length ? [...byNode[ids[0]]].filter((no) => ids.every((id) => byNode[id].has(no))) : [];\n    const chainSet = new Set(chain);\n    const toolOk = this.props.toolOk || (() => true);\n    ids.forEach((id) => { byNode[id] = new Set([...byNode[id]].filter((no) => toolOk(no))); });\n    const nChainOk = chain.filter((no) => toolOk(no)).length;\n    const mapped = new Set(); ids.forEach((id) => byNode[id].forEach((no) => mapped.add(no)));\n    const split = this.state.split; const sel = this.state.sel;\n    const nodes = D.nodes.map((n) => {\n      const all = [...byNode[n.id]]; const own = all.filter((no) => !chainSet.has(no));\n      const segs = [];\n      if (split && nChainOk) segs.push({ h: Math.round(nChainOk * PX), bg: HATCH });\n      const pool = split ? own : all;\n      DIRS.forEach(([d, c]) => { const k = pool.filter((no) => full[no] && full[no].dir === d).length; if (k) segs.push({ h: Math.round(k * PX), bg: c }); });\n      const isSel = sel === n.id;\n      return {\n        id: n.id, short: SHORT[n.id] || n.name, total: all.length,\n        subLine: split ? '個別 ' + own.length : '工具 ' + all.length,\n        segs, pressed: isSel ? 'true' : 'false', aria: n.id + ' ' + (SHORT[n.id] || n.name) + '：' + all.length + ' 項',\n        border: isSel ? '#2f3b6f' : '#eceef1', bg: isSel ? '#f3f4fa' : '#ffffff', fg: isSel ? '#1a2250' : '#1f2433',\n        pick: () => this.setState({ sel: this.state.sel === n.id ? null : n.id })\n      };\n    });\n    const stages = []; D.nodes.forEach((n) => { const last = stages[stages.length - 1]; if (last && last.grp === n.grp) last.span += 1; else stages.push({ grp: n.grp, span: 1, label: STAGE[n.grp] || n.grp }); });\n    const exampleNames = ['受 EAR 管轄物項範圍之一般界定', '最低含量門檻（de minimis）之管轄除外規則', '國家群組目的地分類之一般架構', '實體清單列名之附加許可要求'].filter((nm) => chain.some((no) => full[no] && full[no].tool === nm));\n    let selV = { id: '', short: '', summary: '', groups: [] };\n    if (sel) {\n      const all = [...byNode[sel]].filter((no) => full[no]);\n      const groups = {};\n      all.forEach((no) => { const t = full[no]; (groups[t.macro] = groups[t.macro] || []).push(t); });\n      const order = (D.macros || Object.keys(groups)).filter((m) => groups[m]);\n      selV = {\n        id: sel, short: SHORT[sel] || sel,\n        summary: all.length + ' 項工具（個別 ' + all.filter((no) => !chainSet.has(no)).length + '、全鏈適用 ' + all.filter((no) => chainSet.has(no)).length + '）',\n        groups: order.map((m) => ({\n          macro: m, n: groups[m].length,\n          tools: groups[m].sort((a, b) => a.no - b.no).map((t) => {\n            const pid = B.CODE_OF[String(t.no)];\n            return { code: B.CODE2[pid] || pid, name: t.tool, dirColor: DIRC[t.dir] || '#6b7280', tag: t.dir + (chainSet.has(t.no) ? '・全鏈' : ''), open: () => { if (this.props.openPolicy) this.props.openPolicy(pid); } };\n          })\n        }))\n      };\n    }\n    return {\n      split, merged: !split, toggleSplit: () => this.setState({ split: !this.state.split }),\n      legend: DIRS.map(([label, color]) => ({ label, color })),\n      nChain: nChainOk, nNode: ids.length, nMapped: mapped.size,\n      nUnmapped: Object.keys(B.CODE_OF).filter((no) => toolOk(Number(no))).length - mapped.size,\n      chainExamples: exampleNames.length ? '如：' + exampleNames.join('、') : '',\n      stages, nodes, hasSel: !!sel, sel: selV,\n      clear: () => this.setState({ sel: null })\n    };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n"};var R=window.__resources=window.__resources||{};var B=window.__resourceBlobs=window.__resourceBlobs||{};for(var k in S){R[k]=k;B[k]=new Blob([S[k]],{type:"text/html"});}})();</script>

R 判斷目的地別義務之出口人、再出口人與境內移轉人","trig":"目的地列入或移出群組即改變其適用之許可要求與授權例外適格；成員修訂以聯邦公報規則為之","impl":"BIS","note":"群組成員隨規則修訂變動（修訂以聯邦公報規則為之）"},{"no":84,"tool":"列名判準與跨部會決定程序","dir":"制度設計","macro":"制度與程序設計","grp":"機關程序","prog":"T5 現行有效——1997-02-03 規則創設實體清單。","item":"實體清單制度","spec":"實體清單之加列、除名與修改決定（判準與程序）","act":"確立列名門檻（§744.11(b)：依具體事實合理相信涉違反美國國安／外交政策利益——明文含人權——之當事人得列名、例示五類、不列 §772.1 美國人）與治理架構（終端用戶審查委員會 ERC 多數決加列·一致決除名、逐級上訴至出口管理審查委員會 EARB 以至總統）","op":"列名門檻：依具體且可指明的事實，有合理原因相信實體或高轉運風險地址的交易當事人已涉入、正涉入或有重大風險涉入違反美國國家安全或外交政策利益的活動，或為其行事者，得依 EAR §744.11(b) 列名。§744.11(b)(1)–(5) 例示包括：\n(1) 支持從事恐怖行為之人\n(2) 增強支恐政權的軍事能力或支恐能力\n(3) 以違反美國利益的方式移轉、開發、維修、修理或生產常規武器，或以零組件、技術或資金促成之\n(4) 阻撓 BIS 或國務院防衛貿易管制局的終端用途查核，包括妨礙接觸、拒絕提供資訊、提供不實或誤導資訊，以及地主國持續不配合完成未經核實清單實體的查核\n(5) 從事可能導致違反 EAR 的行為，且終端用戶審查委員會（End-User Review Committee, ERC）認為事前審查有助防止違規\n排除：§772.1 所定美國人不得列入。\n委員會組成與表決（§744.16(d)）：ERC 由商務部主持，成員包括國務院、國防部及能源部，必要時包括財政部；加列採多數決，除名與修改採一致決。\n成員機關上訴：不服 ERC 決定的成員機關，得依序上訴至出口政策諮詢委員會（Advisory Committee on Export Policy）、出口管理審查委員會（Export Administration Review Board）及總統。\n當事人申請（§744.16(e)）：列名實體及列名高轉運風險地址的所有人或營運人得書面申請除名或修改；出口管理副助理部長（Deputy Assistant Secretary for Export Administration）以書面通知決定。該決定為最終機關行為，不適用 EAR 第 756 部上訴程序；ERC 並定期覆審清單。\n跨部會決定程序（Supplement No. 5 to Part 744）：\n(1) 成員機關提出加列、除名或修改提案\n(2) ERC 主席將提案循環分送成員機關\n(3) 成員機關依適用門檻表決\n(4) 不服的成員機關依跨部會層級上訴\n(5) 最終決定作為實體清單修訂公告的跨部會清關\n上述程序亦適用於軍事終端用戶清單（MEU List）決定。","law":"國會（ECRA 常設授權）；BIS 發布規則","appl":"ERC 成員機關；列名實體及列名高轉運風險地址之所有人／營運人（除名／修改申請人）","trig":"成員機關向主席提案（首次分送後 30 日內表決，經一致同意得展延）；或列名實體（及列名高轉運風險地址之所有人／營運人）提出除名／修改申請","impl":"BIS","note":"2008-08-21 規則將列名事由自防擴散等特定條文擴及一般性國安外交政策判準、並法典化 ERC 程序（73 FR 49311）"},{"no":85,"tool":"BIS 諮詢意見對「提供雲端／網格運算能力不構成 EAR 出口」之認定","dir":"制度設計","macro":"制度與程序設計","grp":"機關程序","prog":"T5 現行有效——2009-01-13 發布之 BIS 諮詢意見（advisory opinion），屬個案行政解釋、無法規拘束力；2014-11-13 意見延伸其適用；相關原則其後部分成文化於 EAR §734.13、§734.18","item":"BIS 雲端運算諮詢意見","spec":"雲端／網格運算能力之提供服務（提供者未輸送受 EAR 商品／軟體／技術之情形；含雲端使用而不下載受控軟體）","act":"確立「未輸送受 EAR 商品／軟體／技術時，提供雲端／網格運算能力本身不構成 EAR 出口」；非全面豁免（§744.6、License Exception APP 國別存取限制等仍可能適用）","op":"以行政諮詢意見認定：提供運算能力非出口、提供者非 exporter","law":"BIS（發布諮詢意見）","appl":"雲端／網格／SaaS 服務提供者","trig":"服務提供者僅提供雲端／網格運算能力，未向使用者輸送受《出口管理規則》（Export Administration Regulations, EAR）管轄之商品、軟體或技術；使用者自行匯出資料時，提供者亦非該匯出交易之出口人（exporter）〔§734.13／§772.1〕（惟若提供者輸送受 EAR 軟體／技術，或明知將助長 §744.6 所列活動，仍受拘束）","impl":"BIS","note":"非正式法規，不具拘束力（行政解釋）"},{"no":103,"tool":"covered IC license 核發前之國會認證與 30 日（部分期間 60 日）審查期","dir":"監督制衡","macro":"制度與程序設計","grp":"國會審查·監督機制","prog":"T3 委員會通過：\n・眾院 H.R. 6875：外交事務委員會（HFAC）2026-01-21 以 42–2–1（1 票 present）表決通過修正並決議報告（ordered reported, as amended）；基礎文本為 Mast 修正案性質之替代案 #106（amendment in the nature of a substitute，經一致同意作為基礎文本），Amo 對該替代案之修正案未獲通過（20–25）\n・參院 S. 4456：2026-04-30 提出，付參院銀行委員會（Senate Committee on Banking, Housing, and Urban Affairs）","item":"AI 監督法","spec":"對受關注國家之 covered IC license 之國會審查","act":"使行政部門對受關注國家 covered IC license 之裁量受國會事前認證與審查制衡","op":"・§1758A(c)(1) 於核發前向眾院外委會與參院銀行委員會提交 license 申請與擬議 license，並載明：數量與出口管制分類碼及技術參數（A）；最終收貨人或終端用戶（B）；全部許可條件（C）；終端用戶過去、現在與將來均不直接或間接支持或促成受關注國家之軍事、情報、監控或網路能力之認證（D，含美國政府並無相反資訊、許可條件如何支撐該認證，以及對實行軍民融合政策或設有強制協助國安機關法制之受關注國家應如何處置其特定威脅）；不損美國國防工業基礎與 covered IC（含高頻寬記憶體等主要子零組件）供給之認證（E）；不損美國相對於該受關注國家在全國裝設算力總量之技術領先與優勢之認證（F）；不損美國國家安全之認證（G）；支撐 D–G 各項認證之基礎分析（H）；以及該出口對美國 AI 領先（含 AI 模型、AI 雲端服務與 covered IC 之全球市占）影響之技術評估（I，必要時附國家情報總監之替代評估）\n・§1758A(c)(3) license 須待委員會收認證 ≥30 日後始得核發","law":"美國國會（參議院審議程序準用《1976 年國際安全協助與武器出口管制法》〔International Security Assistance and Arms Export Control Act of 1976；Public Law 94–329〕§601(b)）— 立法提案中","appl":"核發對受關注國家 covered IC license 前之工業與安全副部長","trig":"核發 license 前 ≥30 日（每年 7/10–9/7 提交者 60 日）須向眾院外委會、參院銀行委員會提交申請及認證","impl":"BIS（受眾院外委會／參院銀行委員會審查）","note":"國會得於委員會收受認證後 30 日內制定聯合決議（joint resolution）禁止該筆出口、再出口或境內移轉，該許可即不得核發；參議院依《1976 年國際安全協助與武器出口管制法》§601(b) 程序審議，眾議院對經委員會提出報告之該類決議，動議進入審議視為最高優先（highly privileged）；決議得載之許可資訊以數量與出口管制分類碼及技術參數、最終收貨人或終端用戶為限。"},{"no":106,"tool":"強制商務部會同國防／能源／國務／OSTP（協調 DNI）提交美國人工智慧勝利戰略（含中國 covered IC 產能評估）","dir":"制度設計","macro":"制度與程序設計","grp":"行政·政策架構","prog":"T3 委員會通過：\n・眾院 H.R. 6875：外交事務委員會（HFAC）2026-01-21 以 42–2–1（1 票 present）表決通過修正並決議報告（ordered reported, as amended）；基礎文本為 Mast 修正案性質之替代案 #106（amendment in the nature of a substitute，經一致同意作為基礎文本），Amo 對該替代案之修正案未獲通過（20–25）\n・參院 S. 4456：2026-04-30 提出，付參院銀行委員會（Senate Committee on Banking, Housing, and Urban Affairs）","item":"AI 監督法","spec":"美國人工智慧勝利戰略（American Artificial Intelligence Victory Strategy），含中國 covered IC 產能與能力（FY2026–2027）評估","act":"設定行政部門之戰略與評估提交義務，並以其提交時點作為過渡期全面拒發之終止錨","op":"・§1758A(f) 商務部長會同受涵蓋機關首長（covered agency heads：國防部長、能源部長、國務卿、白宮科技政策辦公室主任），並協調國家情報總監，向眾院外委會與參院銀行委員會提交「美國人工智慧勝利戰略」（American Artificial Intelligence Victory Strategy）\n・戰略內容六項：贏得 AI 競賽之全政府架構；中國贏得 AI 競賽之國家安全與經濟意涵；受關注國家取得來自美國或允許國之 covered IC、半導體製造設備與相關子零組件，對 AI 競賽、中國能力與美國國家安全之影響；美國政府應採之政策調整建議；covered IC 輸往受關注國家對其軍事、情報、監控或網路能力之意涵評估；中國 FY2026–2027 covered IC 產量與能力評估（含若中國實體取得美國設計之 covered IC，是否會停止或減少自主生產之判定；與美國及其盟國產量能力之比較；若僅賴自主生產之 covered IC 與自主製造設備，受關注國家 AI 能力之量化分析）","law":"美國國會（§1758A(f)）— 立法提案中","appl":"商務部（會同國防／能源／國務／OSTP）；國家情報總監（DNI）","trig":"§1758A(f) 未定提交期限（法條無「不遲於…日內」之時限）；無效能門檻（制度義務）。其提交時點為兩項機制之起算錨：§1758A(e) 過渡期全面拒發於提交後 14 日終止；§1758A(a)(6)(B) 技術參數更新權於提交後滿 24 個月起方得行使","impl":"商務部（會同國防／能源／國務／OSTP；協調國家情報總監〔DNI〕）","note":"提交時點界定過渡全面拒發之終點"},{"no":109,"tool":"強制行政部門以外交途徑推動盟國供應國採行對等 SME 管制並向國會認證進度","dir":"制度設計","macro":"制度與程序設計","grp":"多邊協調·盟國對齊","prog":"T3 委員會通過——眾院 H.R. 8170 經眾議院外交委員會（House Foreign Affairs Committee）2026-04-22 以 36–8 表決通過修正案性質之替代案（amendment in the nature of a substitute，全案抽換）並決議報告（ordered reported in the nature of a substitute, as amended）；該替代案另經一件修正案表決通過（Baumgartner），另一件（Perry）撤回。\n參院 S. 4281 於 2026-04-13 二讀後付參議院銀行、住宅暨都市事務委員會（Committee on Banking, Housing, and Urban Affairs）審議。","item":"硬體技術管制多邊對齊法案（MATCH 法案）","spec":"盟國供應國對半導體製造設備之出口管制政策對齊","act":"課行政部門以外交協調義務，促盟國供應國採行對等之全國性管制與拒發許可政策，並就各盟國向國會認證外交途徑之採行或窮盡情形","op":"§3(e)(1) 本法生效之日起，主管機關即刻展開外交推動，尋求盟國供應國政府採行——(A) 對其管轄之關鍵卡點半導體製造設備之全國性管制，或具同等實際效果之管制與許可政策；(B) 對輸往任一關鍵半導體製造設施之所有適用項目之出口、再出口或境內移轉，採拒發推定之許可政策，並對該設施內所有適用項目之維修服務課許可要求\n§3(e)(2) 生效後 120 日內向國會提交外交努力報告：外交推動摘要；談判現況與已達成之協議；美國與盟國供應國已達成之共同管制協議；所需額外誘因之說明與評估；以及未採行 (1)(A) 者、未採行 (1)(B) 者、與美國為實施 (1) 所述管制得採取之措施\n§3(f)(2) 生效後 240 日內作成二擇一之認證或未實施國家清單\n§3(g) 國安豁免：商務部長得一次性展延 §3(f)(2) 之 240 日期限至多 60 日，惟須認定並向國會認證——展延符合美國國家安全利益（儘管受關注國家可能利用延遲囤積關鍵卡點半導體製造設備）、且相關盟國供應國政府正依其國內法規並儘速採取具體可查證步驟，以採行並實施與 §3(f)(3) 完全一致或更嚴格之管制；並提交報告說明國安利益認定之理由、展延預期達成之進展，以及主管機關為防止受關注國家囤積所採之具體可查證期中步驟\n§3(h) 豁免禁止：不得以會導致盟國供應國之管制或許可政策不具與美國管制同等實際效果、或會損害美國企業相對於盟國供應國企業技術領先之方式行使該豁免權\n§3(j) 主管機關與商務部長得以機密方式向國會提交前述認證與報告，受理委員會須確保不予公開","law":"美國國會（法案）；執行者為商務部會同國務院","appl":"美國行政部門（商務部會同國務院）對盟國供應國（allied supplier country）政府","trig":"盟國供應國（allied supplier country，§6(2)）為非受關注國家、且從事關鍵卡點半導體製造設備生產之國家。認證採二擇一（§3(f)(2)）：向國會認證所有盟國供應國均已實施(i) 對其管轄之關鍵卡點半導體製造設備之全國性管制，或具同等實際效果之管制與許可政策；且 (ii) 對輸往任一關鍵半導體製造設施之所有適用項目之出口、再出口或移轉之許可要求，並採拒發推定許可政策或具同等實際效果者；或向國會提出未實施前述全部管制之盟國供應國清單。","impl":"商務部、國務院","note":"要求與盟國政府進行多邊對齊。§3(g) 之 60 日展延由商務部長行使，毋須國務卿、國防部長或能源部長之同意（concurrence）。"},{"no":115,"tool":"強制國務院與半導體技術生產國協調，建立保護關鍵半導體技術之共同做法","dir":"制度設計","macro":"制度與程序設計","grp":"多邊協調·盟國對齊","prog":"T3 委員會通過——眾院 H.R. 6058 經眾議院外交委員會（House Foreign Affairs Committee）2026-04-22 以 44–0 表決通過修正案性質之替代案（amendment in the nature of a substitute，全案抽換）並決議報告（ordered reported, as amended）。無參院對應版本。","item":"半導體技術韌性、完整性與防衛強化法案（STRIDE 法案）","spec":"盟國半導體技術出口管制政策對齊與供應鏈保護協調","act":"課國務院與具半導體技術能力之國家協調，推動半導體製造設備與關鍵子零組件之出口管制對齊、設計工具／智慧財產移轉／設備維修服務／技術協助之限制擴大、軍民兩用材料管制協調、聯合監測執法與行政、資訊分享、可信供應商網絡，並嚴格檢討管制成效，建立防止技術經投資、人才外流及間諜而外流之協調做法","op":"§4(a) 要求國務院進行協調。\n協調目標（§4(b)）包括：\n(1) 對齊半導體製造設備及其生產所需關鍵子零組件之出口管制政策\n(2) 擴大對可能使受關注國家發展自主半導體技術能力之設計工具、智慧財產移轉、設備維修服務與技術協助之限制\n(3) 協調管制光阻、特殊氣體與先進基板等軍民兩用半導體材料\n(4) 聯合監測、執法與行政，防止經第三國實體規避管制及外國回補受限物項（含由受關注國家實體持有、控制或於其境內設總部者）\n(5) 分享半導體技術移轉風險、人員查核與內部威脅、終端用戶查證及供應鏈安全威脅之資訊\n(6) 建立關鍵半導體技術零組件與製造服務之可信供應商網絡\n(7) 嚴格檢討既有與擬議半導體技術出口管制在達成共同國安與外交目標上之成效，及其對美國與盟國半導體國家之經濟與技術影響\n(8) 建立其他協調做法，防止關鍵半導體技術經外人直接投資、研究人員與工程師人才外流及間諜活動而外流\n§4(d) 要求國務院於生效後 90 日內、其後每年一次為期三年，就外交推動現況、共同協調目標達成進度及多邊協調防止半導體技術移轉之成效向國會報告；報告採非密形式，得附機密附件。","law":"美國國會（法案）；執行為國務院","appl":"美國國務院對具半導體技術能力之國家政府","trig":"對象為在半導體技術研究、設計、製造、材料、設備或設備子系統與零組件方面維持顯著能力的國家。","impl":"國務院（§4(a)(b)(d) 協調與報告由國務卿主政）","note":"要求與盟國政府進行多邊協調。"},{"no":125,"tool":"國務院／國防部／能源部向 EARB 逕提出口管制規則之程序","dir":"制度設計","macro":"制度與程序設計","grp":"機關程序","prog":"T3 委員會通過——眾院 H.R. 8036 經眾議院外交委員會（House Foreign Affairs Committee）2026-04-22 以 25–19 表決通過修正案性質之替代案並決議報告（ordered reported in the nature of a substitute；基礎文本為 Baird 替代案）。無參院對應版本。","item":"出口管制跨機關協調法案（2026）","spec":"出口管制規則之跨機關提案與表決程序","act":"於 ECRA §1754 新增程序，使國務卿、國防部長或能源部長得向出口管理審查委員會（EARB）提出新訂或修正 EAR 之提案、委員會 30 日內表決、多數通過即啟動規則制定（rulemaking）","op":"§2 將 §1754(a) 的『諮詢（consultation）』改為『協調（coordination）』。\n新增 §1754(g)：\n(1) 國務院、國防部或能源部得向出口管理審查委員會（EARB）提出新訂或修正 EAR 的提案\n(2) EARB 須於 30 日內表決；簡單多數通過後，由商務部長啟動規則制定程序（rulemaking）\n(2)(B) 一名成員經提案機關同意，得延長 30 日補充資料\n(3) 落日：本 (g) 款之要求於該款生效後 3 年終止。","law":"美國國會（法案）；執行為國務院／國防部／能源部、EARB","appl":"國務卿、國防部長、能源部長；出口管理審查委員會（EARB）","trig":"國務院、國防部或能源部任一機關向 EARB 提出新訂或修正 EAR 的提案後，觸發 EARB 表決程序。","impl":"出口管理審查委員會（Export Administration Review Board, EARB）／商務部工業與安全局（Bureau of Industry and Security, BIS）","note":"§1754(g) 與 H.R. 8169、H.R. 8284 所增 §1754(g) 三案條號重複（立法競合，以先完成立法者為準）；本款另設三年落日，逾期要求終止"},{"no":127,"tool":"受告知函之正式程序化與透明化","dir":"制度設計","macro":"制度與程序設計","grp":"機關程序","prog":"T3 委員會通過——眾院 H.R. 8284 經眾議院外交委員會（House Foreign Affairs Committee）2026-04-22 以 43–1 表決通過修正並決議報告（ordered reported, amended）（通過之修正案為 McCaul 修正案 #43）。無參院對應版本。","item":"工業與安全局許可行政強化法案","spec":"受告知函（is-informed letter）之程序與效期參數（§1769(a)：同跨機關程序審理、許可核發後 60 日失效除非公開於 CFR／FR）；拒絕推定審查標準與審酌因素（§1769(b)：90 日內 FR 公開）","act":"使受告知函等個案性管制通知須循正式許可之跨機關程序、屆期失效除非公開，並強制公開許可審查官適用拒絕推定標準時之審酌因素，提升許可裁量之一致性與透明度","op":"§1769(a)(1) 受告知函／針對性法規指引／補充許可要求通知須與 EAR 正式許可同一跨機關程序處理\n§1769(a)(2) 相關許可核發後 60 日該通知失效；存續例外為主管機關（諮詢國務卿、國防部長、能源部長）於聯邦法規（CFR）公開其參數或於聯邦公報（FR）公開該通知\n§1769(b) 本節生效後 90 日內，主管機關於 FR 公開許可審查官適用拒絕推定標準應審酌之標準與因素；公開前 7 日送眾議院外交委員會與參議院銀行委員會","law":"美國國會（法案）；執行為商務部工業與安全局","appl":"商務部長（透過工業與安全副部長〔Under Secretary of Commerce for Industry and Security〕）；許可審查官","trig":"§1769(a)：發 件之出口推廣與優先指定","act":"商務部（透過國際貿易署）設立 AAEP，公開徵求產業主導之預組產業聯盟提交全棧 AI 出口套件提案，經跨部國家利益判定指定為優先 AI 出口套件、列入美國政府對外推廣清單，以推廣美國全棧 AI 技術出口","op":"國際貿易署受理提案後，由 National AI Center 收件，並於 14 個工作日內完成完整性審查（得要求補件）\n完整提案由商務部會同國務院、戰爭部、能源部與 OSTP 作成國家利益判定，考量合規、政策目標、國家安全與美國國家標準暨技術研究院（NIST）等資安標準\n經判定符合國家利益者，於 60 日內作成指定決定並列入優先 AI 出口套件；未獲選者得修正後重新提交，指定數量不設上限。","law":"美國總統（EO 14320，本於憲法第 2 條與 3 U.S.C. §301）；實作為商務部國際貿易署","appl":"商務部長（透過國際貿易署；諮詢國務卿、戰爭部長、能源部長、OSTP 主任）；申請之產業主導預組產業聯盟（須具美國主錨成員）","trig":"提案須涵蓋（EO §3(b)）：\n(i) 全棧 AI 技術套件，包括：\n(1) AI 最佳化硬體與基礎設施\n(2) 資料管線與標註\n(3) AI 模型與系統\n(4) 模型安全與資安\n(5) 特定領域應用\n(ii) 目標國家或區域\n(iii) 商業與營運模式\n(iv) 所需聯邦支援\n(v) 出口管制、對外投資及終端用戶合規\n資格門檻（ITA 公告 §II／§IV）：主錨成員須為美國組織，且不得為 2026 NDAA §8521／Public Law 119-60 所定的受關注國家實體；硬體層的美國含量推定須達 51% 以上，AI 模型須至少 51% 由美國人持有並控制；成員、分包商及在地夥伴均不得為受關注國家實體。提案於 2026-04-01 至 2026-06-30 滾動受理。","impl":"商務部國際貿易署（International Trade Administration, ITA）","note":"例外情形得指定外國企業為國家冠軍企業（National Champion Enterprise, NCE），僅限其母國市場之套件"},{"no":131,"tool":"為優先 AI 出口套件提供政府支援措施","dir":"促進","macro":"供給側／產業政策措施","grp":"出口促進","prog":"T5 已施行——EO 14320 於 2025-07-23 簽署、2025-07-28 聯邦公報公告，設立美國 AI 出口計畫（American AI Exports Program, AAEP）；商務部國際貿易署（International Trade Administration, ITA）於 2026-04-10 發布預組產業聯盟（pre-set consortia）徵案公告，徵案期間 2026-04-01 至 2026-06-30、滾動審查、指定決定 60 日內","item":"推廣美國 AI 技術棧出口行政命令","spec":"經指定列入美國政府推廣清單之優先 AI 出口套件及其連結交易（公告 §VIII 支援標的：G2G 倡議／個案出口管制溝通含 linked license 優先審查／聯邦融資轉介；EO §4(d) EXIM／DFC／USTDA 工具）","act":"經指定套件列入美國政府對外推廣清單，得（在符合美國利益時）獲四類支援：政府對政府倡議、計畫活動展示、優先個案交易出口管制溝通（含對相關許可申請之優先審查程序）、聯邦融資轉介與跨機關協調；惟指定不保證任何許可核准、融資、保險、技術協助或倡議結果","op":"套件獲指定後，政府依個案提供一項或多項支援；融資工具由經濟外交行動小組（依 EO §4、CABDA §708）與國務院協調、部署進出口銀行（12 U.S.C. 635）、國際開發金融公司（22 U.S.C. 9621）、貿易發展署（22 U.S.C. 2421(b)）等，國務卿主責統一出口推廣外交策略。（指定利益清單與「指定不保證」五項見公告 §VIII）","law":"美國總統（EO 14320）、商務部國際貿易署（公告 §VIII）；執行為國際貿易署／國務院／經濟外交行動小組與各融資機關","appl":"經指定之預組產業聯盟\n經濟外交行動小組（EDAG）成員機關\n國務卿（主責外交策略）\n商務部國際貿易署","trig":"支援以套件經指定為前提，且各項僅於「符合美國利益」時提供（公告 §VIII）；其中聯邦融資轉介與跨機關協調受各機關法定職權與核保標準限制","impl":"商務部國際貿易署（ITA）／國務院／經濟外 告並生效）","item":"H200／MI325X 對中／澳門出口個案審查（case-by-case）許可（先進運算品項審查政策修訂，2026-01）","spec":"申請對中／澳門 個案審查許可之 H200／MI325X 出貨","act":"出口商須就 §748 Supplement No.2 (dd)(1)(i)–(ix) 九項（出貨數量與效能規格／美國供給充足／50% cap／排除禁用途及 §744.8·§744.11 交易方／KYC／IaaS 遠端使用者／模型權重／實體安全／美國第三方測試）提出認證方得個案審查","op":"出口商須依 §748 Supplement No. 2 (dd)(1)(i)–(ix) 提出九項認證，方得適用個案審查。\n〔供給與比例〕\n(i) 提供供應美國市場之出貨數量與效能規格，包括 TPP、DRAM 總頻寬、互連頻寬（interconnect bandwidth）、共封裝 DRAM 容量（copackaged DRAM capacity）及峰值功耗\n(ii) 美國供給充足，且不排擠供美國使用的全球代工產能\n(iii) 對中國／澳門出貨的 aggregate TPP 不得超過供美國同類品項的 50%\n〔排除對象〕\n(iv) 排除軍事、軍事情報、核生飛彈化終端用途或終端用戶，以及 §744.8／§744.11 交易方；該等對象亦不得遠端存取\n〔盡職調查與遠端使用者〕\n(v) 自最終收貨人取得客戶盡職調查（Know Your Customer, KYC）程序描述\n(vi) 提交位於白俄羅斯、中國、古巴、伊朗、澳門、北韓、俄羅斯及委內瑞拉的 IaaS 遠端使用者（remote end users）清單\n〔模型權重與演算法〕\n(vii) IaaS 情形須確保不向未揭露終端用戶轉移模型權重（model weights），亦不向受禁對象提供演算法的遠端存取\n〔實體安全與第三方測試〕\n(viii) 描述最終收貨人的實體安全措施\n(ix) 出口前每批由合格美國第三方測試實驗室查驗\n出口商於許可申請時經 SNAP-R 提交九項認證；BIS 依認證與紀錄逐案核定，並得以適當方法查核認證準確性。","law":"美國商務部工業與安全局（BIS）（本於 ECRA／EAR §742.6／§748 Supp.2 (dd)）","appl":"申請 H200／MI325X 對中／澳門出口許可之出口人","trig":"對中／澳門個案審查許可申請；申請人須提出九項認證，包括安裝量 50% 上限、客戶盡職調查（KYC）、IaaS 遠端使用者與模型權重存取限制。","impl":"商務部工業與安全局（BIS）","note":"—"},{"no":87,"tool":"對特定外國司法管轄區／人士 IaaS 帳戶施加禁止或條件之授權","dir":"限制","macro":"交易許可管制","grp":"雲端·遠距存取管制","prog":"T5 已施行——2021-01-19 簽署、2021-01-25 聯邦公報公告；本於 EO 13694（2015）所宣告之重大惡意網路活動國家緊急狀態。EO 層級已施行（授權、指示商務部訂規則）；§1／§2 對 IaaS 業者之具體義務待商務部下游規則（IaaS CIP 擬議規則，RIN 0694-AJ35）實施","item":"就重大惡意網路活動國家緊急狀態採取額外措施行政命令","spec":"特定外國司法管轄區／人士之美國 IaaS 存取","act":"授權商務部以規則，於認定特定外國司法管轄區／人士以美國 IaaS 從事惡意網路活動時，要求美國 IaaS 業者對其帳戶（含轉售帳戶）施加禁止或條件，以限制該等外國行為者取用美國 IaaS；特別措施經下游規則（IaaS CIP 擬議規則）定之","op":"措施選擇須審酌對業者競爭、合法業務及國家安全的影響（§2(c)）。\n本令要求商務部於發布後 180 日內提出公告徵詢規則（§2(a)）。\n特別措施包括：\n(i) 禁止或限制特定外國司法管轄區開立或維持帳戶\n(ii) 禁止或限制特定外國人開立或維持帳戶（§2(d)）\n措施的施行不得早於 §1 最終規則發布後 180 日（§2(e)）。本令授權商務部制定規則，業者義務由下游的 IaaS 客戶身分驗證擬議規則具體化。","law":"美國總統（EO 13984）；執行為商務部","appl":"商務部長（會商國務卿／財政部長／國防部長／司法部長／國土安全部長／國家情報總監等）；美國 IaaS 業者","trig":"認定門檻：商務部認定 (i) 某外國司法管轄區（foreign jurisdiction）有眾多外國人以美國 IaaS 從事或直 ＋3σ〕）；電子束直寫設備（最小束徑 15 nm 以下、或疊對誤差小於 27 nm〔平均值＋3σ〕）\n(5) 光罩系（3B001.g–.j）——光罩與倍縮光罩（供 3A001 管制 IC）、相移多層光罩（供光源波長小於 245 nm 之微影）、壓印微影模板（供 3A001 管制 IC）、EUV 光罩基板（鉬矽多層反射結構、SEMI P37 標準）\n授權例外資格：小額（LVS）限額 500 美元；GBS 適用、但排除 a.3 分子束磊晶（氣態源）、e（連接 3B001.a.3 或 .f 受控設備者）與 .f 微影設備","law":"國會（EAA；現行依 ECRA 常設授權）\n總統（1996 年由 EO 12924、2001 年起由 EO 13222 依 IEEPA 延續）\nBXA（現 BIS）發布規則","appl":"3B001 物項之出口人、再出口人與境內移轉人","trig":"設備符合 3B001 各款技術參數（2022-09-30 版 .a–.j）；國家安全（NS）管制理由適用全條目（國家表 NS Column 2）、反恐（AT）適用全條目（AT Column 1）","impl":"BIS","note":"相關管制：3B991 收 3B001 未涵蓋之電子零組件與材料製造設備（AT 級）；3B002 為測試設備條目、3B992 承接其未涵蓋之檢測設備"},{"no":144,"tool":"通用積體電路清單管制","dir":"限制","macro":"物項清單化／分類","grp":"物項分類·清單化","prog":"T5 現行有效——1996-03-25 EAR 重編暫行規則將 3A001 納入現行 CCL 架構（1996-04-24 生效）。","item":"通用積體電路物項管制","spec":"ECCN 3A001.a 所列通用積體電路（輻射硬化、寬溫域、化合物半導體處理器與數位積體電路、類比數位／數位類比轉換器、電光／光學積體電路、現場可程式邏輯元件、類神經網路積體電路、功能未知或製造者不明其所用設備管制狀態之客製積體電路、快速傅立葉轉換處理器、直接數位合成器等）","act":"以 ECCN 3A001.a 界定依國家安全與反恐理由管制、特定物項另受飛彈技術管制之通用積體電路類別與技術門檻，作為 2022-10 前積體電路出口管制之基線判準","op":"許可要求：\n(1) 3A001 全條目依國家安全（NS）理由管制，輸往國家表（Commerce Country Chart）NS Column 2 所列目的地須經許可\n(2) 全條目另依反恐（AT）理由管制，輸往 AT Column 1 所列目的地須經許可\n(3) 可用於「飛彈」之輻射硬化積體電路（.a.1.a）與專為軍用設計或修改、氣密封裝且額定操作溫度自低於 −54 °C 至高於 +125 °C 之類比數位轉換器（.a.5.a）另依飛彈技術（MT）理由管制，輸往 MT Column 1 所列目的地須經許可\n(4) 處理速度 5 GFLOPS（每秒十億次浮點運算）以上且算術邏輯單元存取寬度 32 位元以上之微處理器（含具資訊安全功能者）及其生產／開發軟體與技術，另依 EAR §744.17 受軍事終端用途與軍事終端用戶相關許可要求規範\n受控類別（2022-09-30 版；.a.4 與 .a.8 為保留款）：\n(1) 輻射硬化積體電路（.a.1）——耐受總劑量 5×10³ Gy（矽）以上、劑量率擾動（dose rate upset）5×10⁶ Gy（矽）/s 以上、或中子注量（1 MeV 等效）5×10¹³ n/cm² 以上（矽基準，其他材料依等效值；中子注量款不適用於金屬絕緣體半導體）\n(2) 寬溫域積體電路（.a.2）——微處理器、微電腦、微控制器、化合物半導體儲存積體電路、類比數位轉換器、含類比數位轉換並儲存或處理數位化資料之積體電路、數位類比轉換器、訊號處理用電光／光學積體電路、現場可程式邏輯元件、功能未知或製造者不明其所用設備管制狀態之客製積體電路、快速傅立葉轉換（Fast Fourier Transform, FFT）處理器、靜態隨機存取記憶體（SRAM）與非揮發性記憶體，額定於高於 +125 °C、低於 −55 °C，或涵蓋 −55 °C 至 +125 °C 全溫域操作（專為民用汽車或鐵路列車應用設計者除外）\n(3) 化合物半導體處理器（.a.3）——由化合物半導體製造、時脈超過 40 MHz 之微處理器、微電腦與微控制器（含數位訊號處理器）\n(4) 資料轉換積體電路（.a.5、.a.14）——類比數位轉換器（ADC）依解析度分五級課取樣率門檻（8 位元級大於 1.3 GSPS〔Giga Samples 序（會同商務、國防、能源、國務等部）；資訊來源包括公開資訊、機密資訊（含國家情報總監提供）、美國外人投資委員會（Committee on Foreign Investment in the United States, CFIUS）審查與調查資訊、新興技術與研究諮詢委員會（Emerging Technology and Research Advisory Committee）等諮詢委員會意見；並考量該技術於外國之發展、管制對美國國內發展之影響及管制有效性；含公告評論期\n商務部管制（§4817(b)(1)–(2)）：對識別之技術依 EAR 建立適當管制，含暫行管制（如個別告知須許可）或增訂法規；管制層級參酌出口受限國家清單與潛在終端用途／終端用戶\n最低要求（§4817(b)(2)(C)）：對受美國禁運（含武器禁運）國家之輸出、再輸出或境內移轉至少須許可\n許可審查（§4817(b)(3)）：依 EO 12981 程序審查；商務部長應考量國家情報總監提供之國安威脅資訊；合資、共同開發或類似協作安排之申請，得要求揭露參與之外國人及其重要股權人\n法定排除與例外（§4817(b)(4)）：IEEPA §1702(b) 所述事項及其他法律禁止管制者不得依本條管制（(A)）；商務部長得以法規訂管制例外（(B)）；對下列五類交易，商務部長依本款不負必須課予許可要求之義務（(C)）：\n・一般性提供客戶之成品及附隨技術之銷售或授權\n・一般性提供之整合或類似服務\n・設備移轉及其操作技術（以不致使外國人用於生產關鍵技術為限）\n・美國人自外國人採購貨品或服務（該外國人無權利用美國人技術於供應範圍之外）\n・對標準組織之貢獻與相關智財授權\n多邊化義務（§4817(c)）：國務卿會同商務、國防等部，應向相關多邊出口管制建制提案納管經識別之技術；提案後 3 年內該建制未納管者，主管機關首長得判斷是否基於國安考量維持單邊管制","law":"國會（Pub. L. 115–232）\n商務部受權建立管制","appl":"總統與商務、國防、能源、國務等部（識別與建管制義務主體）\n受識別技術之出口人、再出口人與境內移轉人","trig":"技術經跨部會程序識別為對美國國家安全必要之新興或基礎技術，且非 50 U.S.C. §4565(a)(6)(A)(i)–(v) 所述關鍵技術","impl":"商務部（透過 BIS 施行 EAR）","note":"—"}],"技術／IP／know-how|||交易許可管制":[{"no":142,"tool":"電腦分級授權例外（License Exception APP）","dir":"監測","macro":"交易許可管制","grp":"條件式授權·授權例外","prog":"T5 現行有效——2006-04-24 規則創設 APP 參數並更名授權例外。","item":"數位電腦效能門檻管制（APP）","spec":"ECCN 4A003.b／.c 電腦與電子組件\nECCN 4D001 軟體與 4E001 技術（視同出口〔deemed export〕門檻僅適用於技術與原始碼）","act":"依電腦分級國別（Computer Tier）授權 4A003 電腦與關聯技術軟體之出口免個別許可，附再出口授權要求、釋出禁止與報告義務","op":"Tier 1（143 個目的地）：全部電腦與組件均可依本例外出口；技術、軟體與原始碼——對 A:5 國家組無 APP 上限；對其他 Tier 1 國民之視同出口，開發／生產技術與原始碼限 APP 不超過 40 WT、使用技術與原始碼限不超過 200 WT\nTier 3（中國、俄羅斯等 50 個目的地）：商品無適用資格（None）；對其國民之視同出口，開發／生產技術與原始碼限 APP 不超過 16 WT、使用技術與原始碼限不超過 32 WT\n限制（EAR §740.7(b)）：\n・4A003.g 設備不得單獨憑本例外出口\n・技術與原始碼不得釋出予古巴、伊朗、北韓、敘利亞國民\n・經本例外出口之電腦與軟體，再出口或境內移轉須先有 BIS 授權——許可、許可性再出口、其他授權例外或無需許可（NLR）——並以目的地管制聲明（Destination Control Statement）傳達受讓人；對 Computer Tier 3 受讓人並須傳達核化生飛彈終端用途限制\n・不得用於明知將使 APP 增強超出目的地適用上限之出口\n・核、化學、生物與飛彈終端用途（EAR §§744.2–744.5）不得援用\n・簽證逾期之外國人不得受視同出口\n報告義務：依 EAR §743.1 就特定出口提交報告","law":"BIS（本於 EAR §740.7）","app
