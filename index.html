設備|||N3":[{"no":116,"tool":"對未合作協調國之出口顧問審查委員會建議與升級行動機制","dir":"限制"}],"半導體製造設備|||N6":[{"no":116,"tool":"對未合作協調國之出口顧問審查委員會建議與升級行動機制","dir":"限制"}],"軟體與設計工具|||N3":[{"no":116,"tool":"對未合作協調國之出口顧問審查委員會建議與升級行動機制","dir":"限制"}],"軟體與設計工具|||N6":[{"no":116,"tool":"對未合作協調國之出口顧問審查委員會建議與升級行動機制","dir":"限制"}]},"pol":[{"code":"A-1a","disp":"EW-01","item":"安全、可靠及可信賴之人工智慧開發與使用行政命令","id":"EO 14110（88 FR 75191；Federal Register 文件編號 2023-24283）","year":"2023","date":"2023-11-01","prog":"T1 已撤銷——2023-10-30 簽署、2023-11-01 FR 公告；2025-01-20 經 EO 14148 Sec. 2 撤銷清單第 (ggg) 項明列撤銷；EO 14179（2025-01-23）就已撤銷之本令所採下游行政行動作清理並另立新政策方向","who":"美國總統（Joseph R. Biden Jr.）","law":"美國憲法第 2 條（Article II）賦予總統之行政權及美國法律，以行政命令形式發布。雙重用途模型／算力叢集通報（§4.2(a)）援引《國防生產法》（Defense Production Act；50 U.S.C. 4501 et seq.）；IaaS 通報與客戶身分查核（§4.2(c)(d)）則本於 EO 13694（2015，惡意網路活動國家緊急狀態，經 EO 13757／13984 修正）並依《國際緊急經濟權力法》（IEEPA；50 U.S.C. 1701 et seq.，§4.2(e)）授權。","bg":"本令係拜登政府就 AI 之安全、保安與可信賴開發使用所發布之綜合性治理行政命令，承續白宮 2023 年先前與多家主要 AI 開發商達成之自願性安全承諾。本令所處理的關切包括：最具能力之 frontier 基礎模型及其賴以訓練之大規模算力兼具重大效益與國家安全風險，須使聯邦政府得掌握其開發與跨境取得之資訊。","body":"本令就先進 AI 開發與跨境雲端取得建立三項聯邦資訊通報與查核義務：\n(1) 依《國防生產法》要求雙重用途基礎模型開發者與大型算力叢集營運者，向商務部通報訓練活動、模型權重保護措施與安全測試結果\n(2) 依既有惡意網路活動國家緊急狀態（IEEPA），指示商務部就外國人經美國基礎設施即服務（IaaS）訓練具潛在惡意網路能力之大型 AI 模型提出通報規則\n(3) 指示商務部就境外經銷商查核外國客戶身分及留存交易紀錄提出規則\n模型與算力叢集之適用範圍，在商務部訂定技術條件前依過渡門檻認定。本令所建框架其後由 EO 14148 撤銷；EO 14179 並要求檢討其下游行政行動。","track":"EW"},{"code":"A-1b","disp":"EW-02","item":"撤銷有害行政命令與行動之初始撤銷令","id":"EO 14148（90 FR 8237；Federal Register 文件編號 2025-01901）","year":"2025","date":"2025-01-28","prog":"T5 已施行——2025-01-20 簽署、2025-01-28 發布；Sec. 2 撤銷 EO 14110，Sec. 3(b) 要求 DPC／NEC 檢視並處理相關下位行動","who":"美國總統（Donald J. Trump）","law":"美國憲法第 2 條（Article II）賦予總統之行政權及美國法律；以行政命令形式發布（EO 14148 序言：「By the authority vested in me as President by the Constitution and the laws of the United States of America, it is hereby ordered as follows」）。","bg":"川普政府就任首日（2025-01-20）發布之整批撤銷令，撤銷前任拜登政府多項行政命令與行動，其中包括 EO 14110（拜登 AI 安全行政命令）及該令所建立之 AI 治理與通報框架。三日後（2025-01-23）之 EO 14179 另立新 AI 政策框架。","body":"本令以行政命令撤銷前任政府多項行政命令與行動（Sec. 2 清單）；就海外算力相關者，清單第 (ggg) 項為 EO 14110（2023-10-30 拜登 AI 安全行政命令），其撤銷移除 EO 14110 所建立之 AI 治理與通報框架。被撤命令之下位聯邦行動不自動消滅，依 Sec. 3(b) 由國內政策委員會（DPC）與國家經濟委員會（NEC）檢視、撤銷／替換／修正。","track":"EW"},{"code":"A-1c","disp":"EW-03","item":"移除美國人工智慧領導障礙行政命令","id":"EO 14179（90 FR 8741；Federal Register 文件編號 2025-02172）","year":"2025","date":"2025-01-31","prog":"T5 已施行——2025-01-23 簽署、2025-01-31 FR 公告；§4 AI 行動計畫（180 日）已產出 America's AI Action Plan（2025-07-23），§5(b) OMB 備忘錄修訂（60 日）期限屆至","who":"美國總統（Donald J. Trump）","law":"美國憲法第 2 條（Article II）賦予總統之行政權及美國法律，以行政命令形式發布。","bg":"川普第二任期就 AI 政策方向之重設。本令 §2 揭示之國策為「維持並強化美國全球 AI 主導地位」（sustain and enhance America's global AI dominance），並以「移除阻礙美國 AI 創新之既有政策與指令」為由（§1）。","body":"本令為川普政府 AI 政策方向重設之行政命令：§2 揭示維持並強化美國全球 AI 主導地位為國策；§4 指示總統科技顧問（APST）、AI 與加密特別顧問及國安顧問（APNSA）於 180 日內研擬並向總統提交 AI 行動計畫；§5 就 EO 14110（已由 EO 14148 撤銷）之撤銷實施下游清理——即刻檢視並暫停／修訂／撤銷依該令所採之行政行動，並於 60 日內修訂相關 OMB 治理備忘錄。本令未創設具體算力管制權限。","track":"EW"},{"code":"A-1d","disp":"EW-04","item":"美國 AI 行動計畫——贏得競賽","id":"無正式編號（白宮政策文件，2025-07-23 發布）","year":"2025","date":"2025-07-23","prog":"T5 已發布——2025-07-23 公布之白宮政策藍圖；本身無法律拘束力，靠同日配套 EO（14318 資料中心許可／14319 聯邦採購／14320 AI 出口促進）與後續工業與安全局（Bureau of Industry and Security, BIS）規則、立法落實","who":"白宮（科技政策辦公室 OSTP 主導；主任 Michael Kratsios）","law":"白宮政策文件，無法律拘束力；承 EO 14179 §4 之 AI 行動計畫指示而作，須各機關既有授權與配套 EO 落實。","bg":"本計畫係依 EO 14179 §4 之 180 日指示而生。其引言揭示之國策為「贏得 AI 全球主導競賽」——掌握最大 AI 生態系者將設定全球標準並獲經濟與軍事利益。就海外算力管制，其關切集中於確保盟友建立於美國技術之上、並阻斷對手取得先進 AI 算力。","body":"本計畫為川普政府 AI 國策藍圖（承 EO 14179），分創新、基礎設施、國際外交與安全三大支柱、逾 90 項建議。就海外算力管制相關者集中於第三支柱與第二支柱：\n・推動以全棧美國 AI 技術（硬體／模型／軟體／應用／標準）對盟友輸出\n・強化 AI 算力出口管制執行（探索晶片位置驗證、流向與終端用途監測）\n・對半導體製造設備子系統新增出口管制\n・以外國直接產品規則、次級關稅與複邊機制促盟國管制對齊\n・加速國內資料中心、晶圓廠與能源基礎設施建置以擴大本土算力供給\n本計畫為政策藍圖、無法律拘束力，須配套 EO（14318／14320）與後續 BIS 規則或立法落實。","track":"EW"},{"code":"A-2","disp":"EW-05","item":"調整半導體、半導體製造設備及其衍生產品進口之公告","id":"Proclamation 11002（91 FR 2443；Federal Register 文件編號 2026-01052）","year":"2026","date":"2026-01-20","prog":"T5 已施行——2026-01-14 簽署、2026-01-15 12:01 EST 生效（就消費入境或出倉之 Covered Products）、2026-01-20 FR 公告","who":"美國總統（Donald J. Trump）","law":"《1962 年貿易擴張法》§232（Trade Expansion Act of 1962, §232；19 U.S.C. §1862）之國家安全進口調整授權，以總統公告發布。","bg":"§232 國安調查之認定——美國目前僅自製其所需晶片之約 10%、高度依賴外國供應鏈，構成重大經濟與國家安全風險。本公告係該調查後對半導體進口採取之「第一階段」國安關稅措施。","body":"本公告依《貿易擴張法》§232 國安授權，對「Covered Products」（屬政府 AI 與技術政策關鍵之窄類半導體、半導體製造設備及其衍生產品）課 25% 從價進口關稅，2026-01-15 生效；惟對供美國境內資料中心、維修／替換、研發、新創、非資料中心消費應用、非資料中心民用工業應用、公部門應用，及商務部認定有助強化美國技術供應鏈或半導體衍生品國內製造產能之其他用途，設廣泛排除。公告並指示商務部與貿易代表續行 §232 談判、90 日內回報，並視結果考慮更高關稅與配套之國內製造關稅抵減方案；另由商務部會同國際貿易委員會（ITC）與海關（CBP）評估並於必要時發布 HTSUS 修改、終端用途認證或其他行政措施。對 Covered Products，本公告關稅優先於其他 §232 公告及 EO 14257（對等關稅）。","track":"EW"},{"code":"A-3","disp":"EW-06","item":"處理美國對受關注國家特定國安技術與產品投資之行政命令（對外投資安全計畫）","id":"EO 14105（88 FR 54867）、 財政部最終規則（89 FR 90398；31 CFR Part 850）","year":"2023","date":"2023-08-11","prog":"T5 已施行——EO 14105 2023-08-09 簽署、2023-08-11 FR 公告；財政部 OISP 最終規則 2024-11-15 公告、2025-01-02 生效（31 CFR Part 850）","who":"美國總統（Joseph R. Biden Jr.，EO 14105）；實施規則為財政部（投資安全辦公室／全球交易辦公室）","law":"《國際緊急經濟權力法》（IEEPA；50 U.S.C. §1701 et seq.）、《國家緊急狀態法》（NEA）；EO 14105 宣告國家緊急狀態，將 IEEPA 緊急經濟權延伸適用於「對外投資」（歷來多用於制裁／inbound 審查）；由財政部以 31 CFR Part 850 實施。","bg":"EO 14105 所宣告之國家緊急狀態——受關注國家透過取得美國人之資本、專業知識與管理協助，推進對國安關鍵之敏感技術，威脅美國國家安全。本令補出口管制（管物項）所不及之資本與無形協助流向。","body":"本行政命令宣告國家緊急狀態，並指示財政部對美國人涉及受關注外國人（covered foreign person）之特定交易採兩類措施：\n(1) 對可能助長國家安全威脅之交易類別課申報義務\n(2) 對可顯著提升受關注國家軍事、情報、監控或網路能力，因而構成尤其急迫威脅之交易類別予以禁止\n受涵蓋技術包括半導體與微電子、量子資訊技術及人工智慧；受關注國家為中國（含香港、澳門）。具體交易範圍、明知（knowledge）與明知主導（knowingly directing）標準，由財政部對外投資安全計畫（OISP）規則（31 CFR Part 850）界定，並於 2025-01-02 生效。","track":"EW"},{"code":"C-2","disp":"EW-07","item":"就重大惡意網路活動國家緊急狀態採取額外措施行政命令","id":"EO 13984（86 FR 6837；Federal Register 文件編號 2021-01714）","year":"2021","date":"2021-01-25","prog":"T5 已施行——2021-01-19 簽署、2021-01-25 聯邦公報公告；本於 EO 13694（2015）所宣告之重大惡意網路活動國家緊急狀態。EO 層級已施行（授權、指示商務部訂規則）；§1／§2 對 IaaS 業者之具體義務待商務部下游規則（IaaS CIP 擬議規則，RIN 0694-AJ35）實施","who":"美國總統 Donald J. Trump","law":"國際緊急經濟權力法（International Emergency Economic Powers Act, IEEPA；50 U.S.C. 1701 et seq.）、國家緊急狀態法（National Emergencies Act, NEA；50 U.S.C. 1601 et seq.）與《美國法典》第 3 編第 301 條之總統職權；延續 EO 13694（2015，網路國家緊急狀態）。","bg":"外國惡意網路行為者利用美國基礎設施即服務（Infrastructure as a Service, IaaS）產品（租用伺服器以運算／儲存而不負維運成本）從事惡意網路活動（malicious cyber-enabled activities）、竊取智財與敏感資料、威脅關鍵基礎設施，且常透過外國轉售商規避偵測。本令據此強化美國 IaaS 之外國使用者身分驗證、並授權對特定外國司法管轄區／人士之 IaaS 存取施加特別措施。","body":"身分驗證：本令課商務部（Department of Commerce）於 180 日內就「美國 IaaS 業者須驗證取得帳戶（Account）之外國人身分」提出公告徵詢規則，至少訂定身分驗證最低標準（證件與程序、應安全留存之身分／付款／電郵／IP 紀錄、限制第三方取用），並得對特定業者／帳戶／承租人豁免（§1）。\n特別措施：授權商務部於認定特定外國司法管轄區有眾多外國人以美國 IaaS 從事惡意網路活動、或特定外國人形成此類行為模式時，要求美國 IaaS 業者對該等司法管轄區／人士之帳戶（含轉售帳戶 Reseller Account）施加禁止或條件（§2；特別措施 special measures 不得早於 §1 最終規則後 180 日施行）。\n資訊分享：司法部長（Attorney General）與國土安全部長（Secretary of Homeland Security）（協同商務部）就 IaaS 業者間及與政府之自願資訊分享與協作提出建議報告予總統（§3）。","track":"EW"},{"code":"G-1a","disp":"EW-08","item":"推廣美國 AI 技術棧出口行政命令","id":"EO 14320（90 FR 35393；Federal Register 文件編號 2025-14218）；實作徵案公告：91 FR 18412（International Trade Administration，Docket 260401-0092，Federal Register 文件編號 2026-06952）","year":"2025","date":"2025-07-28","prog":"T5 已施行——EO 14320 於 2025-07-23 簽署、2025-07-28 聯邦公報公告，設立美國 AI 出口計畫（American AI Exports Program, AAEP）；商務部國際貿易署（International Trade Administration, ITA）於 2026-04-10 發布預組產業聯盟（pre-set consortia）徵案公告，徵案期間 2026-04-01 至 2026-06-30、滾動審查、指定決定 60 日內","who":"美國總統 Donald J. Trump（EO 14320）；徵案公告由商務部國際貿易副部長 William Kimmitt 署名","law":"美國憲法第 2 條與《美國法典》第 3 編第 301 條（3 U.S.C. §301）之總統職權（EO 14320）；商務部國際貿易署依 EO 設立美國 AI 出口計畫並以聯邦公報公告（91 FR 18412）徵案實施；聯邦融資工具援引《2019 年透過外交強化美國商業法》（Championing American Business Through Diplomacy Act of 2019, CABDA；Public Law 116-94）§708、進出口銀行（Export-Import Bank；12 U.S.C. 635）、國際開發金融公司（U.S. International Development Finance Corporation, DFC；22 U.S.C. 9621）、貿易發展署（U.S. Trade and Development Agency, USTDA；22 U.S.C. 2421(b)）。","bg":"本令認人工智慧（artificial intelligence, AI）為界定未來經濟成長、國安與全球競爭力之基礎技術；美國除須在通用與前沿 AI 領先外，亦須使美國 AI 技術、標準與治理模式為全球採用，以鞏固盟邦關係、降低各國對對手 AI 技術之依賴。為此以協調之國家力量推廣『全棧 AI 技術套件』（full-stack AI technology package）出口；並由商務部國際貿易署具體徵求產業聯盟之套件、納入美國政府對外推廣清單。","body":"本行政命令設立美國 AI 出口計畫（AAEP），由商務部（透過國際貿易署 ITA）推廣美國全棧 AI 技術套件（硬體／資料／模型／安全／應用五層）之出口；ITA 於 2026-04-10 公告徵求預組產業聯盟之套件提案。資格門檻含主錨成員須為美國且非受關注國家實體、硬體 51% 美國含量、AI 模型 51% 美國持有。商務部會同國務院、戰爭部、能源部、OSTP 以國家利益判定指定「優先 AI 出口套件」，獲指定者得享政府對政府倡議、出口管制／許可優先審查、融資轉介與跨機關協調等指定後支援。","track":"EW"},{"code":"B-1","disp":"EB-01","item":"中國超級運算實體之實體清單列名（2019、2021）","id":"84 FR 29371（2019 規則「Addition of Entities to the Entity List and Revision of an Entry on the Entity List」；Federal Register 文件編號 2019-13245）；86 FR 18437（2021 規則「Addition of Entities to the Entity List」；文件編號 2021-07400；Docket No. 210406-0076）","year":"2019","date":"2019-06-24","prog":"T5 已施行——2019-06-24 生效並公告，列入 5 家中國超級運算相關實體（FR Doc 2019-13245；另修訂既有 1 筆中國項下條目）；2021-04-08 生效／2021-04-09 公告，列入 7 家（FR Doc 2021-07400）。兩次均為終局規則（final rule）。","who":"美國商務部工業與安全局（Bureau of Industry and Security, BIS）；列名決定由跨部會終端用戶審查委員會（End-User Review Committee, ERC）作成","law":"授權母法：2018 年出口管制改革法（Export Control Reform Act of 2018, ECRA；50 U.S.C. §4801–4852）。實施框架：出口管理條例（Export Administration Regulations, EAR；15 CFR Parts 730–774）。列名權源：EAR §744.11(b)（ERC 列名標準——合理依據相信涉及違反美國國安／外交利益之活動）；許可要求依 §744.11 及實體清單（Supplement No. 4 to Part 744）。","bg":"曙光（Sugon）、無錫江南計算技術研究所與國防科技大學（National University of Defense Technology, NUDT；已於 2015 列名、非本條目所涉列名）均涉及中國百萬兆級（exascale）高效能運算之發展；Sugon 公開承認其高效能電腦之多種軍事終端用途與用戶。列名理由包括：該等實體涉及或具重大風險涉及違反美國國安／外交利益之活動（2019），或為支援中國軍事行為者、破壞穩定之軍事現代化及／或大規模毀滅性武器（weapons of mass destruction, WMD）計畫而採購美國原產物項（2021）；相關實體因此依 EAR §744.11(b) 列入實體清單。","body":"BIS 依終端用戶審查委員會（ERC）決定，於 2019-06 與 2021-04 分兩次將中國超級運算相關實體（合計 12 家，含曙光 Sugon、海光 Higon、申威 Sunway、四座國家超級計算中心等）列入實體清單，理由為涉百萬兆級高效能運算與中國軍事終端用途／用戶、軍事現代化或 WMD 計畫（§744.11(b)）。對該等實體之全品項受 EAR 物項課許可、審查採拒絕推定。","track":"EB"},{"code":"B-2","disp":"EB-02","item":"對華為適用外國直接產品規則及子公司實體清單擴張（2020）","id":"85 FR 29849（2020-05 規則「Export Administration Regulations: Amendments to General Prohibition Three (Foreign-Produced Direct Product Rule) and the Entity List」；RIN 0694-AH99；Federal Register 文件編號 2020-10856）；85 FR 51596（2020-08 規則「Addition of Huawei Non-U.S. Affiliates to the Entity List, the Removal of Temporary General License, and Amendments to General Prohibition Three」；同 RIN 0694-AH99；文件編號 2020-18213）","year":"2020","date":"2020-05-15","prog":"T5 已施行——2020-05-15 生效／05-19 公告（FR Doc 2020-10856：設 footnote 1 外國直接產品規則並適用於華為）；2020-08-17 生效／08-20 公告（FR Doc 2020-18213：增列華為非美子公司、取消臨時通用許可、擴張外國直接產品規則至華為作為任一交易方）。兩次均為終局規則（final rule）。","who":"美國商務部工業與安全局（Bureau of Industry and Security, BIS）","law":"授權母法：2018 年出口管制改革法（Export Control Reform Act of 2018, ECRA；50 U.S.C. §4801–4852）。實施框架：出口管理條例（Export Administration Regulations, EAR；15 CFR Parts 730–774）。","bg":"華為（Huawei）旗下海思（HiSilicon）設計之先進晶片多由境外晶圓代工廠（foundry，如使用美國原產設備之外國代工廠）生產，華為亦自第三方採購外國製晶片；2019 年將華為列入實體清單並輔以臨時通用許可（Temporary General License, TGL）後，仍無法阻斷此類經境外生產／第三方採購之取得路徑。本規則以華為及其非美子公司對美國國安與外交利益構成持續威脅為管制理由，故以外國直接產品規則將「以美國技術／設備於境外生產、且供應華為」之物項納入 EAR 管轄，以封閉規避管制的缺口。","body":"BIS 於 2020 年分兩次強化對華為的管制，主要措施如下：\n(1) 2020-05：修訂一般禁令第三條（外國直接產品規則，FDPR），對實體清單所列華為及其非美國子公司加註腳註 1，使其在外國生產、且屬特定美國原產技術或軟體直接產品的物項受 EAR 管轄並須取得許可\n(2) 2020-08：增列華為子公司、終止臨時通用許可但保留網路安全研究授權，並將 FDPR 擴張至華為以採購方、中間收貨人、最終收貨人或終端用戶等任一身分參與交易的物項\n許可審查：受涵蓋物項輸往華為原則上採拒絕推定；供低於 5G 的電信用途者採個案審查。","track":"EB"},{"code":"B-3","disp":"EB-03","item":"軍事終端用戶與軍事情報終端用戶管制（MEU／MIEU）","id":"85 FR 23459（2020-04 MEU 規則「Expansion of Export, Reexport, and Transfer (in-Country) Controls for Military End Use or Military End Users in the PRC, Russia, or Venezuela」；RIN 0694-AH53；文件編號 2020-07241）；85 FR 83793（2020-12 MEU List 規則；RIN 0694-AI34；文件編號 2020-28052）；86 FR 4865（2021-01 MIEU 暫行最終規則；RIN 0694-AI38；文件編號 2021-00977）","year":"2020","date":"2020-06-29","prog":"T5 已施行——2020-04-28 公告／2020-06-29 生效（FR Doc 2020-07241：§744.21 軍事終端用途／用戶管制擴張至中國／俄／委內瑞拉、擴大軍事終端用途定義、擴增受管制物項清單）；2020-12-23 生效（FR Doc 2020-28052：設軍事終端用戶清單 MEU List、首批 102 家〔中國 57／俄 45〕）；2021-01-15 公告／2021-03-16 生效（FR Doc 2021-00977 暫行最終規則：新增 §744.22 軍事情報終端用途／用戶管制）。三者皆已施行（MIEU 為暫行最終規則 IFR）。","who":"美國商務部工業與安全局（Bureau of Industry and Security, BIS）；終端用戶清單列名由跨部會終端用戶審查委員會（End-User Review Committee, ERC）決定","law":"授權母法：2018 年出口管制改革法（Export Control Reform Act of 2018, ECRA；50 U.S.C. §4801–4852；MIEU 特引 §1753(a)(2)(F)／50 U.S.C. 4812(a)(2)(F)）。實施框架：出口管理條例（Export Administration Regulations, EAR；15 CFR Parts 730–774）。","bg":"2017 年《美國國家安全戰略》（National Security Strategy, NSS）將中國與俄羅斯定位為挑戰美國權力與利益、擴張軍備之競爭者。本規則旨在防止美國原產物項經由軍事或軍事情報終端用途／終端用戶遭轉移、用於中國／俄羅斯等國之軍事現代化，故依 ECRA 強化既有軍事終端用途管制、增列具名軍事終端用戶清單、並新設軍事情報終端用戶管制。","body":"BIS 依《出口管制改革法》（ECRA）於 2020–2021 年分三步強化軍事相關終端管制：\n(1) 2020-06 擴張 §744.21 軍事終端用途／終端用戶（MEU）管制，將中國納入終端用戶管制、擴大軍事終端用途定義並增列受管制物項\n(2) 2020-12 設立軍事終端用戶清單（MEU List），首批列入 102 家中國與俄羅斯實體\n(3) 2021-03 新增 §744.22 軍事情報終端用途／終端用戶（MIEU）管制，涵蓋中國、俄羅斯、委內瑞拉與國家群組 E:1／E:2，適用於所有受 EAR 管轄物項及特定美國人活動\n三項管制的許可審查原則均採拒絕推定。","track":"EB"},{"code":"B-4a","disp":"EB-04a","item":"先進運算與半導體製造物項追加出口管制暫行最終規則","id":"87 FR 62186（Federal Register Vol. 87, No. 197；文件編號 2022-21658；RIN 0694-AI94；Docket No. 220930-0204）","year":"2022","date":"2022-10-13","prog":"T5 已施行——2022-10 分階段生效：\n・2022-10-07：EAR §742.6、§744.23、ECCN 3B090 等\n・2022-10-12：§744.6（美國人限制）\n・2022-10-21：§734.9 FDP、§772.1、Entity List footnote 4、ECCN 3A090/4A090/4D090 等\n・評論期至 2022-12-12","who":"美國商務部工業與安全局（Bureau of Industry and Security, BIS）","law":"授權母法：2018 年出口管制改革法（Export Control Reform Act of 2018, ECRA；50 U.S.C. §4801–4852）。實施框架：出口管理條例（Export Administration Regulations, EAR；15 CFR Parts 730–774）——即 ECRA 之既有實施規則體系；工業與安全局（Bureau of Industry and Security, BIS）依 ECRA 授權於 EAR 框架內發布本暫行最終規則。","bg":"此前美國對中國先進運算與半導體之管制以 Entity List 個案列名為主（部分實體因涉百萬兆級高速運算及軍事終端用途／用戶而列名）。本規則將管制由個案實體擴展為對中國全國範圍之先進運算晶片與半導體製造系統性管制，以新設 ECCN、目的地許可、終端用途管制、美國人活動限制、外國直接產品規則（Foreign Direct Product Rule, FDPR）多軌並行。本規則旨在保護美國國安與外交利益、限制中國取得用於軍事現代化（含核武及大規模毀滅性武器 WMD 發展）之先進運算，並防止中國於境內自主量產此類先進 IC。","body":"本暫行最終規則新增並修訂六類管制措施：\n(1) 新增 ECCN 3A090、4A090、3B090、4D090 等分類；後續目的地許可、終端用途與外國直接產品規則均引用相關分類\n(2) 對輸往中國的先進運算物項課許可要求，許可審查原則採拒絕推定（presumption of denial）\n(3) 對輸往中國的特定半導體製造設備課許可要求\n(4) 依 §744.6 限制美國人支援中國先進節點晶圓廠之特定活動\n(5) 依 §744.23 管制超級運算與半導體製造終端用途\n(6) 擴張 §734.9 外國直接產品規則（FDPR），並對 28 家實體清單腳註 4 實體適用較廣的產品與終端用戶範圍\n另設臨時通用許可（Temporary General License, TGL）作為過渡安排。","track":"EB"},{"code":"B-4b","disp":"EB-04b","item":"先進運算物項追加出口管制更新暫行最終規則（2023-10）","id":"88 FR 73458（Federal Register Vol. 88, No. 205；RIN 0694-AI94；文件編號 2023-23055）","year":"2023","date":"2023-10-25","prog":"T5 已施行——2023-10-25 公告、2023-11-17 生效（暫行最終規則 interim final rule, IFR；評論期至 2023-12-18）；其中修訂 EAR 第 736 部 Supplement No. 1 之 amendatory instruction 11 有效期間 2023-11-17 至 2026-01-01。本規則為 2022-10-07 IFR（87 FR 62186）之先進運算部分更新（半導體製造設備部分另由同日 SME 規則〔88 FR 73424〕處理）。","who":"美國商務部工業與安全局（Bureau of Industry and Security, BIS）","law":"授權母法：2018 年出口管制改革法（Export Control Reform Act of 2018, ECRA；50 U.S.C. §4801–4852）。實施框架：出口管理條例（Export Administration Regulations, EAR；15 CFR Parts 730–774）。","bg":"本規則回應 2022-10-07 IFR（87 FR 62186）就先進運算管制所收公眾意見，並使管制更有效、降低不必要負擔。本規則旨在保護美國國安、限制中國取得用於軍事現代化之關鍵先進運算技術。技術上以「總處理效能」（Total Processing Performance, TPP）取代原「位元長×TOPS」判準（提供可客觀計算之門檻），並新增「效能密度」（performance density）參數，以防多晶片（chiplet）等技術規避；同時擴大國別範圍以防經第三國轉運規避。","body":"本暫行最終規則更新 2022 年先進運算管制，主要調整如下：\n(1) 將 ECCN 3A090 重定義為 .a／.b 兩級，以總處理效能（TPP）與效能密度取代原位元長×TOPS 判準，並在 9 項 ECCN 增設 .z 段\n(2) 將先進運算之區域穩定（RS）許可、外國直接產品規則與 §744.23 終端用途管制範圍擴至國家群組 D:1／D:4／D:5，但排除同列 A:5／A:6 者\n(3) 新增總部連結終端用途與全球適用之外國直接產品規則，使管制及於澳門／D:5 總部實體經第三地資料中心或雲端取得算力的特定情形\n(4) 新設通知型先進運算授權例外（Notified Advanced Computing, NAC）。","track":"EB"},{"code":"B-4c","disp":"EB-04c","item":"半導體製造設備出口管制暫行最終規則（2023-10）","id":"88 FR 73424（Federal Register Vol. 88, No. 205；RIN 0694-AJ23；文件編號 2023-23049）","year":"2023","date":"2023-10-25","prog":"T5 已施行——2023-10-25 公告、2023-11-17 生效（暫行最終規則 interim final rule, IFR；評論期至 2023-12-18）；其中 amendatory instruction 5 有效自 2026-01-01。本規則為 2022-10-07 IFR（87 FR 62186）之半導體製造設備（semiconductor manufacturing equipment, SME）部分更新（先進運算部分為同日 AC/S 規則〔88 FR 73458〕）。","who":"美國商務部工業與安全局（Bureau of Industry and Security, BIS）","law":"授權母法：2018 年出口管制改革法（Export Control Reform Act of 2018, ECRA；50 U.S.C. §4801–4852）。實施框架：出口管理條例（Export Administration Regulations, EAR；15 CFR Parts 730–774）。","bg":"本規則回應 2022-10-07 IFR（87 FR 62186）就半導體製造設備所收公眾意見，並使 SME 管制更有效、回應持續之國安疑慮。本規則旨在限制中國取得用於生產先進節點積體電路（advanced-node integrated circuits）之製造設備，以阻斷其先進半導體自主量產能力。","body":"本暫行最終規則更新 2022-10 之半導體製造設備（SME）管制：重構 SME 之 ECCN 分類並新增相關定義；對 SME 課國家安全（NS）與區域穩定（RS）出口許可、擴大受管制國別、並設最低含量門檻與臨時通用許可（TGL）等授權例外調整；另實質修訂美國人半導體製造活動與 SME 製造終端用途之管制。","track":"EB"},{"code":"B-4d","disp":"EB-04d","item":"先進運算與半導體製造設備出口管制更正與澄清暫行最終規則（2024-04）","id":"89 FR 23876（Federal Register Vol. 89, No. 66；RIN 0694-AI94；文件編號 2024-07004）","year":"2024","date":"2024-04-04","prog":"T5 已施行——2024-04-04 公告並生效（暫行最終規則 interim final rule, IFR；評論期至 2024-04-29）。本規則更正 2023-10-25 兩規則（先進運算／超級電腦／半導體終端用途 AC/S〔88 FR 73458〕、半導體製造設備 SME〔88 FR 73424〕）之疏漏並補充澄清。","who":"美國商務部工業與安全局（Bureau of Industry and Security, BIS）","law":"授權母法：2018 年出口管制改革法（Export Control Reform Act of 2018, ECRA；50 U.S.C. §4801–4852）。實施框架：出口管理條例（Export Administration Regulations, EAR；15 CFR Parts 732／734／736／740／742／744／746／748／758／770／772／774）。","bg":"BIS 於 2023-10-25 發布先進運算（AC/S）與半導體製造設備（SME）兩暫行最終規則後，發現條文存有疏漏與不一致之處，並就意見提交者提出之疑義有補充澄清之需；本規則即為該兩規則之更正與澄清版本。","body":"本規則除技術更正外，亦修訂 2023-10 的先進運算／超級電腦（AC/S）與半導體製造設備（SME）兩項暫行最終規則，主要調整如下：\n(1) 將 §740.8 的授權例外分為通知型先進運算（Notified Advanced Computing, NAC，須事前通知 BIS）與先進運算授權（Advanced Computing Authorized, ACA，免事前通知）\n(2) 恢復部分先進運算 ECCN 原有的國家安全（NS）、飛彈技術（MT）、核擴散（NP）與犯罪管制（CC）管制，並增列 4A090.b 與 3A001 的 .z 子段\n(3) 調整 §744.23 終端用途許可審查，新增三類逐案審查，並擴及半導體製造設備的間接併入用途與極紫外光（EUV）光罩\n(4) 將 EUV 光罩納入 §744.6 美國人支援活動管制\n其他修正涉及 ECCN、條文引用與國別範圍的一致性。","track":"EB"},{"code":"B-4e","disp":"EB-04e","item":"外國直接產品規則增訂暨先進運算與半導體製造設備管制精修暫行最終規則（2024-12）","id":"89 FR 96790（Federal Register Vol. 89, No. 234；RIN 0694-AJ74；文件編號 2024-28270）","year":"2024","date":"2024-12-05","prog":"T5 已施行——2024-12-05 公告、2024-12-02 生效；發布形式為暫行最終規則（interim final rule, IFR）。分階段遵循日：八項風險警示（red flags）與 §734.19 軟體金鑰之遵循日為 2024-12-02，主要 ECCN／FN5、SME 外國直接產品規則／HBM／先進節點 IC 定義等為 2024-12-31；評論期至 2025-01-31。與同日 BIS Entity List 規則並行發布。","who":"美國商務部工業與安全局（Bureau of Industry and Security, BIS）","law":"授權母法：2018 年出口管制改革法（Export Control Reform Act of 2018, ECRA；50 U.S.C. §4801–4852）。實施框架：出口管理條例（Export Administration Regulations, EAR；15 CFR Parts 732／734／736／740／742／744／746／748／758／770／772／774）。","bg":"BIS 為阻斷受關注國家與實體取得「先進節點積體電路（advanced-node integrated circuits）」之生產能力，於 2024-12 擴張外國直接產品規則、半導體製造設備與高頻寬記憶體等管制；管制理由在於先進記憶體與半導體製造設備對軍事、情報、監控及先進人工智慧具有關鍵性。","body":"本暫行最終規則擴張先進運算與半導體管制，主要措施如下：\n(1) 依 §734.9 新增兩項外國直接產品規則：實體清單腳註 5（FN5）規則，以及輸往澳門／D:5 物項的半導體製造設備規則\n(2) 新增或修訂半導體製造設備 ECCN，並設定 0% 最低含量門檻\n(3) 新增受限晶圓廠授權例外（Restricted Fabrication Facility, RFF）\n(4) 以 ECCN 3A090.c 管制高頻寬記憶體（HBM），並增設 HBM 授權例外\n(5) 依 §734.19 對軟體金鑰適用與其所啟用物項相同的管制要求\n(6) 修訂 §744.23 終端用途管制與 §744.6 美國人活動管制，涵蓋電子電腦輔助設計（ECAD）、技術電腦輔助設計（TCAD）工具及半導體製造設備\n其他修正涉及先進節點積體電路定義、風險警示（red flags）指引與條文一致性。","track":"EB"},{"code":"B-5","disp":"EB-05","item":"驗證終端用戶授權之擴充：資料中心驗證終端用戶授權（2024-10）","id":"89 FR 80080（Federal Register Vol. 89, No. 191；RIN 0694-AJ82；Docket No. 240926-0254；文件編號 2024-22587）","year":"2024","date":"2024-10-02","prog":"T5 已施行——2024-10-02 公告並即日生效（最終規則；依正當理由〔good cause〕／外交事務例外免事前提案規則〔Notice of Proposed Rulemaking, NPRM〕與公眾評論）。","who":"美國商務部工業與安全局（Bureau of Industry and Security, BIS）","law":"授權母法：2018 年出口管制改革法（Export Control Reform Act of 2018, ECRA；50 U.S.C. §4801–4852）。實施框架：出口管理條例（Export Administration Regulations, EAR；15 CFR Part 748——驗證終端用戶授權 §748.15 、 Supplement Nos. 7／8／9）。","bg":"BIS 於 2022-10（87 FR 62186）與 2023-10（88 FR 73424／73458）對先進運算積體電路課管制後，擴充驗證終端用戶（VEU）制度並新設資料中心 VEU，使符合資格與安全條件之資料中心得依 VEU 授權取得先進運算物項。","body":"本最終規則（2024-10-02 生效）擴充驗證終端用戶（Validated End-User, VEU）授權制度，於 EAR §748.15 新設「資料中心 VEU 授權」（Data Center VEU）：為設於指定目的地之資料中心建立預先核准通道，對通過審查之可信終端用戶，便利出口／再出口資料中心所需之商業管制清單（Commerce Control List, CCL）受許可物項（含先進運算積體電路），以促進可信環境中之 AI 運算部署。授權沿用既有 VEU 框架並加嚴——資格須經終端用戶審查委員會（End-User Review Committee, ERC）依安全與可信標準核定，並附終端用途限制、認證與半年期報告等條件。其餘為與既有 VEU（改稱 General VEU）條款之一致性修正。","track":"EB"},{"code":"B-6a","disp":"EB-06a","item":"人工智慧擴散框架暫行最終規則（2025-01）","id":"90 FR 4544（Federal Register Vol. 90, No. 9；RIN 0694-AJ90；文件編號 2025-00636）","year":"2025","date":"2025-01-15","prog":"T1 已撤銷——2025-01-15 刊登（Federal Register）、2025-01-13 生效；一般遵循日為 2025-05-15（Supplement No. 10 ¶14／15／18 安全要求延至 2026-01-15）。BIS 於 2025-05-13 宣布撤銷本規則並指示不予執行，且表示將另行發布正式撤銷規則及替代架構；框架未全面施行。","who":"美國商務部工業與安全局（Bureau of Industry and Security, BIS）","law":"授權母法：2018 年出口管制改革法（Export Control Reform Act of 2018, ECRA；50 U.S.C. §4801–4852）。實施框架：出口管理條例（Export Administration Regulations, EAR；15 CFR Parts 732／734／740／742／744／748／750／762／772／774）。","bg":"BIS 認為前沿 AI 對軍事、情報與大規模毀滅性武器、網路攻擊具關鍵性，受關注國家亦追求以 AI 強化軍事；遂建立「擴散」框架——在向可信盟邦與通過安全審查之資料中心擴散 AI 運算的同時，對其餘目的地以國別配額與授權路徑控管、對受關注國家維持最嚴格管制。本規則承 2022-10／2023-10 先進運算管制與 EO 14110 脈絡。","body":"本暫行最終規則建立人工智慧擴散分層管制框架：\n(1) 對先進運算積體電路（ECCN 3A090.a／4A090.a 等）設定全球許可要求並分三類目的地：Supplement No. 5(a) 所列 19 個目的地、澳門／D:5，以及其餘受國別配額的目的地\n(2) 新增 AIA、ACM 與 LPP 三項授權例外\n(3) 將資料中心驗證終端用戶分為通用（UVEU）與國別（NVEU）兩類，並設定總處理效能（TPP）安裝量配額\n(4) 將以至少 10²⁶ 次運算訓練的 AI 模型權重納入 ECCN 4E091 管制，並增設模型權重外國直接產品規則\n本規則於主要遵循日前即由 BIS 宣布撤銷並不予執行，未全面施行。","track":"EB"},{"code":"B-6b","disp":"EB-06b","item":"人工智慧擴散框架撤銷暨過渡指引（2025-05）","id":"無聯邦公報文件號（BIS 公告、三份政策指引，2025-05-13；非 FR codified 規則）","year":"2025","date":"2025-05-13","prog":"T5 已施行——2025-05-13 商務部發布公告與三份指引；人工智慧擴散規則的不予執行（non-enforcement）即時生效，工業與安全副部長 Jeffrey Kessler 指示執法人員不予執行；BIS 同時宣布將另行發布正式撤銷規則與替代規則。上述措施為行政指引與執行政策聲明。","who":"美國商務部（Department of Commerce, DOC）／工業與安全局（Bureau of Industry and Security, BIS）","law":"授權母法：2018 年出口管制改革法（Export Control Reform Act of 2018, ECRA；50 U.S.C. §4801–4852）。實施框架：出口管理條例（Export Administration Regulations, EAR；15 CFR Parts 730–774）——本組為對既有條文之執行／解釋指引（一般禁令第十條 §736.2(b)(10)、先進運算外國直接產品規則 §734.9(h)、part 744 catch-all、§748.5），非新增 codified 條文。","bg":"川普政府否定拜登時期 AI 擴散規則（90 FR 4544），稱其扼殺美國創新、以「次級地位」降級數十國而損外交；改採「向可信夥伴推廣美國 AI、同時阻斷對手」之策略。撤銷之同時強化對晶片之管制（GP10 對 PRC 先進運算 IC、防轉運、AI 訓練 catch-all）。","body":"2025-05-13，BIS 公布下列措施：\n(1) 宣布撤銷人工智慧擴散規則並指示執法人員不予執行；BIS 同時表示將另行發布正式撤銷規則與替代規則\n(2) 發布三份政策指引，分別說明一般禁令第十條（GP10）對中國先進運算積體電路的適用風險、防止先進運算積體電路轉運的風險警示（red flags）與盡職調查，以及 AI 模型訓練可能觸發 EAR 第 744 部 catch-all 管制的情形\n上述措施屬行政指引與執行政策聲明。","track":"EB"},{"code":"B-7a","disp":"EB-07a","item":"先進運算積體電路額外盡職調查措施暨修正與澄清暫行最終規則（2025-01）","id":"90 FR 5298（Federal Register Vol. 90, No. 10；RIN 0694-AJ98；Docket No. 250108-0013；文件編號 2025-00711）","year":"2025","date":"2025-01-16","prog":"T5 已施行——2025-01-16 生效、2025-01-31 遵循；§743.9 首份季報提交期限為 2025-05-31，涵蓋 2025-01-31 至 2025-04-30；評論期至 2025-03-14，並將 2024-12 外國直接產品規則（89 FR 96790）的評論期延長至同日。","who":"美國商務部工業與安全局（Bureau of Industry and Security, BIS）","law":"授權母法：2018 年出口管制改革法（Export Control Reform Act of 2018, ECRA；50 U.S.C. §4801–4852）。實施框架：出口管理條例（Export Administration Regulations, EAR；15 CFR Parts 734／736／740／742／743／744／748／762／772／774）。","bg":"BIS 在規則前言指出，公眾意見普遍要求就先進運算 IC 提供更詳細的盡職調查指引。本規則為晶圓代工廠與 OSAT 建立盡職調查程序、核可 IC 設計商／OSAT 名單與前段廠通報義務，並修正澄清 2024-12 外國直接產品規則（89 FR 96790）。","body":"本暫行最終規則為晶圓代工廠與委外封裝測試業者（OSAT）建立先進運算積體電路的可信供應鏈盡職調查框架：\n(1) 新設核可積體電路設計商（Supplement No. 6）與核可 OSAT（Supplement No. 7）名單，並設「獲授權積體電路設計商」類別\n(2) 對 AIA／ACM 授權例外的三項適格 ECCN，增設須由核可或獲授權設計商設計的要件\n(3) 要求前段晶圓廠對獲授權設計商執行客戶盡職調查（KYC），並按季向 BIS 通報\n(4) 以 ECCN 3A090.a 推定與電晶體數門檻釐清適用範圍，並修訂先進節點積體電路定義\n規則亦修正 2024-12 外國直接產品規則並延長評論期。","track":"EB"},{"code":"B-7b","disp":"EB-07b","item":"實體清單加列：Sophgo 等 16 實體（Footnote 4，2025-01）","id":"90 FR 4621（Federal Register Vol. 90, No. 10；RIN 0694-AK01；文件編號 2025-00480）","year":"2025","date":"2025-01-16","prog":"T5 已施行——2025-01-16 公告並即日生效（最終規則 final rule）。","who":"美國商務部工業與安全局（Bureau of Industry and Security, BIS）／終端用戶審查委員會（End-User Review Committee, ERC）","law":"授權母法：2018 年出口管制改革法（Export Control Reform Act of 2018, ECRA；50 U.S.C. §4801–4852）。實施框架：出口管理條例（Export Administration Regulations, EAR；15 CFR Part 744〔§744.11 實體清單〕、Supplement No.4 to part 744〔實體清單〕；Footnote 4 指定適用外國直接產品規則 §734.9(e)(2)）。","bg":"BIS 認定 16 實體支援或直接促成有助中國發展先進武器、大規模毀滅性武器（weapons of mass destruction, WMD）與高科技監控應用之先進運算積體電路；該等實體供應中國公安終端用戶，並有將物項轉運予實體清單實體華為（Huawei）之風險，違反美國國安與外交利益（§744.11）。係 Sophgo／Sophon 及多個 Suan- 命名之先進運算 IC 設計相關實體。","body":"本最終規則（2025-01-16 生效）將 16 個實體（中國 14、新加坡 2；Sophgo／Sophon 及多個 Suan- 命名之先進運算積體電路設計相關實體，含 Quliang、PowerAir 等）加列實體清單，理由為支援或直接促成有助中國發展先進武器、WMD 與高科技監控之先進運算 IC、供應中國公安終端用戶、並有轉運華為之風險。各該實體受全品項受 EAR 物項之許可要求與拒絕推定審查；並以 Footnote 4（FN4）指定，使外國生產物項依 §734.9(e)(2) 納入 EAR 管轄。","track":"EB"},{"code":"B-9","disp":"EB-09","item":"關係企業管制：實體清單／MEU／SDN 之 50% 持股子公司自動納管（Affiliates Rule，2025-09）","id":"90 FR 47201（Federal Register；文件編號 2025-19001；公告日 2025-09-30）；暫停規則文件編號 2025-19846","year":"2025","date":"2025-09-29","prog":"T1 暫停（2025-11-10 起暫停實施一年，至 2026-11-09；除非延長，2026-11-10 重新生效）","who":"美國商務部工業與安全局（Bureau of Industry and Security, BIS）","law":"授權母法：2018 年出口管制改革法（Export Control Reform Act of 2018, ECRA；50 U.S.C. §4801–4852）。實施框架：出口管理條例（Export Administration Regulations, EAR）——本暫行最終規則（interim final rule, IFR）修訂 15 CFR parts 732／734／736／744／748，將 50% 規則適用於 EAR §744.11（實體清單）、§744.21（軍事終端用戶）、§744.8（特別指定國民清單，SDN List）三類。","bg":"・BIS 指出，受列名實體可透過位於新加坡、香港、阿聯酋等地之未列名境外子公司進行轉運或規避。\n・BIS 表示，本規則將與美國財政部長期實務一致之 50% 持股判定標準延伸適用於 EAR 之實體清單、軍事終端用戶清單及 §744.8 SDN 三類。\n・規則於 2025-09-29 生效後設臨時通用許可（Temporary General License, TGL）過渡，並自 2025-11-10 起暫停實施一年。","body":"本暫行最終規則將實體清單、軍事終端用戶清單及 §744.8 SDN 之管制，延伸至受各該列名實體直接或間接、個別或合計持股達 50% 以上之未列名關係企業。BIS 表示，此持股判定標準與美國財政部長期實務一致。規則於 2025-09-29 生效，並自 2025-11-10 起暫停實施至 2026-11-09。","track":"EB"},{"code":"B-10","disp":"EB-10","item":"H200／MI325X 對中／澳門出口個案審查（case-by-case）許可（先進運算品項審查政策修訂，2026-01）","id":"Federal Register 文件編號 2026-00789（Docket No. 260112-0028；2026-01-13 filed、2026-01-15 Federal Register 公告並生效）","year":"2026","date":"2026-01-15","prog":"T5 已施行（2026-01-13 filed、2026-01-15 Federal Register 公告並生效）","who":"美國商務部工業與安全局（Bureau of Industry and Security, BIS）","law":"授權母法：2018 年出口管制改革法（Export Control Reform Act of 2018, ECRA；50 U.S.C. §4801–4852）。實施框架：出口管理條例（Export Administration Regulations, EAR）——修訂 15 CFR parts 742／744／748：§742.6（區域穩定，Regional Stability）§742.6(b)(10)(iii)(A)(1) 建立個案審查許可政策、§744.23（超級電腦／先進節點 IC／半導體製造設備終端用途管制）連動個案審查、§748.8(bb)（許可申請要求）及 Supplement No.2 to part 748 (dd)（認證要求）。","bg":"・標的為效能介於門檻內之降階高階 AI 加速器：總處理效能（TPP）< 21,000（3A090.a/b 技術註 2）且 DRAM 總頻寬 < 6,500 GB/s（如 NVIDIA H200、AMD MI325X）；效能逾此門檻之更高階品項不適用本個案審查路徑。\n・個案審查僅適用「自美國出口至中國或澳門終端用戶」；其他 reexports／境內移轉、及總部或最終母公司設於澳門或 Country Group D:5 之實體，仍維持拒絕推定。\n・BIS 述其調整審查政策係為確保美國於人工智慧（AI）領導地位之國安利益。","body":"本最終規則為特定先進運算品項自美國對中國／澳門終端用戶出口之審查政策，建立由拒絕推定轉為個案審查之條件式例外路徑：標的為總處理效能與 DRAM 頻寬低於指定門檻之品項（如 H200／MI325X），出口商須就出貨數量與效能規格提報、美國供給充足、對中／澳門出貨比例（50% cap）、終端用途與用戶排除、客戶盡職調查、IaaS 遠端使用者清單、模型權重與演算法存取限制、實體安全及美國第三方測試等九項提出認證，方得個案審查。效能逾門檻之品項、及 reexports／境內移轉、總部設於澳門或 D:5 之實體仍維持拒絕推定。","track":"EB"},{"code":"C-1","disp":"EB-11","item":"BIS 雲端運算諮詢意見","id":"行政解釋，無 Federal Register 編號（2009 意見篇名「Application of EAR to Grid and Cloud Computing Services」）","year":"2009","date":"2009-01-13","prog":"T5 現行有效——2009-01-13 發布之 BIS 諮詢意見（advisory opinion），屬個案行政解釋、無法規拘束力；2014-11-13 意見延伸其適用；相關原則其後部分成文化於 EAR §734.13、§734.18","who":"美國商務部工業與安全局資訊技術管制處（Information Technology Controls Division, Bureau of Industry and Security, U.S. Department of Commerce）","law":"15 CFR §734.13（出口定義）、§772.1（出口人〔exporter〕定義）、§734.3(b)(3)（公開可得軟體不受 EAR）；非全面豁免——§744.6(a)(2)（明知助長飛彈／生化武器之服務）、§740.7(b)(2)（APP 授權例外〔License Exception APP〕國別存取限制）仍適用","bg":"EAR 對「出口」之傳統定義以實體商品或原始碼跨境移動為基礎。雲端／網格運算興起後，使用者可不下載受控軟體即遠距取用運算資源，BIS 遂以諮詢意見釐清雲端服務提供者於出口管制下之地位。","body":"BIS 以行政諮詢意見釐清雲端／網格運算服務於出口管制下之地位：提供雲端／網格運算能力本身不構成 EAR 出口（提供者未輸送受 EAR 管轄之商品／軟體／技術，於使用者匯出資料時亦非該交易之 exporter）；惟非全面豁免——若提供者輸送受 EAR 軟體／技術仍構成出口，且 §744.6、License Exception APP 國別存取限制等仍可能適用。2014-11-13 意見延伸至使用者於雲端使用而不下載受控軟體（含 ECCN 5D002 加密軟體）亦不構成軟體出口。","track":"EB"},{"code":"C-3","disp":"EB-12","item":"就重大惡意網路活動國家緊急狀態採取額外措施擬議規則","id":"RIN 0694-AJ35（89 FR 5698；Federal Register 文件編號 2024-01580；Docket No. 240119-0020）","year":"2024","date":"2024-01-29","prog":"T4 擬議規則公告（NPRM）——2024-01-29 聯邦公報公告，公眾意見徵詢至 2024-04-29。本 NPRM 依 EO 13984 §1／§2 與 EO 14110 §4.2，提出身分驗證、特別措施及大型 AI 模型訓練通報制度；EO 14110 已於 2025-01 撤銷。","who":"美國商務部工業與安全局（Bureau of Industry and Security, BIS）；具名 Alan F. Estevez（工業與安全副部長／Under Secretary of Commerce for Industry and Security）","law":"國際緊急經濟權力法（International Emergency Economic Powers Act, IEEPA；50 U.S.C. 1701 et seq.）、國家緊急狀態法（National Emergencies Act, NEA；50 U.S.C. 1601 et seq.）、EO 13873（84 FR 22689）、EO 13984（86 FR 6837）；§7.308 大型 AI 模型訓練通報之政策授權溯及 EO 14110 §4.2。","bg":"外國惡意網路行為者（malicious cyber actor）利用美國基礎設施即服務（Infrastructure as a Service, IaaS）產品（租用伺服器以運算／儲存而不負維運成本）從事智慧財產與敏感資料竊取、隱蔽間諜活動並威脅關鍵基礎設施，且常迅速更換基礎設施、並透過不查核身分之外國轉售商（foreign reseller）規避執法追查；大規模運算基礎設施興起，更引發對手藉美國 IaaS 訓練「可助長或自動化惡意網路活動之大型 AI 模型（large AI model）」之疑慮。據此，EO 13984 授權課美國 IaaS 業者查核外國使用者身分、保存紀錄並限制特定外國行為者存取；EO 14110 另要求就外國人訓練大型 AI 模型之交易提出通報。本擬議規則（Notice of Proposed Rulemaking, NPRM）即實施此二令。","body":"擬議規則將於 15 CFR 第 7 部新增 Subpart D（§§7.300–7.310），包括四項機制：\n(1) 身分驗證：要求美國 IaaS 業者建立客戶身分驗證計畫、保存紀錄，並使外國轉售商適用相應要求\n(2) 豁免：經商務部認定的 IaaS 濫用防制計畫可替代個別客戶身分驗證計畫\n(3) 特別措施：對特定外國司法管轄區或人士的 IaaS 帳戶施加禁止或條件\n(4) 訓練通報：業者明知外國人使用美國 IaaS 訓練具潛在惡意用途的大型 AI 模型時，須向商務部通報\n違反規定者依 IEEPA 處罰。第 (4) 項原依 EO 14110 §4.2 提出；EO 14110 已遭撤銷。","track":"EB"},{"code":"D-1","disp":"LC-01","item":"遠距存取安全法","id":"H.R. 2683（眾院）／S. 3519（參院）；第 119 屆國會（2025–2026）","year":"2026","date":"2026-01-12","prog":"T4 立法後段——眾院 H.R. 2683 於 2026-01-12 以 369-22 通過、2026-01-13 付參院銀行委員會；參院版 S. 3519（2025-12 提出）於參院銀行委員會審議中","who":"眾院（H.R. 2683）：領銜眾議員 Michael Lawler（R-NY）\n參院（S. 3519）：領銜參議員 David H. McCormick（R-PA）／Ron Wyden（D-OR），共同提案參議員 Tom Cotton（R-AR）／Christopher A. Coons（D-DE）","law":"修正《2018 年出口管制改革法》（Export Control Reform Act of 2018, ECRA；50 U.S.C. §4801 et seq.）。","bg":"依 BIS 2009 年雲端諮詢意見，單純提供雲端／遠距存取不構成 EAR 意義之出口；受管制物項雖不得實體出口，外國人仍得經雲端自境外遠距使用該等物項。本法修正出口管制法規，將該等遠距使用納入出口管制範圍。","body":"本法修正《出口管制改革法》：於其定義條款新增「遠距存取」（remote access）一詞，並於該法各授權、許可、執行、罰則條款一併插入「遠距存取」，使商務部 BIS 對「出口、再出口、境內移轉」既有之管制權能延伸涵蓋「遠距存取」。「遠距存取」定義為外國人經網路連線（含網際網路或雲端運算服務）自物項所在地以外存取受美國管轄之物項，且商務部認定該使用可能對美國國安或外交政策構成嚴重風險者。本法另課商務部就遠距存取管制規則之研擬向國會（眾院外委會、參院銀行委員會）保持告知（必要時以密件），惟明定國會核可非行使該權力之前提。","track":"LC"},{"code":"E-1","disp":"LC-02","item":"防止 CHIPS 法案資金不當使用最終規則（CHIPS 補助護欄）","id":"CHIPS and Science Act of 2022（Pub. L. 117-167）編纂為 15 U.S.C. §4652（補助護欄授權）\n實施規則 15 CFR Part 231（Final Rule 88 FR 65600；FR Doc 2023-20471）\n修正 88 FR 89574（2023-12-28，重大擴張〔material expansion〕等門檻更新）","year":"2023","date":"2023-09-25","prog":"T5 已施行——2023-09-22 發布、2023-09-25 聯邦公報（Federal Register, FR）公告、2023-11-24 生效（15 CFR Part 231）","who":"美國國會（CHIPS and Science Act of 2022，Pub. L. 117-167，2022-08-09 簽署）\n實施規則：商務部晶片計畫辦公室（CHIPS Program Office）／國家標準暨技術研究院（National Institute of Standards and Technology, NIST）發布；非工業與安全局（Bureau of Industry and Security, BIS）","law":"《2022 年 CHIPS 與科學法》（Pub. L. 117-167）之 CHIPS 補助護欄授權（15 U.S.C. §4652），由商務部以 15 CFR Part 231 實施。","bg":"CHIPS 補助旨在重建美國半導體製造；護欄條款係為防補助資金間接強化受關注國家之先進半導體能力。受關注國家（foreign country of concern, FCOC）為 10 U.S.C. 4872(d) 所定之受涵蓋國家（covered nation，中國、俄羅斯、伊朗、北韓），及商務部會同國防部、國務院、國家情報總監（Director of National Intelligence, DNI）認定者。","body":"本規則實施 CHIPS 補助護欄，對受領聯邦補助之實體課兩項以「追回全額補助」（clawback）為制裁之限制：其一「擴張追回」（Expansion Clawback），自獲補助起 10 年內，不得在受關注國家進行涉半導體製造產能重大擴張（material expansion）之重大交易（significant transaction），惟對生產傳統製程半導體（legacy semiconductor）之既有設施、及生產傳統製程半導體且主要服務受關注國家市場之擴張設例外；其二「技術追回」（Technology Clawback），於補助適用期內，不得在明知下與受關注外國實體（foreign entity of concern, FEOC）就涉國安疑慮之技術或產品從事共同研究（joint research）或技術授權（technology licensing）。規則並設潛在不容許活動之事前通報程序與商務部執行／追回機制。受關注國家為 10 U.S.C. 4872(d) 受涵蓋國家及商務部認定者。","track":"LC"},{"code":"E-2","disp":"LC-03","item":"晶片安全法","id":"H.R. 3447（眾院）／S. 1705（參院）；第 119 屆國會（2025–2026）","year":"2025","date":"2025-05-15","prog":"T3 委員會通過：\n・眾院外交事務委員會（House Foreign Affairs Committee, HFAC）2026-03-26 以 42–0 表決通過修正案性質之替代案並決議報告（ordered reported in the nature of a substitute）\n・參院 S. 1705 付參院銀行委員會（Senate Committee on Banking, Housing, and Urban Affairs）","who":"眾院（H.R. 3447）：領銜眾議員 Bill Huizenga（R-MI），共同提案眾議員 Bill Foster（D-IL）／John R. Moolenaar（R-MI）／Raja Krishnamoorthi（D-IL）／Eric A. \"Rick\" Crawford（R-AR）／Ted Lieu（D-CA）／Darin LaHood（R-IL）／Josh Gottheimer（D-NJ）\n參院（S. 1705）：領銜參議員 Tom Cotton（R-AR）","law":"美國國會立法權創設之新法定義務，運作於《2018 年出口管制改革法》（Export Control Reform Act of 2018, ECRA；50 U.S.C. §4801 et seq.）授權體系之上；§4 明定不限縮商務部或其他機關依 ECRA 或其他法律之執法權。受涵蓋積體電路產品（covered integrated circuit product）以 ECCN 3A090、4A090、5A002.z 及相關 .z 界定，並限於為資料中心用途所設計或行銷者；§3(3)(C) 另明文排除三類：非為資料中心用途設計或行銷者、非屬圖形處理器（GPU）或類似產品之微處理器（如中央處理器 CPU）、及主要功能為在運算網路上路由流量之網路交換器積體電路。","bg":"本法第 2 條國會意旨（Sense of Congress）指出：美國技術應成為全球 AI 生態系之基礎；向盟邦與夥伴提供先進運算能力有助美國建立善意與夥伴關係；自美國出口之先進積體電路與運算硬體須防止遭轉運（diversion）、竊取與未經授權使用；非法轉運（尤其流向中國與俄羅斯）為重大且持續擴大之問題，侵蝕美國出口管制；導入晶片安全機制可改善管制執行、協助盟邦保護運算硬體；且因其有助偵測走私與濫用，反而可使出口管制取得更大彈性，使更多國際夥伴得以獲得簡化且規模更大之出貨。","body":"本法課商務部就晶片安全機制建立評估、規則制定與強化三階段義務：\n(1) 初次評估與報告（§5）：於生效日啟動評估（會同國務院／國防部／能源部及公眾），辨識可靠驗證受涵蓋積體電路產品是否遭非法轉移或存取之機制、發展產業導入誘因、分析實施成本並提出建議機制；生效後 210 日內向國會提交結果，含擬提出之機制、研發方向、實施路線圖及出口管制彈性化建議。\n(2) 機制要求與規則制定（§6(a)）：生效後一年內，商務部會同前述三部要求出口、再出口或境內移轉至外國之受涵蓋積體電路產品配備晶片安全機制；270 日內發布擬議規則（須徵求公眾意見並就資料在地化／隱私法域提供指引）；一年內經徵詢公眾及其他相關機關後發布最終規則，其中須含通報要求——當安全機制未能確認產品未遭非法轉移至受關注目的地時（包含遭竄改或嘗試竄改之情形）須通報工業與安全局。\n(3) 強化評估（§6(b)）：生效兩年後、其後三年逐年評估並向國會報告應否強化機制。\n§4 另設六項排除性規則（禁 kill switch／地理圍籬等妨礙功能之機制、禁強制硬體變更、純代工者與非 AI 資料中心產品及美國境內產品均不適用）。","track":"LC"},{"code":"E-3","disp":"LC-04","item":"美國 AI 能力對中脫鉤法（2025）","id":"S. 321，第 119 屆國會（2025–2026）","year":"2025","date":"2025-01-29","prog":"T2 提出後停滯：2025-01-29 由參議員 Hawley 提出、付參院委員會","who":"領銜參議員 Josh Hawley（R-MO）","law":"本法新增《美國法典》第 18 編第 124 章（18 U.S.C. Chapter 124，§§2741–2743）刑事禁令；罰則就違反程度援引《2018 年出口管制改革法》（Export Control Reform Act of 2018, ECRA；50 U.S.C. §4819）。","bg":"本法立法標的為切斷有利於中華人民共和國之 AI／生成式 AI 研究、開發、技術與資金連結；新增之《美國法典》第 18 編第 124 章定名為「有利於中華人民共和國之研究與開發（Research and Development That Benefits the People's Republic of China）」，揭示其立法標的。","body":"本法新增《美國法典》第 18 編第 124 章刑事禁令，對 AI／生成式 AI 技術之對中流動課三項禁令：交易禁令——禁止 AI 技術或智慧財產（IP）對中華人民共和國（PRC）之出口、再出口、境內移轉，及自 PRC 進口在 PRC 開發／產製之 AI 技術或 IP；行為禁令——禁止美國人於 PRC 境內或為受關注實體（entity of concern）從事 AI／生成式 AI 研發、及向其移轉 AI 研究資訊；投資禁令——禁止美國人明知持有／管理受關注中國實體權益或對其融資。違反者課刑事與民事罰則（罰金、喪失聯邦 license／contract／grant 及資助資格），刑事罰適用程度援引 50 U.S.C. §4819(b)。S. 321，領銜參議員 Hawley。","track":"LC"},{"code":"E-4","disp":"LC-05","item":"AI 監督法","id":"H.R. 6875（眾院）／S. 4456（參院）；第 119 屆國會（2025–2026）","year":"2025","date":"2025-12-18","prog":"T3 委員會通過：\n・眾院 H.R. 6875：外交事務委員會（HFAC）2026-01-21 以 42–2–1（1 票 present）表決通過修正並決議報告（ordered reported, as amended）；基礎文本為 Mast 修正案性質之替代案 #106（amendment in the nature of a substitute，經一致同意作為基礎文本），Amo 對該替代案之修正案未獲通過（20–25）\n・參院 S. 4456：2026-04-30 提出，付參院銀行委員會（Senate Committee on Banking, Housing, and Urban Affairs）","who":"眾院（H.R. 6875）：領銜眾議員 Brian J. Mast（R-FL，眾議院外交委員會主席），共同提案眾議員 Bill Huizenga（R-MI）／John R. Moolenaar（R-MI）／Young Kim（R-CA）／Keith Self（R-TX）／Eric A. \"Rick\" Crawford（R-AR）／Darin LaHood（R-IL）\n參院（S. 4456）：領銜參議員 Jim Banks（R-IN），共同提案參議員 Elizabeth Warren（D-MA）／Tom Cotton（R-AR）／Jeanne Shaheen（D-NH）／Pete Ricketts（R-NE）／Catherine Cortez Masto（D-NV）","law":"修正《2018 年出口管制改革法》（Export Control Reform Act of 2018, ECRA；50 U.S.C. §4811 et seq.）Part I。","bg":"本法名稱所揭立法標的（「Weaponizable Advanced Technology to Covered High-Risk Actors」）即在於：將先進運算晶片之對受關注國家出口視為戰略敏感，須防其增強對手之軍事、情報與 AI 能力。","body":"本法於《2018 年出口管制改革法》Part I 新增 §1758A，對受關注國家（country of concern：中華人民共和國含港澳、古巴、伊朗、北韓、俄羅斯，及其他經國務卿指定並於聯邦公報公告之 Country Group D:5 國家）之高階資料中心晶片，建立出口、再出口與境內移轉許可制度，並對最高階晶片設法定全面禁令。\n許可核發受國會事前認證與 30 日（部分期間 60 日）審查，並得經國會聯合決議否決；另設可信美國人（trusted US person）條件式豁免通道；過渡期全面拒發以美國人工智慧勝利戰略提交時點為終點。\n眾院 H.R. 6875 之操作文本為 2026-01-21 眾院外委會通過之 Mast 修正案性質之替代案；參院 S. 4456 為對應版本。","track":"LC"},{"code":"E-5","disp":"LC-06","item":"硬體技術管制多邊對齊法案（MATCH 法案）","id":"S. 4281（參議院），第 119 屆國會\nH.R. 8170（眾議院），第 119 屆國會","year":"2026","date":"2026-04-02","prog":"T3 委員會通過——眾院 H.R. 8170 經眾議院外交委員會（House Foreign Affairs Committee）2026-04-22 以 36–8 表決通過修正案性質之替代案（amendment in the nature of a substitute，全案抽換）並決議報告（ordered reported in the nature of a substitute, as amended）；該替代案另經一件修正案表決通過（Baumgartner），另一件（Perry）撤回。\n參院 S. 4281 於 2026-04-13 二讀後付參議院銀行、住宅暨都市事務委員會（Committee on Banking, Housing, and Urban Affairs）審議。","who":"參院（S. 4281）：領銜參議員 Pete Ricketts（R-NE），另有 9 名共同提案人\n眾院（H.R. 8170）：領銜眾議員 Michael Baumgartner（R-WA），另有 29 名共同提案人","law":"美國國會立法權創設之新法定指令，運作於《2018 年出口管制改革法》（Export Control Reform Act of 2018, ECRA；50 U.S.C. 4801 et seq.）授權架構上——§3(m) 明定 ECRA §1762（50 U.S.C. 4821）之行政程序法規則制定與司法審查規定準用本節；§4 明定不得解釋為指示主管機關制定致盟國供應國之管制或許可政策不具同等實際效果之單邊管制。\n受關注國家（country of concern）為法定列舉：中華人民共和國（含香港與澳門特別行政區）、伊朗、北韓、俄羅斯，及其他列於 EAR Supplement No. 1 to Part 740 之 Country Group D:5、經國務卿指定並於聯邦公報公告者；先進節點積體電路（advanced-node integrated circuits）援引 EAR §772.1（2026-01-01 版）定義。","bg":"本法認為，人工智慧等先進運算應用正改變軍事事務與權力平衡；美國與其盟國在支撐先進運算之基礎技術上具優勢，包括先進節點積體電路及其生產、以及設計與生產先進節點積體電路所需之設備與軟體；強健之半導體技術管制歷經多屆政府均為跨黨派優先事項，反映保護美國半導體優勢攸關國家安全之共識；美國應持續更新出口管制，使從事先進節點積體電路生產、且對受關注國家軍民融合特別關鍵之受關注國家實體，無法利用美國與盟國技術損害其國家安全；位於對手國家、生產半導體製造設備之企業，對其發展先進節點積體電路產能與突破出口管制至關重要，不應被容許使用或受益於美國或盟國之技術或零組件；美國政府應與盟國夥伴密切合作，對齊半導體製造設備及其零組件之出口管制，以確保限制有效、防止管制缺口、降低規避風險並確保全球公平競爭環境。","body":"本法課工業與安全副部長與國務卿（會同能源部長與國防部長）於各時限內：盤點須加管制之關鍵卡點半導體製造設備與關鍵半導體製造設施，設公眾與業界保密提供資訊之機制並向國會報告；\n對盟國供應國展開外交協調，促其採行全國性管制與拒發推定許可政策；\n對美國原產之該等設備施加全國性出口管制，並使受關注國家境內所有關鍵半導體製造設施受美國全面限制；\n就盟國供應國是否已實施對等管制向國會二擇一認證（全數實施，或提出未實施國家清單）；\n未作全數實施認證者，將管制延伸至該等國家與受關注國家輸出之設備、設施內物項之維修服務，及輸往該等設施之適用項目；\n並定期向國會報告，於盟國採行對等管制後得終止或修改管制、其後遭實質削弱時須重新施加。\n本法自生效之日起五年後失效，不影響失效前已開始或發生之行動、程序與義務。","track":"LC"},{"code":"E-6","disp":"LC-07","item":"中國 AI 實力報告法案","id":"H.R. 6275（眾議院），第 119 屆國會","year":"2025","date":"2025-11-21","prog":"T3 委員會通過——眾院 H.R. 6275 經眾議院外交委員會（House Foreign Affairs Committee）2026-01-21 以 47–0 表決通過修正並決議報告（ordered reported, amended）（通過之修正案為 Moylan 修正案 #108）。無參院對應版本。","who":"眾院（H.R. 6275）：領銜關島代表 James C. Moylan（R-GU），偕眾議員 Eugene Simon Vindman（D-VA）、Bill Huizenga（R-MI）","law":"美國國會立法權創設之獨立年度報告義務；不創設新出口管制權，目的為支撐國會對出口管制之監督與必要時更新授權。","bg":"本法認為，對 AI 之出口管制須動態調整，以因應中國快速演進之能力與規避、轉移手法；為使國會能行使監督並於必要時更新出口管制授權，國會須充分且即時掌握中國 AI 能力之現況與未來推估。","body":"本法案要求商務部與國務院共同（會同國防部、能源部、國家情報總監〔DNI〕及白宮科技政策辦公室〔OSTP〕），逐年評估中國先進人工智慧能力及其供應鏈，並向眾議院外交委員會與參議院銀行、住宅暨都市事務委員會提交報告。\n評估範圍（AI 全棧）：涵蓋 AI 晶片設計商、邏輯與記憶體晶圓廠、半導體製造設備、電子設計自動化（EDA）軟體、國安相關 AI 模型、新興研究、公共資金與資本流、總算力、人形機器人、AI 應用、中國 AI 監管框架、標準外交、遠距存取算力、晶片轉移，以及美國出口管制的有效性與立法建議。\n提交形式：報告以非密形式提交，得附機密附件，並須包含法案指定的非密要素。","track":"LC"},{"code":"E-7","disp":"LC-08","item":"嚇阻美國 AI 模型竊取法案（2026）","id":"H.R. 8283（眾議院），第 119 屆國會","year":"2026","date":"2026-04-15","prog":"T3 委員會通過——眾院 H.R. 8283 經眾議院外交委員會（House Foreign Affairs Committee）2026-04-22 以 43–0 表決通過修正並決議報告（ordered reported, amended）（通過之修正案為 Huizenga 修正案 #88）。無參院對應版本。","who":"眾院（H.R. 8283）：領銜眾議員 Bill Huizenga（R-MI），偕眾議員 John R. Moolenaar（R-MI）","law":"美國國會立法權創設之新法定機制，運作於既有出口管制體制——《2018 年出口管制改革法》（Export Control Reform Act of 2018, ECRA；50 U.S.C. 4801 et seq.）、工業與安全局（Bureau of Industry and Security, BIS）實體清單（Entity List，15 CFR part 744 補充第 4 號／Supplement No. 4）——與《國際緊急經濟權力法》（International Emergency Economic Powers Act, IEEPA；50 U.S.C. 1701 et seq.）之上。","bg":"本法認為，美國民間企業擁有之閉源 AI 模型（closed-source AI model）為美國經濟與國安關鍵；受關注實體（entity of concern）透過「模型萃取攻擊（model extraction attack）」未經授權取得模型權重、架構等技術特徵，威脅美國國安、外交與智慧財產；而合規之授權訓練與模型萃取攻擊本質不同。","body":"本法建立識別、嚇阻並懲罰模型萃取攻擊與詐欺帳號網路提供者的三項機制。模型萃取攻擊是指受關注實體未經授權，萃取美國閉源 AI 模型的能力，用以複製或訓練另一模型。\n(1) 商務部會同出口政策運作委員會（OCEP）完成初次評估、維護公開的「AI 模型萃取攻擊者清單」，並向國會提交年度報告\n(2) 工業與安全副部長會同終端用戶審查委員會（ERC），審議將經認定實體列入 BIS 實體清單\n(3) 授權總統依 IEEPA 凍結並禁止經認定實體的在美財產與交易，並設國家安全例外。","track":"LC"},{"code":"E-8","disp":"LC-09","item":"半導體技術韌性、完整性與防衛強化法案（STRIDE 法案）","id":"H.R. 6058（眾議院），第 119 屆國會","year":"2025","date":"2025-11-17","prog":"T3 委員會通過——眾院 H.R. 6058 經眾議院外交委員會（House Foreign Affairs Committee）2026-04-22 以 44–0 表決通過修正案性質之替代案（amendment in the nature of a substitute，全案抽換）並決議報告（ordered reported, as amended）。無參院對應版本。","who":"眾院（H.R. 6058）：領銜眾議員 Bill Huizenga（R-MI），偕關島代表 James C. Moylan（R-GU）、眾議員 Dan Crenshaw（R-TX）","law":"美國國會立法權創設之新法定協調與升級機制，運作於《2018 年出口管制改革法》（Export Control Reform Act of 2018, ECRA；50 U.S.C. 4801 et seq.）授權體系之上——本法課國務院就美國國家安全損害提出運用 ECRA 一切權限之建議。受關注國家（countries of concern）援引《10 U.S.C. 4872(f)》受涵蓋國家定義；實體清單（Entity List）指工業與安全局（Bureau of Industry and Security, BIS）維護、載於《15 CFR part 744 補充第 4 號》（Supplement No. 4）者。","bg":"本法認為，全球半導體技術供應鏈攸關美國與盟國之國家安全、經濟競爭力與技術領先；中華人民共和國（PRC）透過非市場手段、出口管制違規與規避、經濟間諜、軍民融合與掠奪性投資謀求半導體技術產業主導，並將助其軍事現代化與人權侵害；保護關鍵半導體技術之出口管制，與主要盟邦及夥伴合作辦理時更為有效；充分運用特定之美國出口管制權限，經證實可有效防止經由第三國生產規避或迴避美國出口管制。\n本法並宣示美國政策為：維持美國與盟邦夥伴在半導體技術研究、設計、製造與先進材料之技術領先；防止 PRC 取得全球半導體技術供應鏈之關鍵卡點；與盟邦及夥伴國協調以擴大並強化半導體技術保護；確保美國技術與智慧財產不助長 PRC 之軍事現代化、人權侵害，及對美國與其盟邦夥伴之技術支配追求；促進美國盟邦與夥伴間具韌性、安全且可信之半導體供應鏈。","body":"本法以法定指令要求國務院與具半導體技術（semiconductor technology，涵蓋積體電路、製造設備與子系統零組件、設計軟體與智慧財產、材料與特化學品、測試組裝封裝設備等）能力之國家協調，建立保護關鍵半導體技術免遭受關注國家取得之共同做法，並就八項協調目標尋求共識：製造設備與關鍵子零組件之管制對齊、設計工具與智慧財產移轉及設備維修服務之限制擴大、軍民兩用（dual-use）材料管制協調、聯合監測執法以防第三國規避與外國回補（backfilling）、風險資訊分享、可信供應商網絡、管制成效嚴格檢討，以及防止技術經投資、人才外流與間諜而外流之其他協調做法。\n本法並設未合作後果機制：國務卿諮詢商務部長定期評估各協調國落實情形，經認定某國未採行關鍵安全措施者，須作成缺失認定、與該國溝通、通報國會，並與商務部長透過出口顧問審查委員會（Export Advisory Review Board）協調研提因應行動建議；該國逾期仍不願合作即須依該等建議採取行動。國務院並須定期就外交推動現況與多邊協調成效向國會報告，報告採非密形式、得附機密附件。","track":"LC"},{"code":"F-1","disp":"LC-10","item":"維持美國優勢之出口管制透明度法案","id":"H.R. 1316（眾議院）／S. 744（參議院對應版）\nPublic Law 119-34（2025-08-19）；修正《2018 年出口管制改革法》（ECRA）§1756（50 U.S.C. 4815）","year":"2025","date":"2025-08-19","prog":"T5 已成法——H.R. 1316 於 2025-05-05 眾院通過、2025-07-22 參院通過、2025-08-19 簽署成 Public Law 119-34","who":"美國國會制定（Public Law 119-34）；眾院提案人眾議員 Ronny Jackson（R-TX）","law":"本法以 Public Law 119-34 修正《2018 年出口管制改革法》（Export Control Reform Act of 2018, ECRA）§1756（50 U.S.C. 4815），新增 (e) 款報告義務。","bg":"本法以「維持美國優勢」為名強化出口管制行政之透明度：使國會掌握對受涵蓋實體（covered entity）之受控物項出口許可決定與終端用途查核情形，以利監督出口管制之執行成效。","body":"本法修正 ECRA §1756（50 U.S.C. 4815）新增 (e) 款，課商務部長於本法生效後 1 年內、其後至少每年（視撥款），向眾議院外交委員會與參議院銀行、住宅暨都市事務委員會提交報告，內容涵蓋對受涵蓋實體之受控物項出口／再出口／釋出／境內移轉之許可申請（與其他授權請求）及相關終端用途查核（end-use check）。報告須逐案載明申請人、物項描述（含出口管制分類碼 ECCN 與管制理由）、終端用戶名稱與所在地、價值估計、決定與日期，及終端用途查核之日期、地點、結果與彙總統計；除彙總統計外之資訊依 §1761(h)(1) 免公開揭露，並排除可能危及調查之資訊。受涵蓋實體為位於 D:5 國家群組且列於實體清單（Entity List，15 CFR part 744 補充第 4 號）或軍事終端用戶清單（Military End User List, MEU List，補充第 7 號）者。","track":"LC"},{"code":"F-2","disp":"LC-11","item":"出口管制執行法案","id":"H.R. 4505（眾議院），第 119 屆國會","year":"2025","date":"2025-07-17","prog":"T3 委員會通過——眾院 H.R. 4505 經眾議院外交委員會（House Foreign Affairs Committee）2026-04-22 以 41–3 表決通過修正案性質之替代案並決議報告（ordered reported in the nature of a substitute；基礎文本為 Kamlager-Dove 替代案）。無參院對應版本。","who":"眾院（H.R. 4505）：領銜眾議員 Sydney Kamlager-Dove（D-CA），偕眾議員 Bill Huizenga（R-MI）、Gregory W. Meeks（D-NY）、Jefferson Shreve（R-IN）","law":"美國國會立法權創設之新法定方案（Export Control Officer Program），運作於既有出口管制執行體系——《2018 年出口管制改革法》（Export Control Reform Act of 2018, ECRA）與《出口管理規則》（Export Administration Regulations, EAR；15 CFR parts 730–774）。","bg":"本法認為，終端用途查核（end-use check）為驗證受控物項是否依美國許可與規則使用、評估非法轉移風險之關鍵；查核不確定或失敗，亦可能導致該局誤將人員列入觀察名單、誤拒出口特權或誤啟執法與刑事程序。惟工業與安全局（Bureau of Industry and Security, BIS）至 2025 年僅有 11 名駐外出口管制官員、常一人兼管數國且多國無人派駐（2024 年處理逾 4.5 萬件許可申請、總值逾 5,000 億美元；2024 會計年度於 60 國執行逾 1,400 次查核）；工業與安全副部長 Jeffrey Kessler 於 2025-06-12 對眾議院外交委員會南亞暨中亞小組委員會作證時表示，該局希望將出口管制官員增至 30 名。故須增派駐外人力以有效防堵並查獲技術非法轉移。","body":"本法課商務部（透過工業與安全副部長〔Under Secretary for Industry and Security〕）於生效後 90 日內設立為期 5 年之「出口管制官員方案（Export Control Officer Program）」，於美國駐外使領館部署至少 30 名出口管制官員（export control officer），並任命方案主任統籌招募、會同國務院策略性部署以確保全球各區地理覆蓋。各官員於駐地執行職責：管理並執行終端用途查核、向使領館提供出口管制政策諮詢、對業界推廣合規、與外國政府聯絡協調、向工業與安全局（Bureau of Industry and Security, BIS）分享執法挑戰與趨勢資訊、並辨識應執行終端用途查核之最佳對象。","track":"LC"},{"code":"F-3","disp":"LC-12","item":"ECRA 民事罰則提高法案","id":"H.R. 5853（眾議院），第 119 屆國會；修正《2018 年出口管制改革法》（ECRA）§1760（50 U.S.C. 4819）（引進版無法定短名，正式長題為「To amend the Export Control Reform Act of 2018 to increase the civil penalties...」；「ECRA Penalty Increase Act」為眾院 markup／通稱）","year":"2025","date":"2025-10-28","prog":"T3 委員會通過——眾院 H.R. 5853 經眾議院外交委員會（House Foreign Affairs Committee）2026-04-22 以 44–0 表決決議報告（ordered reported）；無參院對應版本","who":"眾院（H.R. 5853）：領銜眾議員 Keith Self（R-TX），偕眾議員 Michael T. McCaul（R-TX）","law":"本法提案修正《2018 年出口管制改革法》（Export Control Reform Act of 2018, ECRA）§1760（50 U.S.C. 4819）之民事罰則（civil penalty）條款，提高罰額上限。","bg":"本法旨在提高出口管制違規之民事罰則上限，強化 ECRA 執行之嚇阻力（修法前 §1760(c)(1)(A) 每次違規上限為 30 萬美元或交易額 2 倍）。","body":"本法修正 ECRA §1760(c)(1)(A)（50 U.S.C. 4819(c)(1)(A)），將每次違規之民事罰則上限由 30 萬美元提高至 120 萬美元，並將「交易額之 2 倍」提高至「交易額之 4 倍」（兩者取其高）；適用於本法生效後所犯之 ECRA 或其下規則、命令、許可之違規。","track":"LC"},{"code":"F-4","disp":"LC-13","item":"保障美國 AI 晶片優先取得法案（GAIN AI 法案）","id":"S. 3150（參議院）／H.R. 5885（眾議院），第 119 屆國會\n新增《2018 年出口管制改革法》（ECRA）第一部分 §1758A（50 U.S.C. 4811 et seq.）","year":"2025","date":"2025-10-31","prog":"T2 受阻——S. 3150（參院，2025-11-06 二讀後付參議院銀行、住宅暨都市事務委員會）與 H.R. 5885（眾院，2025-10-31 付眾議院外交委員會）均付委審議中、未經委員會審查（markup）。GAIN AI 條款曾納入參院通過之 2026 財年國防授權法案（FY2026 NDAA，S. 2296，2025-10-09 整案以 77–20 通過），但未納入最終成法之 FY2026 NDAA（Public Law 119-60／S. 1071）；獨立法案（standalone bill）仍存為立法備案","who":"參院（S. 3150）：領銜參議員 Jim Banks（R-IN），偕參議員 Elizabeth Warren（D-MA）、Tom Cotton（R-AR）、Charles E. Schumer（D-NY）、David H. McCormick（R-PA）、Christopher A. Coons（D-DE）\n眾院（H.R. 5885）：領銜眾議員 John R. Moolenaar（R-MI），偕眾議員 Raja Krishnamoorthi（D-IL）","law":"本法新增 ECRA 第一部分 §1758A（50 U.S.C. 4811 et seq.）「先進積體電路出口管制」。","bg":"本法以「保障美國 AI 晶片取得」為旨：要求先進 AI 晶片於出口受關注國家前先滿足美國客戶需求，避免國內供應遭排擠，藉以維持美國在關鍵 AI 晶片之領先。","body":"本法新增 ECRA §1758A：對輸往受關注國家（country of concern）實體之「受涵蓋晶片（covered circuit or product）」——即為資料中心設計／行銷之先進積體電路（advanced integrated circuit）——課工業與安全副部長（Under Secretary for Industry and Security）之出口許可\n取得該許可者須認證美國客戶優先——即美國人享優先承購權（right of first refusal，經公開通知與詢購期並予優先），且申請人無美國國內訂單積壓（backlog）、未對外國買家提供優於美國客戶之價格條件\n未附認證者一律拒發。另設可信美國人（trusted United States person）豁免：晶片輸往非受關注國家且運作中仍由可信美國人擁有控制者，免除《出口管理規則》（EAR）之相關出口許可要求\n可信美國人之安全、晶片留存、持股與稽核等標準由美國商務部工業與安全局（Bureau of Industry and Security, BIS）訂定。","track":"LC"},{"code":"F-6","disp":"LC-14","item":"出口管制執行與強化法案","id":"H.R. 8169（眾議院），第 119 屆國會；修正《2018 年出口管制改革法》（ECRA）§1754（50 U.S.C. 4813）","year":"2026","date":"2026-03-30","prog":"T3 委員會通過——眾院 H.R. 8169 經眾議院外交委員會（House Foreign Affairs Committee）2026-04-22 以 44–0 表決通過修正案性質之替代案並決議報告（ordered reported in the nature of a substitute；基礎文本為 Mast 替代案）。無參院對應版本。","who":"眾院：領銜眾議員 Ann Wagner（R-MO），偕眾議員 Michael Lawler（R-NY）","law":"本法修正《2018 年出口管制改革法》（Export Control Reform Act of 2018, ECRA）§1754（50 U.S.C. 4813），新增 (g) 款加速審議程序。","bg":"本法旨在加速實體清單之變更決策：使終端用戶審查委員會（End-User Review Committee, ERC）成員得逕提增列／移除／修改案並於定期內表決，俾更即時將違反美國國安或外交政策利益之實體納管。","body":"本法修正 ECRA §1754（50 U.S.C. 4813）新增 (g) 款，建立實體清單（Entity List）之加速審議程序：終端用戶審查委員會（ERC）任一成員得逕向委員會提出增列、移除或修改提案，委員會須於 30 日內表決（經提案人同意得延長 15 日補件、或經全體同意延後）\n增列須經 ERC 過半數認定該實體曾、正或有風險從事「違反美國國安或外交政策利益」之活動，且增列實體預設適用「拒絕推定（presumption of denial）」之出口許可政策（ERC 得以過半數就特定物項另設政策）。每位成員一票、主席不得否決或推翻表決\n主席應將決定通知出口管理助理部長（Assistant Secretary of Commerce for Export Administration）執行\n本款不限縮或影響與終端用戶審查委員會無關之升級程序。","track":"LC"},{"code":"F-7","disp":"LC-15","item":"半導體管制有效性法案（2026）","id":"H.R. 8287（眾議院），第 119 屆國會","year":"2026","date":"2026-04-15","prog":"T3 委員會通過——眾院 H.R. 8287 經眾議院外交委員會（House Foreign Affairs Committee）2026-04-22 以 43–0 表決通過修正並決議報告（ordered reported, amended）（通過之修正案為 Stanton 修正案 #74；另一件 Stanton 修正案 #75 未獲通過，19–25）。無參院對應版本。","who":"眾院：領銜眾議員 Greg Stanton（D-AZ），偕眾議員 Darrell Issa（R-CA）","law":"美國國會立法權創設之獨立報告義務；不創設新出口管制權，目的為以實證資料評估現行半導體出口管制之成效並對外公開。","bg":"本法認為，對半導體製造設備與先進積體電路之出口管制攸關美國國安及與中國之 AI 競賽；管制成效須以嚴謹、數據導向之方式評估，且公開實證影響有助各界理解特定管制之國安、外交與經濟效果。","body":"本法課國務院情報與研究局助理國務卿（會同工業與安全副部長、國家情報總監 DNI）於生效後 360 日內向國會提交一份評估美國對中國半導體、半導體製造設備（SME）、半導體材料及相關消耗性投入之出口管制衝擊與成效之報告，以非密形式公布、得附機密附件。","track":"LC"},{"code":"F-8","disp":"LC-16","item":"出口管制跨機關協調法案（2026）","id":"H.R. 8036（眾議院），第 119 屆國會；修正《2018 年出口管制改革法》（ECRA）§1754（50 U.S.C. 4813）","year":"2026","date":"2026-03-24","prog":"T3 委員會通過——眾院 H.R. 8036 經眾議院外交委員會（House Foreign Affairs Committee）2026-04-22 以 25–19 表決通過修正案性質之替代案並決議報告（ordered reported in the nature of a substitute；基礎文本為 Baird 替代案）。無參院對應版本。","who":"眾院：領銜眾議員 Jim Baird（R-IN）","law":"本法修正《2018 年出口管制改革法》（Export Control Reform Act of 2018, ECRA）§1754（50 U.S.C. 4813）（新增跨機關規則提案程序）並課新法定評估義務。","bg":"本法旨在強化出口管制之跨機關協調與對中國軍民融合（military-civil fusion, MCF）之因應：使國務院、國防部、能源部得就出口管制規則逕提案並由跨機關委員會定期表決，並要求國務院評估中國軍民融合對美出口管制與國安之影響、據以推動政策調整。","body":"本法分兩部分：其一修正 ECRA §1754，將「諮詢」改為「協調」，並新增跨機關規則提案程序——國務院、國防部或能源部得向出口管理審查委員會（EARB）提新訂／修正 EAR 之提案，30 日內表決、簡單多數通過者由商務部長啟動規則制定；該提案程序於生效後 3 年落日。其二課國務院（諮商 OCEP 各代表機關）於 30 日內完成對中國軍民融合策略之檢討、90 日內另檢討有無國家已充分對齊出口管制而可適用《EAR》§740.20 之許可例外、並於 90 日內就前述兩項檢討所辨識之政策調整（含軍事終端用戶清單 MEU List 擴列、EAR 新訂或修訂、§740.20 許可例外增修等）考慮向 EARB 提案、150 日內向國會報告。","track":"LC"},{"code":"F-9","disp":"LC-17","item":"工業與安全局許可行政強化法案","id":"H.R. 8284（眾議院），第 119 屆國會；新增《2018 年出口管制改革法》§1769、修正 §1754","year":"2026","date":"2026-04-15","prog":"T3 委員會通過——眾院 H.R. 8284 經眾議院外交委員會（House Foreign Affairs Committee）2026-04-22 以 43–1 表決通過修正並決議報告（ordered reported, amended）（通過之修正案為 McCaul 修正案 #43）。無參院對應版本。","who":"眾院：領銜眾議員 Michael T. McCaul（R-TX），偕眾議員 Michael Lawler（R-NY）、Johnny Olszewski（D-MD）","law":"本法新增《2018 年出口管制改革法》（Export Control Reform Act of 2018, ECRA）一節並修正其技術諮詢委員會條文，強化出口管制許可之行政一致性與透明度，並就先進運算積體電路盡職調查規則課檢討與報告義務。","bg":"本法旨在強化工業與安全局（Bureau of Industry and Security, BIS）出口管制許可之行政一致性與透明度：使受告知函（is-informed letter）等個案性管制通知納入與正式許可相同之跨機關程序並設落日／公開要求，公開拒絕推定（presumption of denial）之審查標準，重整技術諮詢委員會（technical advisory committee）體系以涵蓋運算、AI、半導體、量子等關鍵技術，並定期檢討先進運算積體電路（advanced computing integrated circuits）之盡職調查規則。","body":"本法分三大機制：其一新增 ECRA「許可行政之強化」一節，要求告知函／補充許可要求須循正式跨機關許可程序、設落日、並公開拒絕推定審查標準（事前送國會）；其二修正 ECRA §1754 重設技術諮詢委員會體系，明定須就運算（半導體／微電子／AI／量子）、生技、自動化、航太、先進材料、WMD、新興與基礎技術、法規程序等各設委員會；其三課商務部就先進運算 IC 額外盡職調查 IFR 定期檢討、120 日內向國會報告。","track":"LC"},{"code":"F-10","disp":"LC-18","item":"外國對手取得受管制物項威脅分析法案（ADVERSARIES 法案）","id":"H.R. 6331（眾議院），第 119 屆國會","year":"2025","date":"2025-12-01","prog":"T3 委員會通過——眾院 H.R. 6331 經眾議院外交委員會（House Foreign Affairs Committee）2026-04-22 以 44–0 表決通過修正案性質之替代案並決議報告（ordered reported in the nature of a substitute）。無參院對應版本。","who":"眾院：領銜眾議員 Max L. Miller（R-OH），偕眾議員 Jefferson Shreve（R-IN）、Michael T. McCaul（R-TX）及關島代表 James C. Moylan（R-GU）","law":"美國國會立法權創設之新法定審查與報告義務，運作於《2018 年出口管制改革法》（Export Control Reform Act of 2018, ECRA）與《出口管理規則》（Export Administration Regulations, EAR）既有體系之上；不修正 ECRA 定義條文，亦不創設新出口管制權。受審查對象之界定引用實體清單（Entity List，15 CFR part 744 Supplement No. 4）與軍事終端用戶清單（Military End User List, MEU List；Supplement No. 7）。","bg":"本法認為，受美國出口管制列管實體之美國境內設籍關係企業，可能成為其境外最終母公司規避管制、取得受限物項之途徑；又外國對手所控制之資通訊技術與服務（information and communications technology and services, ICTS）本身可能構成國安與管制有效性風險。為此先以法定審查釐清問題規模與樣態，再據以研議法律修正。","body":"本法課商務部工業與安全局（Bureau of Industry and Security, BIS）次長，透過資通訊技術與服務辦公室（Office of Information and Communications Technology and Services, OICTS）主任，於生效後 90 日內完成一項威脅審查，並於完成後 30 日內向國會提交結果。審查聚焦兩條路徑：其一為實體清單或軍事終端用戶清單（MEU List）所列實體之美國境內設籍關係企業（合計持股達 50% 以上者），能否取得其母公司因美國出口管制而受限之物項；其二為外國對手控制之資通訊技術與服務對國安與管制有效性所生風險。審查並須提出行政因應措施與法律修正建議。本法不修正 ECRA 定義條文，亦不創設新管制工具。","track":"LC"},{"code":"G-1b","disp":"LC-19","item":"全棧 AI 出口促進法案","id":"H.R. 6996（眾議院），第 119 屆國會","year":"2026","date":"2026-01-09","prog":"T3 委員會通過——眾院 H.R. 6996 經眾議院外交委員會（House Foreign Affairs Committee）2026-04-22 以 37–7 表決通過修正案性質之替代案並決議報告（ordered reported in the nature of a substitute）。無參院對應版本。","who":"眾院：領銜眾議員 Randy Fine（R-FL），偕眾議員 Bill Huizenga（R-MI）","law":"美國國會立法權創設之新成文授權，將美國全棧 AI 技術之全球出口推廣法制化；不創設新出口管制權。外國對手（foreign adversaries）採《美國法典》第 10 編第 4872 條第 (f) 款受涵蓋國家（covered nation）定義。","bg":"本法認美國正處於 AI 全球主導地位之競賽，勝者將獲廣泛經濟與軍事利益；確立美國 AI 為全球黃金標準、使盟邦在美國技術上建構 AI，有助美國勝出；先進 AI 算力為 AI 時代關鍵，阻斷對手取得攸關地緣競爭與國安。為此將全棧 AI 出口推廣法制化。","body":"本法案擬以六項措施促進美國全棧 AI 技術出口：\n(1) 商務部設立產業聯盟提案計畫，受理符合美國安全要求與標準的全棧 AI 出口提案\n(2) 商務部與國務院分工處理外國市場障礙，並由國務院制定出口推廣外交策略\n(3) 商務部會同國家情報總監與國務院，研究全球 AI 部署對美國及盟邦的效益與影響\n(4) 商務部會同國務院、國防部與能源部，與外國買方合作建立防止對手取得已部署美國全棧 AI 技術的安全措施\n(5) 商務部會同國務院及產業聯盟，發展可向外國買方證明隱私、保密、安全與效能的作法、產品與標準\n(6) 商務部會同國家情報總監與國務院，建立美國全棧 AI 出口成效追蹤機制。","track":"LC"},{"code":"F-5","disp":"M-01","item":"出口管制執行程序強化系列法案（2026-04-22 眾議院外交委員會 markup）","id":"多案彙總：H.R. 8202／7962／8288／8289／4920／6322／8285／7003（第 119 屆國會）","year":"2026","date":"2026-04-22","prog":"T3 委員會通過——本條目所列各案均經眾議院外交委員會（House Foreign Affairs Committee）2026-04-22 markup 決議報告，惟結果分三種：\n・以修正案性質之替代案為基礎文本並決議報告（as amended）：H.R. 4920（Meeks 替代案 #123，39–5）\n・通過定點修正案並決議報告（as amended）：H.R. 6322（Huizenga〔原 Kean〕修正案 #56，43–1）\n・未經修正即決議報告（ordered reported）：H.R. 8202（44–0）、H.R. 7962（44–0）、H.R. 8285（44–0）、H.R. 8289（44–0）、H.R. 8288（39–5）、H.R. 7003（42–2）","who":"多案彙總、各案提案人不同（如 H.R. 7003 領銜眾議員 Jefferson Shreve（R-IN）等；詳各案 congress.gov）","law":"《2018 年出口管制改革法》（Export Control Reform Act of 2018, ECRA；50 U.S.C. §4801 et seq.），其中相關既有條文為 §1756（50 U.S.C. §4815）、§1757(c)（50 U.S.C. §4816(c)）、§1760（50 U.S.C. §4819）、§1763(c)（50 U.S.C. §4822(c)）與 §1765(a)（50 U.S.C. §4824(a)）。另兩項未修正 ECRA 之獨立成文指令，上游法源為美國憲法第一條之國會立法權，無單一既存授權母法。","bg":"2026-04-22，眾議院外交委員會於同一場 markup 通過多項出口管制相關法案，涵蓋出口管制違規追訴期、機關間爭議解決、合規協助、許可處理期限、資訊系統現代化、吹哨者獎勵、競爭性市場檢討及行政量能等議題。","body":"2026-04-22，眾議院外交委員會（HFAC）於 markup 通過：H.R. 8202（出口管制違規 10 年追訴期，修正 ECRA）、H.R. 7962（機關間爭議解決）、H.R. 8288（ECRA 合規協助）、H.R. 8289（90 日許可處理時限）、H.R. 4920（工業與安全局資訊系統現代化）、H.R. 6322（吹哨者獎勵）、H.R. 8285（競爭性市場檢討）與 H.R. 7003（BIS STRENGTH Act，授權 BIS 聘用至多 25 名專家）。","track":"M"},{"code":"BL-1","disp":"BL-01","item":"2018 年出口管制改革法（ECRA）","id":"Public Law 115–232, div. A, title XVII, subtitle B（§§1741–1781；2019 年增訂 §1782）；132 Stat. 2208；法典化 50 U.S.C. §§4801–4852","year":"2018","date":"2018-08-13","prog":"T5 現行有效——2018-08-13 制定，確立現行兩用品出口管制常設授權。","who":"美國國會（總統 2018-08-13 簽署成法）","law":"國會制定法（隨 2019 財政年度國防授權法〔Pub. L. 115–232〕通過）","bg":"1979 年出口管理法（Export Administration Act of 1979, EAA；50 U.S.C. §4601 et seq.）於 2001-08-20 屆期後，出口管理條例（EAR）長期依 EO 13222 按國際緊急經濟權力法（International Emergency Economic Powers Act, IEEPA；50 U.S.C. §1701 et seq.）以年度緊急狀態延續效力，兩用品出口管制欠缺常設法源。本法終結此過渡狀態，並廢止 EAA 大部條文（50 U.S.C. §§4601–4610、4614–4623）；其法定政策宣示（50 U.S.C. §4811）明列管制目的：限制對他國軍事潛力有重大貢獻之出口、防止大規模毀滅性武器與常規武器擴散、保存美國質性軍事優勢、維持美國於科學技術工程與製造之領先、確保國安管制聚焦於足以構成嚴重國安威脅之核心技術等。","body":"美國兩用品出口管制之現行授權母法：終結 EAA 屆期後依 EO 13222／IEEPA 逐年延續之過渡狀態，給予常設法定基礎；既有 EAR 與其下命令、許可依過渡條款繼續有效。含三類制度要素：\n(1) 常設授權與管轄（50 U.S.C. §§4812–4815）：總統管制受美國管轄物項之出口、再出口與境內移轉及美國人特定活動；商務部施行許可制度\n(2) 新興與基礎技術（§4817）：跨部會程序識別並管制新興與基礎技術（emerging and foundational technologies）\n(3) 罰則與執行（§§4819–4820）：刑事／民事罰則與商務部執法權\n截至《美國法典》2024 年版所載版本\n條文沿革：\n2018-08-13 隨 2019 財政年度國防授權法（John S. McCain National Defense Authorization Act for Fiscal Year 2019）制定，並廢止 1979 年出口管理法大部條文\n2019-02-15 修正（Pub. L. 116–6 §205）：明定工業與安全副部長經參議院同意任命，並增設兩名助理部長職位（增訂 50 U.S.C. §4852）\n2022-12-23 修正（Pub. L. 117–263 §5589(b)）：美國人活動管制所列「外國軍事情報部門」增列「安全」，成為「外國軍事、安全或情報部門」\n本法另含反抵制制度（Anti-Boycott Act of 2018）與工業與安全副部長職位法定化等組成部分","track":"BL"},{"code":"BL-2","disp":"BL-02","item":"EAR 管轄與適用範圍一般規則","id":"15 CFR Part 734（原始頒布 61 FR 12746）","year":"1996","date":"1996-03-25","prog":"T5 現行有效——1996-03-25 EAR 重編建立 Part 734 管轄框架。","who":"美國商務部（U.S. Department of Commerce；現行主管機關為工業與安全局〔Bureau of Industry and Security, BIS〕）","law":"授權母法：2018 年出口管制改革法（Export Control Reform Act of 2018, ECRA；50 U.S.C. §4801–4852）；出口管理法（Export Administration Act, EAA；50 U.S.C. §4601 et seq.）；國際緊急經濟權力法（International Emergency Economic Powers Act, IEEPA；50 U.S.C. §1701 et seq.）","bg":"1996 年 EAR 全面重編（61 FR 12746）將美國兩用品出口管制規章體系化，Part 734 為其管轄總則，界定何謂「受 EAR 管轄」（subject to the EAR）之物項與行為。針對性算力管制的觸及範圍——所管物項範圍與域外效力範圍——皆以本部一般規則為前提。","body":"EAR 第 734 部的管轄框架包括兩個面向：\n(1) 物項範圍：美國境內物項、美國原產物項、含有或混入受控美國成分的外國製品、特定外國直接產品，以及由符合直接產品條件的境外廠房或主要組件生產的外國產品\n(2) 受管制行為：出口、再出口、釋出與境內移轉；向外國人釋出受管制技術可能構成視同出口（deemed export）\n境外生產物項是否受 EAR 管轄，另依兩項一般機制判斷：\n(1) 最低含量（de minimis）規則，判斷含美國成分之外國製品是否納管\n(2) 外國直接產品規則（FDPR），作為華為、先進運算等特定外國直接產品規則的共同管轄框架。\n依 eCFR 2026-07-01 版核對之版本（資料截至 2026-06-30）\n條文沿革：\n2016-06-03 行為定義整併修訂\n2022-02-03 外國直接產品規則的一般框架整併至 §734.9","track":"BL"},{"code":"BL-3","disp":"BL-03","item":"數位電腦效能門檻管制（APP）","id":"ECCN 4A003（15 CFR Part 774 Supplement No. 1）、EAR §740.7；APP 參數創設 71 FR 20876","year":"2006","date":"2006-04-24","prog":"T5 現行有效——2006-04-24 規則創設 APP 參數並更名授權例外。","who":"美國商務部工業與安全局（Bureau of Industry and Security, BIS）","law":"授權母法：2018 年出口管制改革法（Export Control Reform Act of 2018, ECRA；50 U.S.C. §4801–4852）——創設時依出口管理法（Export Administration Act, EAA）授權、由 EO 13222 依國際緊急經濟權力法（IEEPA）延續 EAR 效力；實施框架：出口管理條例（Export Administration Regulations, EAR；15 CFR Parts 730–774）；多邊基礎：瓦聖納協定（Wassenaar Arrangement）2005-12 全會決議","bg":"沿用逾十年之綜合理論效能（Composite Theoretical Performance, CTP，單位 MTOPS）計算困難，且因電腦架構與半導體技術劇變而無法正確排序電腦效能；2004 年國防部與能源部評估後，跨部會確認以調整後峰值效能（Adjusted Peak Performance, APP）取代，並經瓦聖納協定 2005-12 全會決議採認新參數與管制水準。2006-04-24 規則據以創設 APP 參數，將管制聚焦於國安關注度最高之高階系統，並廢除 EAR 高效能電腦專節。","body":"EAR 對數位電腦之基線效能管制：以調整後峰值效能（APP，單位 Weighted TeraFLOPS）為管制參數。含兩類制度要素：\n(1) 物項門檻管制：ECCN 4A003 對超過門檻之數位電腦與聚合用電子組件課國家安全理由許可要求，門檻以下由低階 ECCN 承接\n(2) 分級授權例外（License Exception APP）：依電腦分級國別（Computer Tier）放寬電腦與關聯技術軟體之出口，附再出口限制與報告義務\n條文沿革：\n2006-04-24 依瓦聖納協定 2005-12 全會決議創設 APP 參數（初始門檻 0.75 WT；取代 CTP／MTOPS 制、授權例外由 CTP 更名為 APP、廢除高效能電腦專節）\n至 2022-10 先進運算管制前之版本（eCFR 2022-09-30 版），4A003.b 門檻為 29 WT\n2022-10-07 起之先進運算管制（ECCN 3A090／4A090 等，87 FR 62186；效能參數初為位元長×TOPS 聚合、2023-10 起定名總處理效能〔TPP〕）與 2023-10 於 4A003 增設之 .z 段均載於 EB-04a、EB-04b","track":"BL"},{"code":"BL-4","disp":"BL-04","item":"通用積體電路物項管制","id":"ECCN 3A001.a（15 CFR Part 774 Supplement No. 1）；納入現行 CCL 之重編規則 61 FR 12714","year":"1996","date":"1996-03-25","prog":"T5 現行有效——1996-03-25 EAR 重編暫行規則將 3A001 納入現行 CCL 架構（1996-04-24 生效）。","who":"美國商務部出口管理局（Bureau of Export Administration, BXA；現為工業與安全局〔Bureau of Industry and Security, BIS〕）","law":"授權母法：2018 年出口管制改革法（Export Control Reform Act of 2018, ECRA；50 U.S.C. §4801–4852）；納入時出口管理法（Export Administration Act, EAA；50 U.S.C. §4601 et seq.）已屆期（1994-08-20）、EAR 由 EO 12924 依國際緊急經濟權力法（IEEPA）延續效力（其後依 EO 13222、2018 年起依 ECRA 常設授權）；實施框架：出口管理條例（Export Administration Regulations, EAR；15 CFR Parts 730–774）","bg":"1996-03-25 暫行規則將出口管理條例全面重編簡化、整併既有管制清單為現行商業管制清單（Commerce Control List, CCL）架構，通用積體電路條目（3A001.a）納入其中；納入時微處理器款與同時期高效能電腦管制同採綜合理論效能（Composite Theoretical Performance, CTP）參數體系。","body":"以 ECCN 3A001.a 界定受國家安全與反恐理由管制之通用積體電路類別與技術門檻（特定物項另受飛彈技術理由管制），為 2022-10 前積體電路出口管制之基線清單。\n條文沿革：\n1996-03-25 隨 EAR 重編納入現行 CCL（.a 涵蓋輻射硬化、寬溫域、微處理器〔三種擇一門檻，含 32 位元以上算術邏輯單元且綜合理論效能 80 Mtops 以上〕、記憶體、類神經網路等類別；1996-04-24 生效）\n至 2022-10 先進運算管制前之版本（eCFR 2022-09-30 版），.a 涵蓋 .a.1–.a.14（微處理器款限化合物半導體製造且時脈逾 40 MHz、獨立記憶體門檻款成保留款、資料轉換與可程式邏輯門檻更新）\n2022-10-07 起之先進運算積體電路管制（ECCN 3A090 創設，87 FR 62186）載於 EB-04a\n2023-10-25 起於 3A001 增設之 .z 段（88 FR 73458；2024-04-04 細分為四子款，89 FR 23876）載於 EB-04b、EB-04d","track":"BL"},{"code":"BL-5","disp":"BL-05","item":"資訊安全（加密）管制與 ENC 授權例外","id":"ECCN 5A002／5D002 等（CCL 第 5 類第 2 部）、15 CFR §740.17、§742.15；加密物項移轉規則 61 FR 68572","year":"1996","date":"1996-12-30","prog":"T5 現行有效——1996-12-30 暫行規則依 EO 13026 將加密物項自美國軍品清單移轉至商業管制清單。","who":"美國商務部（U.S. Department of Commerce；現行主管機關為工業與安全局〔Bureau of Industry and Security, BIS〕）","law":"授權母法：2018 年出口管制改革法（Export Control Reform Act of 2018, ECRA；50 U.S.C. §4801–4852）；出口管理法（Export Administration Act, EAA；50 U.S.C. §4601 et seq.）；國際緊急經濟權力法（International Emergency Economic Powers Act, IEEPA；50 U.S.C. §1701 et seq.）；行政命令 EO 13026（61 FR 58767，加密物項管轄移轉）","bg":"1996 年前加密品屬國務院軍品清單管轄（《國際武器貿易條例》〔International Traffic in Arms Regulations, ITAR〕）；EO 13026 及 1996-12-30 暫行規則將其移轉至商務部，以兼顧商用加密流通與國家安全、外交政策及執法利益。§742.15 明文此管制與美國作為瓦聖納協定（Wassenaar Arrangement）成員之國際義務一致。先進運算物項與加密條目之交會由 .z 子段承載（如 5A002.z），其適用先進運算授權例外前另須同時符合 ENC。","body":"加密物項管制包括兩類制度：\n(1) 清單管制\n列管物項：加密資訊安全物項列於商業管制清單（Commerce Control List, CCL）第 5 類第 2 部，包括 5A002、5B002、5D002、5E002 與 5A004\n管制理由：5A002 的管制理由包括國家安全（NS）、區域穩定（RS）、反恐（AT）與加密物項（EI）；EI 許可政策依 §742.15\n大眾市場物項：符合 Note 3 者，經 §740.17(b) 分類或自我分類後，改列 5A992.c／5D992.c\n(2) 加密授權例外（License Exception Encryption, ENC；§740.17）\n適用：授權多數加密物項輸出\n申報義務：依物項層級提交自我分類報告或 30 日分類申請，部分物項另須提交銷售報告\n排除：不適用於國家群組 E:1／E:2，包括境內服務及向其國民釋出原始碼或技術。\n依 eCFR 2026-07-01 版核對之版本（資料截至 2026-06-30）\n條文沿革：\n2016-09-20 授權例外 ENC 現行架構全面改寫","track":"BL"},{"code":"BL-6","disp":"BL-06","item":"半導體製造設備物項管制","id":"ECCN 3B001（15 CFR Part 774 Supplement No. 1）；納入現行 CCL 之重編規則 61 FR 12714","year":"1996","date":"1996-03-25","prog":"T5 現行有效——1996-03-25 EAR 重編暫行規則將 3B001 納入現行 CCL 架構（1996-04-24 生效）。","who":"美國商務部出口管理局（Bureau of Export Administration, BXA；現為工業與安全局〔Bureau of Industry and Security, BIS〕）","law":"授權母法：2018 年出口管制改革法（Export Control Reform Act of 2018, ECRA；50 U.S.C. §4801–4852）；納入時出口管理法（Export Administration Act, EAA；50 U.S.C. §4601 et seq.）已屆期（1994-08-20）、EAR 由 EO 12924 依國際緊急經濟權力法（IEEPA）延續效力（其後依 EO 13222、2018 年起依 ECRA 常設授權）；實施框架：出口管理條例（Export Administration Regulations, EAR；15 CFR Parts 730–774）","bg":"1996-03-25 暫行規則將出口管理條例全面重編簡化、整併既有管制清單為現行商業管制清單（Commerce Control List, CCL）架構，半導體製造設備條目 3B001 納入其中；部分半導體製造設備至遲於 1991-08-28 已受國家安全管制。","body":"以 ECCN 3B001 界定受國家安全理由管制之半導體製造設備與專設組件範圍，為 2022-10 前半導體製造設備出口管制之基線清單。\n條文沿革：\n1996-03-25 隨 EAR 重編納入現行 CCL（當時範圍為磊晶成長設備；1996-04-24 生效）\n至 2022-10 對中國半導體製造設備管制前之版本（eCFR 2022-09-30 版），涵蓋磊晶、離子佈植、晶圓傳送、微影、光罩與 EUV 光罩基板等類別\n2022-10-07 起之對中國半導體製造設備許可（ECCN 3B090 創設）與 2023-10 之 SME 管制重構（3B090 改列 3B001／3B002、國別擴至澳門與 Country Group D:5）均載於 EB-04a、EB-04c","track":"BL"},{"code":"BL-7","disp":"BL-07","item":"軍事終端用途管制框架","id":"15 CFR §744.21、Supplement No. 2 to Part 744；原始頒布 72 FR 33646","year":"2007","date":"2007-06-19","prog":"T5 現行有效——2007-06-19 規則創設對中國之軍事終端用途許可要求。","who":"美國商務部工業與安全局（Bureau of Industry and Security, BIS）","law":"授權母法：2018 年出口管制改革法（Export Control Reform Act of 2018, ECRA；50 U.S.C. §4801–4852）；出口管理法（Export Administration Act, EAA；50 U.S.C. §4601 et seq.）；國際緊急經濟權力法（International Emergency Economic Powers Act, IEEPA；50 U.S.C. §1701 et seq.）——創設時依 EAA 授權、由 EO 13222 依 IEEPA 延續 EAR 效力","bg":"美國政策為便利對中國合法民用終端用戶之出口，同時防止增強中國軍事能力之出口；美國長期政策不許可對中國軍事能力有直接且重大貢獻之出口，並有意管制原本輸往中國無須許可、但明知供軍事終端用途之兩用物項。BIS 並述明本管制與美國作為瓦聖納協定（Wassenaar Arrangement）參與國之承諾一致。其後之擴張：俄羅斯（2014-09-17）為對俄制裁之一環；委內瑞拉（2014-11-07）為回應委內瑞拉軍方暴力鎮壓、與既有武器禁運互補。","body":"EAR 終端管制軸之軍事終端用途基線建制：在商業管制清單（Commerce Control List, CCL）許可要求之外，對特定國家軍事流向課補充性許可要求。含兩類一般禁止：\n(1) 明知（knowledge）型許可要求：Supp. No. 2 to Part 744 所列兩用物項，明知或經 BIS 告知供中國軍事終端用途、或俄羅斯／委內瑞拉軍事終端用途／用戶時須經許可\n(2) 軍品系物項一般許可要求：9x515 與 600 series 物項輸往中國／俄／委內瑞拉一律須經許可\n兩者共用 EAR §744.21(e) 逐案審查標準。\n至 2020-06-29 軍事終端用途／用戶管制擴張生效前之版本（eCFR 2019-12-31 版）\n條文沿革：\n2007-06-19 創設時僅及中國軍事終端用途\n2013-10-15 軍品系物項款生效（600 series）\n2014-06-27 納入 9x515\n2014-09-17 擴及俄羅斯並增軍事終端用戶要件\n2014-11-07 擴及委內瑞拉\n2020-04-28 公告（2020-06-29 生效）之定義擴大、中國軍事終端用戶納管與軍事終端用戶清單（MEU List）建立載於 EB-03（85 FR 23459、85 FR 83793）","track":"BL"},{"code":"BL-8","disp":"BL-08","item":"國家群組與禁運框架","id":"15 CFR Part 740 Supplement No. 1（國家群組）、15 CFR Part 746（禁運與其他特別管制）；原始頒布 61 FR 12768／61 FR 12806","year":"1996","date":"1996-03-25","prog":"T5 現行有效——1996-03-25 EAR 重編建立目的地群組與禁運架構，其後歷經多次修訂。","who":"美國商務部（U.S. Department of Commerce；現行主管機關為工業與安全局〔Bureau of Industry and Security, BIS〕）","law":"授權母法：2018 年出口管制改革法（Export Control Reform Act of 2018, ECRA；50 U.S.C. §4801–4852）；出口管理法（Export Administration Act, EAA；50 U.S.C. §4601 et seq.）；國際緊急經濟權力法（International Emergency Economic Powers Act, IEEPA；50 U.S.C. §1701 et seq.）；Part 746 另援引 22 U.S.C. §287c 等制裁相關授權","bg":"EAR 以目的地為軸之管制分層基礎：Supplement No. 1 to Part 740 將世界各目的地分入國家群組，供 EAR 全篇之許可要求、授權例外適格與審查政策引用；Part 746 則聚合全面禁運與特別管制目的地之規則。針對性算力管制之目的地要件——如輸 D:5 之許可要求、授權例外對 E:1／E:2 之排除——皆以本框架之群組定義為前提。","body":"目的地管制包括兩類制度：\n(1) 國家群組（Supplement No. 1 to Part 740）\nA 群：多邊建制參與國及授權例外 STA 適格目的地（A:1–A:6）\nB 群：其他依 EAR 編組的國家\nD 群：涉及國家安全、核、生化、飛彈或武器禁運顧慮的目的地（D:1–D:5）\nE 群：支恐國家（E:1）與單邊禁運國家（E:2）\n(2) 禁運與特別管制（EAR 第 746 部）\n全面管制：古巴、伊朗與敘利亞分別適用各該專節的許可與禁運規定\n其他專節：北韓、俄羅斯／白俄羅斯、克里米亞及其他被占領區另有專節管制。\n依 eCFR 2026-07-01 版核對之版本（資料截至 2026-06-30）","track":"BL"},{"code":"BL-9","disp":"BL-09","item":"實體清單制度","id":"15 CFR §744.11、§744.16、Supplement No. 4／No. 5 to Part 744；原始頒布 62 FR 4910","year":"1997","date":"1997-02-03","prog":"T5 現行有效——1997-02-03 規則創設實體清單。","who":"美國商務部（U.S. Department of Commerce；現行主管機關為工業與安全局〔Bureau of Industry and Security, BIS〕；創設時主管機關為出口管理局〔Bureau of Export Administration〕）","law":"授權母法：2018 年出口管制改革法（Export Control Reform Act of 2018, ECRA；50 U.S.C. §4801–4852）；出口管理法（Export Administration Act, EAA；50 U.S.C. §4601 et seq.）；國際緊急經濟權力法（International Emergency Economic Powers Act, IEEPA；50 U.S.C. §1701 et seq.）；Part 744 另援引 22 U.S.C. §3201 et seq.、42 U.S.C. §2139a 等防擴散授權","bg":"EAR 終端使用者管制軸（一般禁令五，EAR §736.2(b)(5)）原以個別通知或修訂 EAR 方式告知出口人對特定實體之許可要求；1997 年創設實體清單（Entity List）以公示此類許可要求。本制度使美國出口管制不僅及於國家別，並及於個別客戶與實體。2008 年擴大列名事由，公示受關注實體以強化公眾對交易對象之篩查能力，並減少以一般命令對個別對象課許可要求之需要。其後針對性管制之實體列名行動與外國直接產品規則（foreign-produced direct product rule）腳註掛鉤皆於本制度架構內進行。","body":"實體清單包括三類制度要素：\n(1) 清單本體（Supplement No. 4 to Part 744）：逐列記載實體、許可要求、審查政策與聯邦公報出處\n(2) 許可效果（EAR §744.16）：對列名實體及高轉運風險地址課各條目所定的附加許可要求，原則上不適用授權例外\n(3) 列名治理（§744.11、Supplement No. 5 to Part 744）：規定列名判準、跨部會決定程序及除名或修改申請\nBIS 亦得依 §744.11(c) 以個別通知對特定未列名對象或地址課同類許可要求；清單條目腳註可連結特定外國直接產品規則。\n依 eCFR 2026-07-01 版核對之版本（資料截至 2026-06-30）\n條文沿革：\n1997-02-03 規則創設實體清單\n2008-08-21 規則擴大列名事由並法典化跨部會審查程序","track":"BL"},{"code":"BL-10","disp":"BL-10","item":"瓦聖納協定","id":"多邊出口管制建制，無美國法規編號；基本文件《初始要素》（Initial Elements，1996）","year":"1996","date":"1996-07-12","prog":"T5 現行有效（多邊建制）——1996-07-11／12 全會成立，並於同年 9 月開始運作。","who":"瓦聖納協定參與國（創始 33 國、現行 42 國；決策機構為採共識決之全會〔Plenary〕，秘書處設於維也納）","law":"《初始要素》（Initial Elements，1996 年基本文件）——建制措施依各參與國國內法與政策、以國家自主裁量（national discretion）實施","bg":"冷戰結束後，原巴黎統籌委員會（Coordinating Committee on Multilateral Export Controls, COCOM）之東西方對抗架構不再適用，其成員推動新建制；1996 年 33 國成立瓦聖納協定，為首個全球性之傳統武器與敏感兩用品及技術出口管制多邊建制。美國商業管制清單（CCL）上以國家安全（NS）為管制事由之物項，一般即為同時列於瓦聖納兩用品清單之物項，並含部分瓦聖納軍品清單物項（EAR §742.4(a)）。","body":"瓦聖納協定包含下列制度要素：\n(1) 參與國共同維持《兩用品與技術清單》及《軍品清單》，並相互通報軍備移轉及特定受控兩用品的移轉或拒發\n(2) 各參與國依其國內法自主決定許可與執行方式（national discretion）\n(3) 美國以商業管制清單（Commerce Control List, CCL）實施兩用品清單；EAR 國家群組 A:1 依 Supplement No. 1 to Part 740 表列 40 個目的地。註 1 以瓦聖納參與國排除馬爾他、俄羅斯與烏克蘭作概括說明，但表列另含非現行瓦聖納參與國之冰島；具體適用範圍以 A:1 表列目的地為準\n(4) 出口人依 EAR 第 743 部，就特定授權例外下敏感清單物項的出口，向 BIS 提交半年報告。\n截至 2026-07-05 之建制快照（兩用品清單 WA-LIST (25) 1 Corr.），參與國 42，含 2025-12 全會增修","track":"BL"}]},"CODE_OF":{"1":"A-1a","2":"A-1a","3":"A-1a","4":"A-1b","5":"A-1c","6":"A-1d","7":"A-1d","8":"A-1d","9":"A-1d","10":"A-1d","11":"A-2","12":"A-3","13":"A-3","14":"B-1","15":"B-10","16":"B-10","17":"B-10","18":"B-2","19":"B-2","20":"B-3","21":"B-3","22":"B-3","23":"B-4a","24":"B-4a","25":"B-4a","26":"B-4a","27":"B-4a","28":"B-4a","29":"B-4b","30":"B-4b","31":"B-4b","32":"B-4b","33":"B-4b","34":"B-4c","35":"B-4c","36":"B-4c","37":"B-4c","38":"B-4c","39":"B-4d","40":"B-4d","41":"B-4d","42":"B-4d","43":"B-4d","44":"B-4e","45":"B-4e","46":"B-4e","47":"B-4e","48":"B-4e","49":"B-4e","50":"B-4e","51":"B-4e","52":"B-5","53":"B-5","54":"B-5","55":"B-5","56":"B-6a","57":"B-6a","58":"B-6 L-7":"https://www.ecfr.gov/on/2019-12-31/title-15/subtitle-B/chapter-VII/subchapter-C/part-744/section-744.21\nhttps://www.ecfr.gov/on/2019-12-31/title-15/subtitle-B/chapter-VII/subchapter-C/part-744/appendix-Supplement%20No.%202%20to%20Part%20744\nhttps://www.federalregister.gov/documents/2007/06/19/E7-11588/revisions-and-clarification-of-export-and-reexport-controls-for-the-peoples-republic-of-china-prc\nhttps://www.federalregister.gov/documents/2013/04/16/2013-08352/revisions-to-the-export-administration-regulations-initial-implementation-of-export-control-reform\nhttps://www.federalregister.gov/documents/2014/05/13/2014-10807/revisions-to-the-export-administration-regulations-ear-control-of-spacecraft-systems-and-related\nhttps://www.federalregister.gov/documents/2014/09/17/2014-22207/russian-sanctions-addition-of-persons-to-the-entity-list-and-restrictions-on-certain-military-end\nhttps://www.federalregister.gov/documents/2014/11/07/2014-26465/venezuela-implementation-of-certain-military-end-uses-and-end-users-license-requirements-under-the\nhttps://www.federalregister.gov/documents/2014/12/29/2014-30019/corrections-and-clarifications-to-the-export-administration-regulations\nhttps://www.federalregister.gov/documents/2015/07/13/2015-16904/clarifications-and-corrections-to-the-export-administration-regulations-ear-control-of-spacecraft","BL-1":"https://www.govinfo.gov/content/pkg/USCODE-2024-title50/html/USCODE-2024-title50-chap58.htm\nhttps://www.govinfo.gov/content/pkg/PLAW-115publ232/html/PLAW-115publ232.htm","BL-3":"https://www.ecfr.gov/on/2022-09-30/title-15/subtitle-B/chapter-VII/subchapter-C/part-774/appendix-Supplement%20No.%201%20to%20Part%20774\nhttps://www.ecfr.gov/on/2022-09-30/title-15/subtitle-B/chapter-VII/subchapter-C/part-740/section-740.7\nhttps://www.federalregister.gov/documents/2006/04/24/06-3647/implementation-of-new-formula-for-calculating-computer-performance-adjusted-peak-performance-app-in","BL-6":"https://www.ecfr.gov/on/2022-09-30/title-15/subtitle-B/chapter-VII/subchapter-C/part-774/appendix-Supplement%20No.%201%20to%20Part%20774\nhttps://www.federalregister.gov/documents/1996/03/25/96-4173/export-administration-regulation-simplification-of-export-administration-regulations","BL-4":"https://www.ecfr.gov/on/2022-09-30/title-15/subtitle-B/chapter-VII/subchapter-C/part-774/appendix-Supplement%20No.%201%20to%20Part%20774\nhttps://www.ecfr.gov/on/2022-09-30/title-15/subtitle-B/chapter-VII/subchapter-C/part-744/section-744.17\nhttps://www.federalregister.gov/documents/1996/03/25/96-4173/export-administration-regulation-simplification-of-export-administration-regulations"},"GRP_EN":{"Chip Production Inputs":"Chip Production Inputs","Semiconductor Supply Chain":"Semiconductor Supply Chain","Data Center Infra Inputs":"Data Center Infrastructure Inputs","Hardware Operations":"Hardware Operations","Algorithms and Data":"Algorithms and Data","AI Training":"AI Training","End-Use":"End Use"},"GLOSS":{"FDPR":"Foreign Direct Product Rule｜外國直接產品規則：EAR 將管制延伸至「在境外、以美國技術／軟體／設備生產之外國產品」的機制。","EAR":"Export Administration Regulations｜出口管理條例：美國商務部 BIS 主管之兩用物項出口管制法規（15 CFR Parts 730–774）。","BIS":"Bureau of Industry and Security｜工業與安全局：美國商務部轄下執行 EAR 出口管制之機關。","ECRA":"Export Control Reform Act of 2018｜出口管制改革法：EAR 之現行成文法授權（50 U.S.C. §§4801–4852）。","IEEPA":"International Emergency Economic Powers Act｜國際緊急經濟權力法：總統於國家緊急狀態下管制經濟交易之授權（50 U.S.C. §1701 et seq.）。","ECCN":"Export Control Classification Number｜出口管制分類號：商業管制清單上識別物項管制類別之編號（如 3A090）。","CCL":"Commerce Control List｜商業管制清單：EAR 下依 ECCN 編列受管制物項之清單。","Entity List":"實體清單：BIS 維護之受管制對象名單；與列名實體之特定交易須事先申請出口許可。","IaaS":"Infrastructure as a Service｜基礎設施即服務：雲端業者提供運算、儲存、網路等基本資源供客戶部署運行之服務模式。","KYC":"Know Your Customer｜客戶身分識別：源自金融反洗錢之客戶身分查核與盡職調查程序。","CIP":"Customer Identification Program｜客戶識別計畫：IaaS 提供者依規執行之客戶身分識別程序。","VEU":"Validated End-User｜驗證最終用戶：BIS 事先核可之最終用戶，授權範圍內取得特定管制物項可免逐案許可。","MEU":"Military End User｜軍事最終用戶：EAR 對特定國家軍事最終用戶之端用途管制（§744.21）。","FEOC":"Foreign Entity of Concern｜受關注外國實體：美國法規對特定外國（含中國）關聯實體之指稱。","OSAT":"Outsourced Semiconductor Assembly and Test｜外包封裝測試：半導體後段封裝與測試之委外代工。","DPA":"Defense Production Act｜國防生產法：賦予政府為國防目的調動產業資源與資訊之授權。","FLOP":"Floating-Point Operation｜浮點運算：衡量運算量之單位；用於定義「先進」算力之數值門檻（如 10^26 FLOP）。","D:5":"EAR Country Group D:5：EAR 國別分組中出口管制最嚴格之一群（含中國、俄羅斯等）。","NPRM":"Notice of Proposed Rulemaking｜規則制定提案公告：行政程序中正式徵求公眾意見之法規草案。","IFR":"Interim Final Rule｜過渡最終規則：先行生效並同時徵求意見之法規形式。","SME":"Semiconductor Manufacturing Equipment｜半導體製造設備：製造晶片所需之光刻、沉積、蝕刻、佈植、量測、封測等設備；先進製程設備（EUV／DUV 光刻機）為對中出口管制核心卡點。","HBM":"High Bandwidth Memory｜高頻寬記憶體：堆疊式高速記憶體，為先進 AI 加速器訓練效能之關鍵瓶頸；HBM3／HBM3E 為先進世代，2024-12 列入 ECCN 3A090.c。","TPP":"Total Processing Performance｜總處理效能：BIS 自 2023 年改採之先進算力管制計算基礎，綜合運算速度、精度、記憶體頻寬，取代早期「位元×TOPS」單一指標以防規避。","TOPS":"Tera Operations Per Second｜每秒兆次運算：衡量晶片運算吞吐量之單位；BIS 早期以「位元×TOPS」定義先進算力門檻，後由 TPP 取代。","GPU":"Graphics Processing Unit｜圖形處理器：具大規模平行運算能力之處理器，為 AI 訓練主流加速器（如 NVIDIA H100／H200）。","EDA":"Electronic Design Automation｜電子設計自動化：晶片設計所需之軟體工具（Cadence、Synopsys 等）；因美國主導，成為 FDPR 長臂管轄之關鍵卡點。","DUV":"Deep Ultraviolet Lithography｜深紫外光微影：技術等級低於 EUV 之微影設備；中國藉進口荷蘭 DUV 機台以多重曝光生產先進製程，為 MATCH Act 對齊重點。","EUV":"Extreme Ultraviolet Lithography｜極紫外光微影：最先進製程必需之微影設備，全球僅荷蘭 ASML 生產；屬對中管制核心。","DRAM":"Dynamic Random-Access Memory｜動態隨機存取記憶體：主流揮發性記憶體；其總頻寬為 H200／MI325X 等晶片 case-by-case 管制門檻指標之一。","CSP":"Cloud Service Provider｜雲端服務商：提供雲端運算資源之業者（AWS、Azure、Google Cloud 等）；為雲端／遠距算力管制之主要適用對象。","footnote 4":"FDPR Footnote 4｜FDPR 第 4 註腳：2022-10 規則設立之 Entity List 註腳，對列名之特定中國實體啟動 FDPR，及於含美技術之外國產品。","footnote 5":"FDPR Footnote 5｜FDPR 第 5 註腳：2024-12 規則設立之 FDPR 註腳，將長臂管轄擴及更廣之多國實體名單。","NAC":"Notified Advanced Computing｜通知型先進運算授權例外：EAR §740.8 之授權例外，符合條件之先進運算交易可免逐案許可但須通報 BIS。","ACA":"Advanced Computing Authorized｜先進運算授權例外：EAR §740.8 之授權例外，對符合條件之先進運算物項予以授權出口。","GP10":"General Prohibition Ten｜一般禁止第 10 條：EAR 禁止對「明知違反或將導致違反 EAR」之物項進行交易；2025-05 guidance 據此將華為 Ascend 系列列為推定違規。","RFF":"Restricted Fabrication Facility｜受限製造設施：EAR 授權例外之一，規範與受限半導體製造設施相關之交易條件。","MIEU":"Military-Intelligence End Use/User｜軍事情報終端用途／用戶：EAR §744.22 對軍事情報終端用途／用戶之管制，適用於所有 EAR 物項及美國人之支援行為。","NEA":"National Emergencies Act｜國家緊急狀態法：規範總統宣告國家緊急狀態之程序；與 IEEPA 併用，為雲端、對外投資等管制之授權軌。","ERC":"End-User Review Committee｜最終用戶審查委員會：BIS 主持之跨部會委員會，決定 Entity List 之列名與除名。","OICTS":"Office of Information and Communications Technology and Services｜資通訊技術與服務辦公室：商務部專責 ICT 供應鏈安全之單位，為 IaaS CIP 規則與 Connected Vehicles 規則之執行單位。","ITA":"International Trade Administration｜國際貿易署：商務部推廣美國商業利益之單位（有別於管出口許可之 BIS），主管 American AI Exports Program。","OFAC":"Office of Foreign Assets Control｜外國資產管制辦公室：財政部執行經濟與貿易制裁之單位，維護 SDN 制裁名單。","SDN":"Specially Designated Nationals List｜特別指定國民名單：OFAC 之制裁名單；名單上對象資產遭凍結、美國人禁與其交易。","AECA":"Arms Export Control Act｜武器出口管制法：規範美國軍售之成文法；其「國會事前通知＋審查期」機制為 AI OVERWATCH Act（E-4）所借用。","ECO":"Export Control Officer｜出口管制官：BIS 派駐海外、執行最終用途查證與合規外展之人員；其人力不足為多項執行強化立法之背景。","TCP":"Technology Control Plan｜技術控制計畫：VEU 等授權申請須提交之文件，載明防止受控技術外流之內部管控措施。","HFAC":"House Foreign Affairs Committee｜眾議院外交事務委員會：美國聯邦眾議院之外交委員會；多數晶片／AI 出口管制法案於此 markup（審查表決）。","NDAA":"National Defense Authorization Act｜國防授權法：每年通過之國防政策與預算授權法；常為其他政策之立法載體（如 GAIN AI Act 曾擬納入）。","CBO":"Congressional Budget Office｜國會預算辦公室：為國會提供法案成本估算之無黨派機構。","CHIPS Act":"CHIPS and Science Act (2022)｜晶片與科學法：2022 年成法，提供半導體製造補助並設「防護欄」（15 CFR Part 231），限制受補助者於中國等國擴產。","OISP":"Outbound Investment Security Program｜對外投資安全計畫：依 EO 14105 設立、財政部主管之對外投資審查機制，管制美國人對中國半導體／量子／AI 之敏感投資（見 A-3）。","OMB":"Office of Management and Budget｜管理及預算辦公室：白宮轄下機關，主管預算編製與法規審查（轄下 OIRA 審查重大法規）。","DOJ":"Department of Justice｜司法部：聯邦執法與刑事追訴機關；出口管制刑事案件由其起訴。","OSTP":"Office of Science and Technology Policy｜科技政策辦公室：白宮科技政策幕僚機關。","NIST":"National Institute of Standards and Technology｜國家標準暨技術研究院：商務部轄下標準與技術機構，主導 AI 風險與安全標準。","APNSA":"Assistant to the President for National Security Affairs｜國家安全顧問：總統首席國安幕僚。","SIA":"Semiconductor Industry Association｜半導體產業協會：美國半導體業界代表組織。","CBP":"Customs and Border Protection｜海關及邊境保護局：國土安全部轄下機關，於邊境執行進出口查驗。","EXIM":"Export-Import Bank of the United States｜美國進出口銀行：聯邦出口信貸機構，為美國出口提供融資與保證。","AAEP":"American AI Exports Program｜美國 AI 出口計畫：依 EO 14320 設立、商務部 ITA 主管之 AI 全棧出口推廣計畫（見 G-1a）。","RASA":"Remote Access Security Act｜遠距存取安全法：擬修正 ECRA、授權 BIS 管制 remote access 之法案（見 D-1）。","MATCH Act":"Multilateral Alignment of Technology Controls on Hardware Act｜硬體技術管制多邊對齊法：要求盟國對 DUV 等半導體設備管制對齊、逾期啟動 FDPR 之法案（見 E-5）。","GAIN AI Act":"（見 F-4）：要求先進 AI 晶片於出口前須優先滿足美國國內客戶需求之國會法案。","STRIDE Act":"Semiconductor Technology Resilience, Integrity, and Defense Enhancement Act｜半導體技術韌性、完整性與防衛強化法：指示國務院主導盟國半導體出口管制多邊對齊之法案（H.R. 6058，見 E-8）。","FR":"Federal Register｜聯邦公報：美國聯邦政府公告法規、規則與通知之官方刊物（引用格式如「90 FR 12345」）。","CFR":"Code of Federal Regulations｜聯邦法規彙編：聯邦行政法規之彙編（引用格式如「15 CFR Part 744」）。"},"trackOf":{"A-1a":"EW","A-1b":"EW","A-1c":"EW","A-1d":"EW","A-2":"EW","A-3":"EW","B-1":"EB","B-10":"EB","B-2":"EB","B-3":"EB","B-4a":"EB","B-4b":"EB","B-4c":"EB","B-4d":"EB","B-4e":"EB","B-5":"EB","B-6a":"EB","B-6b":"EB","B-7a":"EB","B-7b":"EB","B-9":"EB","BL-10":"BL","BL-2":"BL","BL-5":"BL","BL-8":"BL","BL-9":"BL","C-1":"EB","C-2":"EW","C-3":"EB","D-1":"LC","E-1":"LC","E-2":"LC","E-3":"LC","E-4":"LC","E-5":"LC","E-6":"LC","E-7":"LC","E-8":"LC","F-1":"LC","F-10":"LC","F-2":"LC","F-3":"LC","F-4":"LC","F-5":"M","F-6":"LC","F-7":"LC","F-8":"LC","F-9":"LC","G-1a":"EW","G-1b":"LC","BL-7":"BL","BL-1":"BL","BL-3":"BL","BL-6":"BL","BL-4":"BL"},"TRACKS":[{"code":"EW","zh":"行政·白宮·總統","en":"Executive - White House / President"},{"code":"EB","zh":"行政·BIS","en":"Executive - BIS"},{"code":"EU","zh":"行政·USTR·其他機關","en":"Executive - USTR / other agency"},{"code":"LC","zh":"立法·國會","en":"Legislative - Congress"},{"code":"M","zh":"meta 事件索引","en":"Meta index"},{"code":"BL","zh":"基線制度","en":"Baseline regimes"}],"cats_en":["Semiconductor Hardware (AI Accelerators / ICs)","Semiconductor Manufacturing Equipment (SME)","Fabrication Capacity / Facilities","Critical Components (HBM / Advanced Packaging)","Manufacturing / Foundry Services & Personnel","Software & Design Tools (EDA)","AI Models & Weights","Cloud / Re </sc-for>
</nav>
